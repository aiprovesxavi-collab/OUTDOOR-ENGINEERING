<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avisa d’un problema</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1d2a1b; --ink-2:#5b6858; --ink-3:#8a9486; --line:#e2e7df; --line-2:#c6d0c1; --bg-2:#f5f8f3; --green:#2f7d4a; --green-2:#e4f1e8; --red:#b8432b; --red-2:#fbebe7; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#fff; color:var(--ink); font:16px/1.5 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
  .barra{ height:5px; background:var(--green); }
  .pag{ max-width:560px; margin:0 auto; padding:18px 18px 60px; }
  .cap{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .cap .marca{ font-weight:600; color:var(--green); }
  .idioma{ display:inline-flex; border:1px solid var(--line-2); border-radius:6px; overflow:hidden; }
  .idioma button{ border:0; background:transparent; padding:4px 10px; font:inherit; font-size:14px; cursor:pointer; color:var(--ink-2); }
  .idioma button.on{ background:var(--green); color:#fff; }
  h1{ font-size:24px; font-weight:500; margin:18px 0 4px; }
  .lloc{ font-size:20px; font-weight:600; margin:0 0 4px; }
  .sub{ color:var(--ink-2); margin:0 0 18px; font-size:15px; }
  .f{ display:flex; flex-direction:column; gap:5px; margin:0 0 14px; }
  .f .l{ font-size:14px; color:var(--ink-2); } .f .l b{ color:var(--red); font-weight:500; }
  .f .hint{ font-size:13px; color:var(--ink-3); }
  input[type=text],input[type=email],input[type=tel],textarea{ font:inherit; color:var(--ink); background:#fff; border:1px solid var(--line-2); border-radius:6px; padding:11px 12px; width:100%; }
  textarea{ min-height:120px; resize:vertical; }
  input:focus,textarea:focus,button:focus-visible{ outline:2px solid var(--green); outline-offset:1px; }
  .fotos{ border:1px dashed var(--line-2); border-radius:8px; padding:12px; text-align:center; background:var(--bg-2); }
  .fotos label{ display:inline-block; border:1px solid var(--line-2); background:#fff; border-radius:6px; padding:10px 16px; cursor:pointer; font-weight:500; }
  .fotos input{ display:none; }
  .minis{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:10px; }
  .minis img, .minis .doc{ width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--line-2); background:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; padding:4px; overflow:hidden; }
  .btn{ font:inherit; font-weight:500; border:1px solid var(--green); background:var(--green); color:#fff; border-radius:6px; padding:13px 22px; cursor:pointer; width:100%; font-size:17px; }
  .btn:disabled{ opacity:.6; cursor:default; }
  .msg{ border-radius:6px; padding:10px 14px; margin:0 0 14px; font-size:15px; }
  .msg.err{ background:var(--red-2); color:var(--red); }
  .msg.ok{ background:var(--green-2); color:var(--green); }
  .fet{ text-align:center; padding:30px 0; }
  .fet .ic{ font-size:54px; color:var(--green); }
  .fet h2{ font-weight:500; }
  .peu{ margin-top:30px; font-size:13px; color:var(--ink-3); text-align:center; }
  .progres{ font-size:14px; color:var(--ink-2); margin-top:8px; text-align:center; }
</style>
</head>
<body>
<div class="barra"></div>
<div class="pag" id="pag"><p class="sub">…</p></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Pàgina pública d'avís d'un problema: s'hi arriba pel codi QR del lloc (report.html?lloc=CODI).
   Només pot fer una cosa: desar l'avís (nom, correu, telèfon, descripció i fotos) per a aquell lloc. No llegeix res més. */
const BUCKET = 'documents';
const T = {
  ca: { titol: 'Avisa d’un problema', sub: 'Explica’ns què passa i, si pots, fes-ne una foto. L’equip de manteniment ho revisarà i t’informarà per correu.', nom: 'El teu nom', correu: 'El teu correu', correuHint: 'per informar-te de com es resol', tel: 'Telèfon (opcional)', que: 'Què passa', queHint: 'on és, des de quan, què has vist…', fotos: 'Fotos o vídeos', fotosBtn: 'Fes una foto o tria’n', envia: 'Envia l’avís', enviant: 'Enviant…', pujant: 'Pujant fitxer', de: 'de', gracies: 'Gràcies', rebut: 'Hem rebut el teu avís.', ref: 'Referència', informarem: 'T’escriurem a', altre: 'Avisa d’un altre problema', invalid: 'Aquest enllaç no és vàlid. Torna a escanejar el codi QR del lloc.', faltaNom: 'Posa el teu nom.', faltaCorreu: 'Posa un correu vàlid.', faltaQue: 'Explica què passa.', error: 'No s’ha pogut enviar. Torna-ho a provar d’aquí a un moment.', massaGran: 'és massa gran (màxim 50 MB).', peu: 'Outdoor Engineering Solutions · manteniment de jardins i piscines' },
  es: { titol: 'Avisa de un problema', sub: 'Cuéntanos qué pasa y, si puedes, haz una foto. El equipo de mantenimiento lo revisará y te informará por correo.', nom: 'Tu nombre', correu: 'Tu correo', correuHint: 'para informarte de cómo se resuelve', tel: 'Teléfono (opcional)', que: 'Qué pasa', queHint: 'dónde está, desde cuándo, qué has visto…', fotos: 'Fotos o vídeos', fotosBtn: 'Haz una foto o elige', envia: 'Enviar el aviso', enviant: 'Enviando…', pujant: 'Subiendo archivo', de: 'de', gracies: 'Gracias', rebut: 'Hemos recibido tu aviso.', ref: 'Referencia', informarem: 'Te escribiremos a', altre: 'Avisar de otro problema', invalid: 'Este enlace no es válido. Vuelve a escanear el código QR del lugar.', faltaNom: 'Pon tu nombre.', faltaCorreu: 'Pon un correo válido.', faltaQue: 'Explica qué pasa.', error: 'No se ha podido enviar. Vuelve a intentarlo dentro de un momento.', massaGran: 'es demasiado grande (máximo 50 MB).', peu: 'Outdoor Engineering Solutions · mantenimiento de jardines y piscinas' },
};
let idioma = /^es/i.test(navigator.language || '') ? 'es' : 'ca';
const t = k => T[idioma][k] || k;
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const codi = (new URLSearchParams(location.search).get('lloc') || '').trim().toLowerCase();
let sb = null, lloc = null, fitxers = [], valors = { nom: '', email: '', telefon: '', descripcio: '' };

function config() {
  const p = window.CONFIG_PREDEFINIDA; if (!p || !p.url || !p.key || /XXXX/.test(p.url)) return null;
  return { url: String(p.url).trim().replace(/\/+$/, ''), key: String(p.key).trim() };
}
function capcalera() {
  return `<div class="cap"><span class="marca">Outdoor</span><span class="idioma"><button class="${idioma === 'ca' ? 'on' : ''}" data-idioma="ca">Català</button><button class="${idioma === 'es' ? 'on' : ''}" data-idioma="es">Castellano</button></span></div>`;
}
function render(err) {
  const pag = $('#pag');
  if (!lloc) { pag.innerHTML = capcalera() + `<h1>${h(t('titol'))}</h1><div class="msg err">${h(t('invalid'))}</div><p class="peu">${h(t('peu'))}</p>`; bindIdioma(); return; }
  pag.innerHTML = capcalera() + `
    <h1>${h(t('titol'))}</h1>
    <p class="lloc">${h(lloc.nom)}${lloc.poblacio ? ' · ' + h(lloc.poblacio) : ''}</p>
    <p class="sub">${h(t('sub'))}</p>
    ${err ? `<div class="msg err">${h(err)}</div>` : ''}
    <form id="frm" novalidate>
      <div class="f"><span class="l">${h(t('nom'))} <b>*</b></span><input type="text" name="nom" autocomplete="name" value="${h(valors.nom)}"></div>
      <div class="f"><span class="l">${h(t('correu'))} <b>*</b></span><input type="email" name="email" autocomplete="email" inputmode="email" value="${h(valors.email)}"><span class="hint">${h(t('correuHint'))}</span></div>
      <div class="f"><span class="l">${h(t('tel'))}</span><input type="tel" name="telefon" autocomplete="tel" inputmode="tel" value="${h(valors.telefon)}"></div>
      <div class="f"><span class="l">${h(t('que'))} <b>*</b></span><textarea name="descripcio">${h(valors.descripcio)}</textarea><span class="hint">${h(t('queHint'))}</span></div>
      <div class="f"><span class="l">${h(t('fotos'))}</span>
        <div class="fotos"><label>${h(t('fotosBtn'))}<input type="file" id="fitxers" multiple accept="image/*,video/*"></label><div class="minis" id="minis"></div></div></div>
      <button class="btn" type="submit" id="envia">${h(t('envia'))}</button>
      <div class="progres" id="progres"></div>
    </form>
    <p class="peu">${h(t('peu'))}</p>`;
  bindIdioma();
  $('#fitxers').addEventListener('change', e => { fitxers = fitxers.concat([...e.target.files]).slice(0, 20); e.target.value = ''; pintaMinis(); });
  pintaMinis();
  $('#frm').addEventListener('submit', envia);
}
function guardaValors() { const f = $('#frm'); if (!f) return; valors = { nom: f.nom.value, email: f.email.value, telefon: f.telefon.value, descripcio: f.descripcio.value }; }
function bindIdioma() { document.querySelectorAll('[data-idioma]').forEach(b => b.addEventListener('click', () => { guardaValors(); idioma = b.dataset.idioma; document.documentElement.lang = idioma; render(); })); }
function pintaMinis() {
  const box = $('#minis'); if (!box) return;
  box.innerHTML = fitxers.map((f, i) => /^image\//.test(f.type) ? `<img src="${URL.createObjectURL(f)}" alt="" data-i="${i}" title="${h(f.name)}">` : `<span class="doc" data-i="${i}" title="${h(f.name)}">🎞 ${h(f.name.slice(0, 12))}</span>`).join('');
  box.querySelectorAll('[data-i]').forEach(el => el.addEventListener('click', () => { fitxers.splice(Number(el.dataset.i), 1); pintaMinis(); }));
}
// les fotos es redueixen al mòbil (costat màxim 1600 px, JPEG) perquè pugin de pressa; els vídeos van tal qual
function reduirImatge(f) {
  return new Promise(resolve => {
    if (!/^image\/(jpeg|png|webp|heic|heif)/i.test(f.type) || f.size < 400 * 1024) { resolve(f); return; }
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); resolve(b ? new File([b], f.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }) : f); }, 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(f); };
    img.src = url;
  });
}
async function envia(e) {
  e.preventDefault(); guardaValors();
  const v = valors;
  if (!v.nom.trim()) { render(t('faltaNom')); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim())) { render(t('faltaCorreu')); return; }
  if (!v.descripcio.trim()) { render(t('faltaQue')); return; }
  const gran = fitxers.find(f => f.size > 50 * 1024 * 1024); if (gran) { render(gran.name + ' ' + t('massaGran')); return; }
  const btn = $('#envia'), prog = $('#progres'); btn.disabled = true; btn.textContent = t('enviant');
  try {
    const adjunts = [];
    for (let i = 0; i < fitxers.length; i++) {
      prog.textContent = `${t('pujant')} ${i + 1} ${t('de')} ${fitxers.length}…`;
      const f = await reduirImatge(fitxers[i]);
      const path = `incidencies/public/${codi}/${Date.now()}_${i}_${f.name.replace(/[^\w.\-]+/g, '_').slice(-60)}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || undefined });
      if (error) throw error;
      adjunts.push({ path, nom: f.name, tipus: /^video\//.test(f.type) ? 'video' : /^image\//.test(f.type) ? 'foto' : 'document' });
    }
    prog.textContent = '';
    const { data, error } = await sb.rpc('report_public', { p_codi: codi, p_nom: v.nom.trim(), p_email: v.email.trim(), p_telefon: v.telefon.trim() || null, p_descripcio: v.descripcio.trim(), p_adjunts: adjunts });
    if (error) throw error;
    const email = v.email.trim(), nom = v.nom.trim();
    $('#pag').innerHTML = capcalera() + `<div class="fet"><div class="ic">✓</div><h2>${h(t('gracies'))}, ${h(nom)}</h2><p>${h(t('rebut'))}</p><p>${h(t('ref'))}: <b>R-${data}</b> · ${h(lloc.nom)}</p><p>${h(t('informarem'))} <b>${h(email)}</b>.</p><p style="margin-top:26px"><a href="${location.href}" style="color:var(--green)">${h(t('altre'))}</a></p></div><p class="peu">${h(t('peu'))}</p>`;
    bindIdioma(); fitxers = []; valors = { nom: '', email: '', telefon: '', descripcio: '' };
  } catch (err) {
    console.error(err);
    btn.disabled = false; btn.textContent = t('envia'); prog.textContent = '';
    render(t('error') + (err && err.message && /codi no|correu no|cal |massa/.test(err.message) ? ' (' + err.message + ')' : ''));
  }
}
(async () => {
  document.documentElement.lang = idioma;
  const cfg = config();
  if (!cfg || !codi || !/^[0-9a-f]{12}$/.test(codi) || !window.supabase) { render(); return; }
  try {
    sb = supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: false } });
    const { data, error } = await sb.rpc('lloc_public', { p_codi: codi });
    if (error) throw error;
    lloc = data && data[0] ? data[0] : null;
  } catch (e) { console.error(e); lloc = null; }
  render();
})();
</script>
</body>
</html>
