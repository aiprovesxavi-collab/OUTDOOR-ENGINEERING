/* =====================================================================
   CALENDARI D'ACCIONS: mes o setmana amb una franja per acció, de quan es va demanar fins al termini.
   Una gamma de color per fase i un to per tipus d'acció; clicant una franja es veu què es demana.
   ===================================================================== */
const COLORS_ACCIO = {
  obrir: '#8d8d8d', assignar_seguidora: '#6f6f6f', visibilitat_client: '#b5b5b5',                                   // F1 grisos
  diagnosticar: '#1f5fbf', planificar: '#3b7dd8', consultar: '#5e9ae6', demanar_preu: '#8fbcef', pressupost: '#0f3f8f', // F2 blaus
  demanar_instruccions: '#7b4fb3', decisio_client: '#a07fd2', autoritzar_actuacio: '#5e3690',                     // F3 liles
  programar: '#e08a2b', assignar: '#f0a64f', executar: '#c9671a', registrar_resultat: '#f6c88a',                   // F4 taronges
  conclusio: '#2f7d4a', tancar: '#1e5c35', reobrir: '#6db585',                                                    // F5 verds
};
const colorAccio = tipus => COLORS_ACCIO[tipus] || '#8d8d8d';
const textSobre = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#1d2a1b' : '#fff'; };
const dataLocal = ts => ts ? aLocalDT(ts).slice(0, 10) : '';
const deYmd = s => new Date(Number(s.slice(0, 4)), Number(s.slice(5, 7)) - 1, Number(s.slice(8, 10)), 12);
const dillunsDe = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const sumaDies = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); x.setDate(x.getDate() + n); return x; };
const difDies = (a, b) => Math.round((deYmd(b) - deYmd(a)) / 86400000);
// les accions que van al calendari, amb inici (quan es va demanar) i fi (termini; si no en té, fins avui)
function accionsCalendari() {
  const st = state.calAcc, t = trebInc(), avuiS = avui();
  return C.rows('incidencia_accions').filter(a => a.actiu && !['obrir', 'tancar', 'reobrir', 'visibilitat_client'].includes(a.tipus)).map(a => {
    const inc = C.get('incidencies', a.incidencia_id); if (!inc || !inc.actiu) return null;
    const feta = a.estat === 'finalitzada' || inc.estat !== 'oberta';
    if (feta && !st.fetes) return null;
    if ((st.meves || APP_NOMES_TASQUES) && !(t && (Number(a.responsable_treballador_id) === t.id || Number(a.gestor_id) === t.id || Number(a.creat_per) === t.id))) return null; // a l'app, sempre només les pròpies
    let inici = dataLocal(a.creat_el) || avuiS; if (a.inici && dataLocal(a.inici) > inici) inici = dataLocal(a.inici);   // si té data d'inici, la franja comença llavors
    let fi = a.venciment ? dataLocal(a.venciment) : (feta ? dataLocal(a.finalitzada_el) || inici : avuiS); if (fi < inici) fi = inici;
    return { a, inc, inici, fi, feta, sense: !a.venciment, vencuda: !feta && !!a.venciment && new Date() > new Date(a.venciment) };
  }).filter(Boolean);
}
// reparteix les franges d'una setmana en carrils perquè no se solapin
function franjesSetmana(items, dl) {
  const dlS = ymd(dl), dgS = ymd(sumaDies(dl, 6));
  const segs = items.filter(x => x.inici <= dgS && x.fi >= dlS).map(x => ({ x, c1: Math.max(0, difDies(dlS, x.inici)), c2: Math.min(6, difDies(dlS, x.fi)), continuaAbans: x.inici < dlS, continuaDespres: x.fi > dgS }));
  segs.sort((p, q) => p.c1 - q.c1 || (q.c2 - q.c1) - (p.c2 - p.c1) || String(p.x.a.venciment || '').localeCompare(String(q.x.a.venciment || '')) || p.x.a.id - q.x.a.id);
  const carrils = [];
  segs.forEach(sg => { let l = carrils.findIndex(c => c.every(o => sg.c2 < o[0] || sg.c1 > o[1])); if (l < 0) { l = carrils.length; carrils.push([]); } carrils[l].push([sg.c1, sg.c2]); sg.carril = l; });
  return { segs, n: carrils.length };

function etiquetaFranja(x, llarga) {

  return (x.vencuda ? '⚠ ' : x.feta ? '✓ ' : '') + (llarga ? [tp, tit, nomResponsable(a), x.inc.numero].filter(Boolean).join(' · ') : [tp, nomResponsable(a)].filter(Boolean).join(' · '));
}
function setmanaHTML(items, dl, opts) {

  for (let i = 0; i < 7; i++) { const d = sumaDies(dl, i), iso = ymd(d), fe = festiuDe(iso);
    html += `<div class="ca-dia ${i >= 5 ? 'fs' : ''} ${o.mes != null && d.getMonth() + 1 !== o.mes ? 'fora' : ''} ${iso === avuiS ? 'avui' : ''} ${fe ? 'festiu' : ''}" style="grid-column:${i + 1}; grid-row:1 / -1" title="${h(dmy(iso) + (fe ? ' · ' + fe : ''))}"><span class="n">${d.getDate()}${o.setmana ? '<small class="mesabr"> ' + MESOS[d.getMonth()].slice(0, 3).toLowerCase() + '</small>' : ''}</span></div>`; }

    html += `<div class="ca-bar ${sg.x.vencuda ? 'vencuda' : ''} ${sg.x.feta ? 'feta' : ''} ${sg.x.sense ? 'sense' : ''} ${st.sel === a.id ? 'sel' : ''}" data-accio="${a.id}" style="grid-column:${sg.c1 + 1} / ${sg.c2 + 2}; grid-row:${sg.carril + 2}; background-color:${c}; color:${textSobre(c)}; ${sg.continuaAbans ? 'border-top-left-radius:0; border-bottom-left-radius:0;' : ''} ${sg.continuaDespres ? 'border-top-right-radius:0; border-bottom-right-radius:0;' : ''}" title="${h(titol)}">${sg.continuaAbans ? '… ' : ''}${h(etiquetaFranja(sg.x, o.setmana))}</div>`; });
  return html + '</div>';
}

function renderCalendariAccions(main) {

// retalla la imatge quadrada pel centre i la redueix a mida×mida (JPEG); si el navegador no pot, la deixa tal qual
function quadraImatge(file, mida) {
  return new Promise(res => {
    try {
      const canvas = document.createElement('canvas'); const ctx = canvas.getContext && canvas.getContext('2d');
      if (!ctx || !window.URL || !window.Image) return res(file);
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => { try {
        const c = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - c) / 2, sy = (img.naturalHeight - c) / 2;
        canvas.width = mida; canvas.height = mida; ctx.drawImage(img, sx, sy, c, c, 0, 0, mida, mida); URL.revokeObjectURL(url);
        canvas.toBlob(b => res(b || file), 'image/jpeg', 0.88);
      } catch (e) { res(file); } };
      img.onerror = () => { URL.revokeObjectURL(url); res(file); };
      img.src = url;
    } catch (e) { res(file); }
  });
}
// el dia i el mes d'una data coincideixen amb avui? (qui va néixer o va entrar un 29 de febrer, els anys no bixestos compta el 28)
function esAvuiAniversari(iso) {
  if (!iso) return false;
  const d = new Date(), md = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'), dies = [md];
  const any = d.getFullYear(), traspas = (any % 4 === 0 && any % 100 !== 0) || any % 400 === 0;
  if (md === '02-28' && !traspas) dies.push('02-29');
  return dies.includes(String(iso).slice(5, 10));
}

const deNom = nom => (/^[aeiouàèéíòóúh]/i.test(nom) ? 'd’' : 'de ') + nom;

/* =====================================================================
   FITXATGE: entrada i sortida de jornada des de l'app de cadascú. L'hora la posa el servidor; el mòbil aporta la posició.
   Només es pot sortir després d'entrar i a l'inrevés; cap fitxatge un dia de vacances o baixa (ho comprova també la base de dades).
   ===================================================================== */
const horaDe = ts => { const d = new Date(ts); if (isNaN(d.getTime())) return ''; return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const durText = min => { const m = Math.max(0, Math.round(min)); return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min'; };
const fitxatgesDe = trebId => C.rows('fitxatges').filter(f => Number(f.treballador_id) === Number(trebId)).sort((a, b) => String(a.moment).localeCompare(String(b.moment)) || a.id - b.id);
// aparella entrades i sortides: [{ dia, inici, fi (o null si la jornada és oberta), minuts }]
function parellesFitxatge(regs) {
  const out = []; let oberta = null;
  regs.forEach(f => {
    if (f.tipus === 'entrada') { if (oberta) out.push(oberta); oberta = { dia: ymd(new Date(f.moment)), inici: f, fi: null, minuts: 0 }; }
    else if (oberta) { oberta.fi = f; oberta.minuts = (new Date(f.moment) - new Date(oberta.inici.moment)) / 60000; out.push(oberta); oberta = null; }
  });
  if (oberta) { oberta.minuts = (Date.now() - new Date(oberta.inici.moment)) / 60000; out.push(oberta); }

}
const absenciaAvui = t => t ? absenciesActives().find(a => Number(a.treballador_id) === t.id && a.dia === ymd(new Date())) : null;
function estatFitxatgeText(t) {
  if (!t) return 'Entrada i sortida de la jornada.';

  const regs = fitxatgesDe(t.id), ultim = regs[regs.length - 1];
  if (ultim && ultim.tipus === 'entrada') return 'Dins des de les ' + horaDe(ultim.moment) + (ymd(new Date(ultim.moment)) !== ymd(new Date()) ? ' del ' + dmy(ymd(new Date(ultim.moment))) : '') + '.';
  if (ultim && ymd(new Date(ultim.moment)) === ymd(new Date())) return 'Fora des de les ' + horaDe(ultim.moment) + '.';
  return 'Encara no has fitxat avui.';
}
const PIN_SVG = '<svg viewBox="0 0 12 16" aria-hidden="true"><path fill="currentColor" d="M6 0a6 6 0 0 0-6 6c0 4.2 6 10 6 10s6-5.8 6-10a6 6 0 0 0-6-6zm0 8.4A2.4 2.4 0 1 1 6 3.6a2.4 2.4 0 0 1 0 4.8z"/></svg>';
// el pin obre la posició a Google Maps: verd si és dins dels 300 m d'un lloc nostre, vermell si és fora, gris si no hi ha cap lloc amb coordenades
function enllacGps(f, llocs) {
  if (!f) return '';
  if (f.lat == null || f.lng == null) return f.observacions && /sense GPS/i.test(f.observacions) ? `<span class="fx-sense" title="${h(f.observacions)}">sense GPS</span>` : '';
  const p = llocMesProper(Number(f.lat), Number(f.lng), llocs), cls = !p ? 'cap' : p.m <= RADI_LLOC_FEINA_M ? 'dins' : 'fora';
  const titol = 'Posició en fitxar' + (f.precisio ? ' (±' + Math.round(f.precisio) + ' m)' : '') + (p ? ' · ' + (cls === 'dins' ? 'dins dels ' + RADI_LLOC_FEINA_M + ' m de ' : '⚠ a ' + distText(p.m) + ' de ') + p.nom : '');
  return `<a class="fx-gps ${cls}" href="https://maps.google.com/?q=${f.lat},${f.lng}" target="_blank" rel="noopener" title="${h(titol)}">${PIN_SVG}</a>`;

function posicioActual() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('el navegador no té geolocalització'));
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, prec: p.coords.accuracy }),

      { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });

}
// el lloc d'un fitxatge, per a l'app: el lloc nostre més proper si és a menys de 300 m; si no, a quina distància queda del més proper; o sense GPS
function llocFitxatgeText(f, llocs) {

// Fitxar (app): l'estat, els dos botons i la llista d'entrades i sortides amb el lloc de cada una. Sense hores treballades ni totals.
function renderFitxar(main) {

/* Sortida i posta del sol, per avisar quan es fitxa de nit (equació de la sortida del sol, precisió d'uns minuts).
   Es calcula amb la posició del mòbil; si no n'hi ha, amb la de Sant Cugat (només per a aquest càlcul). */

/* =====================================================================
   VACANCES I BAIXES: un registre per treballador i dia (vacances en groc, baixa en blau).
   L'oficina marca els dies al calendari anual d'una persona (o mira el mes de tothom); a l'app cada operari veu només el seu calendari anual.
   ===================================================================== */
const TIPUS_ABS = { vacances: 'Vacances', baixa: 'Baixa' };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const absenciesActives = () => C.rows('absencies').filter(a => a.actiu);
const festiuDe = iso => { const f = C.rows('festius').find(x => x.actiu && x.dia === iso); return f ? f.nom : null; };
const DIES_VACANCES_ANY = 26;  // dies laborables de vacances per any
const MES_LIMIT_VACANCES = 4;  // la quota d'un any es pot gastar fins a l'abril de l'any següent
const esLaborable = iso => { const w = new Date(iso + 'T12:00:00').getDay(); return w >= 1 && w <= 5 && !festiuDe(iso); };
// numera els dies de vacances d'un treballador: 1, 2… fins a 26, només laborables (ni caps de setmana ni festius), per ordre de data.
// Els dies de gener a abril continuen la quota de l'any anterior si encara no és plena; en arribar a 26, el dia següent comença la quota següent a 1.
function numeracioVacances(trebId) {
  const dies = absenciesActives().filter(a => Number(a.treballador_id) === trebId && a.tipus === 'vacances' && esLaborable(a.dia)).map(a => a.dia).sort();
  const out = new Map(), perQuota = new Map(); let quota = null, n = 0;
  for (const dia of dies) {
    const any = Number(dia.slice(0, 4)), mes = Number(dia.slice(5, 7));
    if (quota == null) quota = any; else if (n >= DIES_VACANCES_ANY) { quota += 1; n = 0; }
    if (any > quota + 1 || (any === quota + 1 && mes > MES_LIMIT_VACANCES)) { quota = any; n = 0; }
    n += 1; out.set(dia, { n, quota }); perQuota.set(quota, n);
  }
  return { dies: out, perQuota };
}
// mini calendari d'un mes (dilluns primer): estat(dia 'YYYY-MM-DD') → 'vacances' | 'baixa' | null
function miniMesHTML(any, mes, estat, opts) {
  const o = opts || {}, avuiS = avui();
  const primer = new Date(any, mes - 1, 1), dies = new Date(any, mes, 0).getDate(), buits = (primer.getDay() + 6) % 7;
  let cel = '<div class="h">dl</div><div class="h">dt</div><div class="h">dc</div><div class="h">dj</div><div class="h">dv</div><div class="h">ds</div><div class="h">dg</div>';
  for (let i = 0; i < buits; i++) cel += '<div></div>';
  for (let d = 1; d <= dies; d++) {
    const iso = any + '-' + String(mes).padStart(2, '0') + '-' + String(d).padStart(2, '0'), ds = (buits + d - 1) % 7 >= 5, e = estat(iso), fe = festiuDe(iso);
    const nv = e === 'vacances' && o.num ? o.num(iso) : null;
    cel += `<div class="vac-d ${e || (fe ? 'festiu' : '')} ${ds ? 'fs' : ''} ${iso === avuiS ? 'avui' : ''} ${o.clicable ? 'clic' : ''}" ${o.clicable ? `data-dia="${iso}"` : ''} title="${h((o.titol ? o.titol(iso, e) : dmy(iso)) + (fe ? ' · festiu: ' + fe : '') + (nv ? ' · dia ' + nv.n + ' de ' + DIES_VACANCES_ANY + ' (vacances del ' + nv.quota + ')' : ''))}">${d}${nv ? `<small class="vn">${nv.n}</small>` : ''}</div>`;
  }
  return `<div class="vac-mini"><div class="t">${h(o.titol2 || MESOS[mes - 1])}${o.sub ? `<small>${h(o.sub)}</small>` : ''}</div><div class="vac-g">${cel}</div></div>`;
}

      const cel = dies.map(x => { const e = pd.get(x.iso) || null, num = e === 'vacances' ? nm.dies.get(x.iso) : null; if (e === 'vacances') nv++; if (e === 'baixa') nb++;

// marca (tipus 'vacances' | 'baixa') o esborra (tipus null) una llista de dies d'un treballador; un registre per dia, que es reaprofita
async function marcaAbsencies(trebId, dies, tipus) {
  const t = treballadorActual(); if (!trebId) throw new Error('Tria el treballador.');
  const existents = new Map(C.rows('absencies').filter(a => Number(a.treballador_id) === trebId).map(a => [a.dia, a]));
  const nous = [];
  for (const dia of dies) {
    const ex = existents.get(dia);
    if (ex) { if (ex.actiu === !!tipus && (!tipus || ex.tipus === tipus)) continue; const r = await sb.from('absencies').update({ tipus: tipus || ex.tipus, actiu: !!tipus, registrat_per: t ? t.id : null }).eq('id', ex.id); if (r.error) throw r.error; }
    else if (tipus) nous.push({ treballador_id: trebId, dia, tipus, registrat_per: t ? t.id : null });
  }
  if (nous.length) { const r = await sb.from('absencies').insert(nous); if (r.error) throw r.error; }
  await loadTable('absencies');
}

/* =====================================================================

      ${oficina ? `<select id="nom-treb" style="width:auto; min-width:220px">${treballadors.map(x => `<option value="${x.id}" ${x.id === trebId ? 'selected' : ''}>${h(nomTreballador(x))}</option>`).join('')}</select>` : ''}

      <span class="n">${delAny.length} ${delAny.length === 1 ? 'document' : 'documents'} el ${any}${anys.length && !anys.every(a => a === any) ? ' · anys amb nòmines: ' + anys.join(', ') : ''}</span>
    </div>
    <div id="ferr"></div>
    <div class="nom-cal">${MESOS.map((nom, i) => { const m = i + 1, docs = perMes(m);
      return `<div class="nom-mes ${docs.length ? 'te' : ''} ${m === mesAra && any === anyAra ? 'ara' : ''}"><div class="nom-mes-nom">${nom}</div>
        ${docs.map(n => `<a href="#" class="nom-doc" data-obre="${h(n.pdf)}" title="${h(n.nom_fitxer || '')}">📄 ${h(n.concepte || 'Nòmina')}</a>${oficina ? `<span class="hint">pujada ${dmy(n.creat_el)}${n.pujada_per ? ' per ' + h(nomCurtTreballador(C.get('treballadors', n.pujada_per))) : ''} · <a href="#" data-treu="${n.id}">treu</a></span>` : ''}`).join('')}
        ${!docs.length && !oficina ? '<span class="nom-buit">—</span>' : ''}
        ${oficina ? `<label class="btn ghost small nom-puja">${docs.length ? 'Afegeix-hi un altre document' : 'Puja la nòmina'}<input type="file" accept="application/pdf,image/*" data-mes="${m}" hidden></label>` : ''}
      </div>`; }).join('')}</div>`;
  const canviaAny = v => { const n = Math.min(2100, Math.max(2000, Number(v) || anyAra)); st.any = String(n); renderMain(); };
  main.querySelectorAll('[data-any]').forEach(b => b.addEventListener('click', () => canviaAny(any + Number(b.dataset.any))));
  $('#nom-any').addEventListener('change', e => canviaAny(e.target.value));
  if ($('#nom-treb')) $('#nom-treb').addEventListener('change', e => { st.treb = e.target.value; renderMain(); });
  main.querySelectorAll('[data-obre]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); obreFitxer(a.dataset.obre); }));
  main.querySelectorAll('[data-treu]').forEach(a => a.addEventListener('click', async e => { e.preventDefault(); try { await treuNomina(Number(a.dataset.treu)); renderMain(); } catch (err) { showFormError(friendly(err)); } }));
  main.querySelectorAll('input[type=file][data-mes]').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try { await pujaNomina(trebId, any, Number(inp.dataset.mes), f); toast('Nòmina desada'); renderMain(); } catch (err) { inp.value = ''; showFormError(friendly(err)); }
  }));
}
// puja el fitxer a nomines/<treballador>/ i en crea el registre; si el mes ja té un document, demana el concepte del nou (paga extra…)
async function pujaNomina(trebId, any, mes, file) {
  const t = treballadorActual(); if (!trebId) throw new Error('Tria el treballador.');
  const existents = C.rows('nomines').filter(n => n.actiu && Number(n.treballador_id) === trebId && Number(n.exercici) === any && Number(n.mes) === mes);
  let concepte = 'Nòmina';
  if (existents.length) { const c = prompt(MESOS[mes - 1] + ' ' + any + ' ja té un document (' + existents.map(n => n.concepte).join(', ') + '). Concepte del nou:', 'Paga extra'); if (c == null) return; concepte = c.trim() || 'Nòmina'; }
  const path = `nomines/${trebId}/${any}-${String(mes).padStart(2, '0')}_${Date.now()}_${file.name.replace(/[^\w.\-]+/g, '_')}`;
  const up = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || undefined });
  if (up.error) throw new Error('No s’ha pogut pujar el fitxer: ' + friendly(up.error));
  const ins = await sb.from('nomines').insert({ treballador_id: trebId, exercici: any, mes, concepte, pdf: path, nom_fitxer: file.name, pujada_per: t ? t.id : null });
  if (ins.error) throw ins.error;
  await loadTable('nomines');
}
async function treuNomina(id) {
  const n = C.get('nomines', id); if (!n) return;
  if (!confirm(`Treure «${n.concepte || 'Nòmina'}» de ${MESOS[n.mes - 1]} ${n.exercici} de ${nomTreballador(C.get('treballadors', n.treballador_id))}? El fitxer s’esborra del Storage.`)) return;
  const r = await sb.from('nomines').update({ actiu: false }).eq('id', id); if (r.error) throw r.error;
  await sb.storage.from(BUCKET).remove([n.pdf]); // si no es pot esborrar, el registre ja ha quedat de baixa igualment
  await loadTable('nomines'); toast('Document tret');
}

init();
</script>
