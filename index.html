async function carregaConsumAigua(comptadorId, any) {
  const cos = $('#ca-cos'); if (!cos) return;
  const [rc, re] = await Promise.all([
    sb.rpc('consum_mensual', { p_comptador: comptadorId, p_any: any }),
    sb.rpc('escenaris_comptador', { p_comptador: comptadorId }),
  ]);
  if (rc.error || re.error) { cos.innerHTML = `<div class="msg err">${h(friendly(rc.error || re.error))}</div>`; return; }
  const consum = Array.from({ length: 12 }, (_, i) => { const r = (rc.data || []).find(x => x.mes === i + 1); return r ? Number(r.m3) : 0; });
  const esc = Array.from({ length: 12 }, (_, i) => (re.data || []).find(x => x.mes === i + 1) || { baix: 0, alt: 0, torrid: 0 });
  // només hi ha consum fins al mes de l'última lectura
  const c = C.get('comptadors', comptadorId);
  const lect = C.rows('lectures').filter(l => l.actiu && l.comptador_id === comptadorId).map(l => l.data).sort();
  const ultima = lect.length ? lect[lect.length - 1] : (c ? c.data_alta : null);
  // un mes només es mostra quan hi ha una lectura de l'últim dia del mes o posterior
  const ultimDia = i => { const d = new Date(Date.UTC(any, i + 1, 0)); return d.toISOString().slice(0, 10); };
  const ambDades = i => !!ultima && ultima >= ultimDia(i);
  const consumMostrat = consum.map((v, i) => ambDades(i) ? v : null);
  const acum = (arr) => { let t = 0; return arr.map(v => (v == null ? null : (t += v))); };
  const cAcum = acum(consumMostrat.map(v => v == null ? null : v));
  const lloc = c ? C.get('llocs', c.lloc_id) : null;
  const client = lloc ? L('clients', lloc.client_id) : '';
  const titol = ` · ${client} · ${(c && c.numero_serie) || 'comptador'} · ${any}`;
  const tot = arr => arr.reduce((t, v) => t + (v || 0), 0);
  cos.innerHTML = `
    <h2 class="grup">Consum mensual</h2><div class="graf"><canvas id="g-mes"></canvas></div>
    <h2 class="grup">Consum acumulat</h2><div class="graf"><canvas id="g-acum"></canvas></div>
    <table class="tbl informe ca-taula"><thead><tr><th>Mes</th><th class="num">Consum (m³)</th><th class="num">Acumulat</th><th class="num">Escenari baix</th><th class="num">Escenari alt</th><th class="num">Escenari tòrrid</th></tr></thead><tbody>
      ${MESOS.map((m, i) => `<tr><td>${m}</td><td class="num">${f1(consumMostrat[i])}</td><td class="num">${f1(cAcum[i])}</td><td class="num">${f1(esc[i].baix)}</td><td class="num">${f1(esc[i].alt)}</td><td class="num">${f1(esc[i].torrid)}</td></tr>`).join('')}
      <tr class="total"><td>Any</td><td class="num">${f1(tot(consumMostrat))}</td><td></td><td class="num">${f1(tot(esc.map(e => Number(e.baix))))}</td><td class="num">${f1(tot(esc.map(e => Number(e.alt))))}</td><td class="num">${f1(tot(esc.map(e => Number(e.torrid))))}</td></tr>
    </tbody></table>`;
  if (typeof Chart === 'undefined') return;
  graficsAigua.forEach(g => g.destroy()); graficsAigua = [];
  const labels = MESOS.map(m => m.slice(0, 3));
  const linia = (label, data, color) => ({ type: 'line', label, data, borderColor: color, backgroundColor: color, borderWidth: 2.5, tension: 0.35, pointRadius: 0, fill: false });
  const fes = (id, titolG, barres, b, al, to) => graficsAigua.push(new Chart($(id), {
    data: { labels, datasets: [
      { type: 'bar', label: 'Consum total', data: barres, backgroundColor: 'rgba(79, 129, 189, 0.85)', borderColor: '#2f5597', borderWidth: 1, barPercentage: 0.45 },
      linia('Escenari baix', b, '#9dc3e6'), linia('Escenari alt', al, '#1f4e79'), linia('Escenari tòrrid', to, '#843c0c') ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        title: { display: true, text: titolG, color: '#1f4e79', font: { size: 19, weight: '600' }, padding: { top: 4, bottom: 2 } },
        subtitle: { display: true, text: c ? cobreixMajuscules(c) : '', color: '#1f4e79', font: { size: 14, weight: 'bold' }, padding: { bottom: 14 } },
        legend: { position: 'right', labels: { font: { weight: '600' } } } },
      scales: { y: { beginAtZero: true, title: { display: true, text: 'm³', font: { weight: '600' } }, ticks: { font: { weight: '600' } } }, x: { ticks: { font: { weight: '600' } } } } }
  }));
  fes('#g-mes', 'Consum mensual' + titol, consumMostrat, esc.map(e => Number(e.baix)), esc.map(e => Number(e.alt)), esc.map(e => Number(e.torrid)));
  fes('#g-acum', 'Consum acumulat' + titol, cAcum, acum(esc.map(e => Number(e.baix))), acum(esc.map(e => Number(e.alt))), acum(esc.map(e => Number(e.torrid))));
}

/* ---------- Informes de tasques de piscina ---------- */
const TASCA_MESURES = ['clor_lliure_1', 'clor_lliure_2', 'clor_combinat_1', 'clor_combinat_2', 'ph_1', 'ph_2', 'isocianuric', 'alcalinitat', 'duresa', 'temperatura', 'salinitat', 'comptador_aigua_nova', 'transparencia'];
const TASCA_CHECKS = [['nivell_aigua_ok', 'Nivell aigua'], ['flux_retorns_ok', 'Flux retorns'], ['fons_parets_ok', 'Fons i parets'], ['motor_ok', 'Motor'], ['cloracio_electrode_ok', 'Cloració salina'], ['pressio_filtre_ok', 'Pressió filtre']];
const TASCA_FEINES = [['netejafons', 'Netejafons'], ['passat_xarxa', 'Xarxa'], ['raspallat', 'Raspall'], ['neteja_skimmers', 'Skimmers'], ['neteja_linia_flotacio', 'Línia flotació'], ['neteja_aspes_prefiltre', 'Aspes i prefiltre'], ['neteja_filtre', 'Backwash']];
const primerDiaMes = () => avui().slice(0, 8) + '01';

function taulaTasquesHTML(rows, opts) {
  const td = SCHEMA.tables.tasques_piscina;
  const head = ['<th>Data</th>'];
  if (opts.hora) head.push('<th>Hora</th>');
  if (opts.piscina) head.push('<th>Piscina</th>');
  head.push('<th>Fet per</th>');
  TASCA_MESURES.forEach(k => { const f = fieldDef(td, k); head.push(`<th class="num">${h(f.curt || f.label)}</th>`); });
  TASCA_CHECKS.forEach(([k, l]) => head.push(`<th class="vert"><span>${h(l)}</span></th>`));
  TASCA_FEINES.forEach(([k, l]) => head.push(`<th class="vert"><span>${h(l)}</span></th>`));
  head.push('<th>Observacions</th>');
  const body = rows.map(r => {
    const c = [`<td>${dmy(r.data).slice(0, 5)}</td>`];
    if (opts.hora) c.push(`<td>${h(String(r.hora || '').slice(0, 5))}</td>`);
    if (opts.piscina) c.push(`<td>${h(L('piscines', r.piscina_id))}</td>`);
    c.push(`<td>${h(nomCurtTreballador(C.get('treballadors', r.treballador_id)))}</td>`);
    TASCA_MESURES.forEach(k => { const f = fieldDef(td, k); const col = f.color ? f.color(r[k], r) : ''; c.push(`<td class="num ${col ? 'cel ' + col : ''}">${h(cellText(td, k, r))}</td>`); });
    TASCA_CHECKS.forEach(([k]) => c.push(r[k] === true ? '<td class="ok">✓</td>' : r[k] === false ? '<td class="no">✗</td>' : '<td></td>'));
    TASCA_FEINES.forEach(([k]) => c.push(r[k] === true ? '<td class="fet">✓</td>' : r[k] === false ? '<td class="no">✗</td>' : '<td></td>'));
    c.push(`<td class="obs">${h(r.observacions || '')}</td>`);
    return `<tr>${c.join('')}</tr>`;
  }).join('');
  return rows.length ? `<table class="tbl informe tasques"><thead><tr>${head.join('')}</tr></thead><tbody>${body}</tbody></table>` : '<div class="empty">Cap tasca en aquest període.</div>';
}

// versió per a mòbil: una targeta per tasca, sense taules amples
function targetesTasquesHTML(rows, opts) {
  const td = SCHEMA.tables.tasques_piscina;
  if (!rows.length) return '<div class="empty">Cap tasca.</div>';
  const xip = (lab, k, r) => { const f = fieldDef(td, k); const v = r[k]; if (v == null || v === '') return ''; const c = f.color ? f.color(v, r) : ''; return `<span class="xip ${c}">${h(lab)} <b>${h(cellText(td, k, r))}</b></span>`; };
  const mesures = [['Cl1', 'clor_lliure_1'], ['Cl2', 'clor_lliure_2'], ['Cc1', 'clor_combinat_1'], ['Cc2', 'clor_combinat_2'], ['pH1', 'ph_1'], ['pH2', 'ph_2'], ['Iso', 'isocianuric'], ['Alc', 'alcalinitat'], ['Dur', 'duresa'], ['T', 'temperatura'], ['Sal', 'salinitat'], ['Compt', 'comptador_aigua_nova'], ['Transp', 'transparencia']];
  return rows.map(r => {
    const ok = TASCA_CHECKS.filter(([k]) => r[k] === true || r[k] === false).map(([k, l]) => r[k] ? `<span class="xip ok">✓ ${h(l)}</span>` : `<span class="xip fora">✗ ${h(l)} incorrecte</span>`);
    const fe = TASCA_FEINES.filter(([k]) => r[k] === true || r[k] === false).map(([k, l]) => r[k] ? `<span class="xip fet">✓ ${h(l)}</span>` : `<span class="xip fora">✗ ${h(l)} no fet</span>`);
    return `<div class="targeta">
      <div class="tcap"><b>${dmy(r.data).slice(0, 5)}</b>${r.hora ? ' · ' + h(String(r.hora).slice(0, 5)) : ''}${opts.piscina ? ' · ' + h(L('piscines', r.piscina_id)) : ''} · ${h(nomCurtTreballador(C.get('treballadors', r.treballador_id)))}</div>
      <div class="xips">${mesures.map(([l, k]) => xip(l, k, r)).join('')}</div>
      ${ok.length || fe.length ? `<div class="xips">${ok.join('')}${fe.join('')}</div>` : ''}
      ${r.observacions ? `<div class="tobs">${h(r.observacions)}</div>` : ''}
    </div>`;
  }).join('');
}

function imprimeixApaisat() {
  const st = document.createElement('style'); st.id = 'print-apaisat'; st.textContent = '@page { size: A4 landscape; margin: 10mm; }';
  document.head.appendChild(st);
  const treu = () => { const e = document.getElementById('print-apaisat'); if (e) e.remove(); };
  window.addEventListener('afterprint', treu, { once: true });
  setTimeout(() => { window.print(); setTimeout(treu, 2000); }, 50);
}

/* ---------- Calendari de facturació: cobraments i pagaments per data de venciment ---------- */
const DIES_SETMANA = ['Diumenge', 'Dilluns', 'Dimarts', 'Dimecres', 'Dijous', 'Divendres', 'Dissabte'];
const finalMesSeguent = () => { const d = new Date(); return new Date(Date.UTC(d.getFullYear(), d.getMonth() + 2, 0)).toISOString().slice(0, 10); };
const nomDia = iso => { const d = new Date(iso + 'T00:00:00Z'); return DIES_SETMANA[d.getUTCDay()]; };

function movimentsCalendari(st) {
  const mov = [];
  if (st.cobr) C.rows('factures').filter(f => f.actiu && f.data_venciment && (f.estat === 'emesa' || (st.fets && f.estat === 'cobrada')) && f.data_venciment >= st.desde && f.data_venciment <= st.fins)
    .forEach(f => mov.push({ data: f.data_venciment, tipus: 'c', qui: f.client_nom || L('clients', f.client_id), num: f.numero_complet || '', concepte: f.concepte || '', forma: f.forma_pagament, import: Number(f.total || 0), fet: f.estat === 'cobrada', id: f.id, taula: 'factures' }));
  if (st.pag) C.rows('factures_proveidor').filter(f => f.actiu && f.data_venciment && (st.fets || !f.pagada) && (st.dubtoses || !f.dubtosa) && f.data_venciment >= st.desde && f.data_venciment <= st.fins)
    .forEach(f => mov.push({ data: f.data_venciment, tipus: 'p', qui: L('proveidors', f.proveidor_id), num: f.numero || '', concepte: f.concepte || '', forma: f.forma_pagament, import: -Number(f.total || 0), fet: !!f.pagada, dubtosa: !!f.dubtosa, id: f.id, taula: 'factures_proveidor' }));
  mov.sort((a, b) => a.data.localeCompare(b.data) || (a.tipus === b.tipus ? 0 : a.tipus === 'c' ? -1 : 1) || a.qui.localeCompare(b.qui, 'ca'));
  return mov;
}

function renderCalendariFacturacio(main) {
  const st = state.cal; if (!st.desde) st.desde = avui(); if (!st.fins) st.fins = finalMesSeguent();
  const mov = movimentsCalendari(st);
  const formaCurta = { domiciliacio: 'rebut', transferencia: 'transf.', talo: 'taló', visa: 'targeta', altres: 'altres' };
  const dies = [...new Set(mov.map(m => m.data))];
  const totC = mov.filter(m => m.tipus === 'c').reduce((t, m) => t + m.import, 0);
  const totP = mov.filter(m => m.tipus === 'p').reduce((t, m) => t + m.import, 0);
  const senseData = (st.cobr ? C.rows('factures').filter(f => f.actiu && f.estat === 'emesa' && !f.data_venciment).length : 0)
    + (st.pag ? C.rows('factures_proveidor').filter(f => f.actiu && !f.pagada && !f.data_venciment).length : 0);
  let acum = 0;
  const resumFiles = dies.map(d => {
    const md = mov.filter(m => m.data === d); const c = md.filter(m => m.tipus === 'c').reduce((t, m) => t + m.import, 0), pg = md.filter(m => m.tipus === 'p').reduce((t, m) => t + m.import, 0);
    acum += c + pg;
    return `<tr><td>${h(nomDia(d))} ${dmy(d)}</td><td class="num">${md.length}</td><td class="num cobr">${c ? eur(c) : ''}</td><td class="num pag">${pg ? eur(pg) : ''}</td><td class="num"><b>${eur(c + pg)}</b></td><td class="num">${eur(acum)}</td></tr>`;
  }).join('');
  const detall = dies.map(d => {
    const md = mov.filter(m => m.data === d); const c = md.filter(m => m.tipus === 'c').reduce((t, m) => t + m.import, 0), pg = md.filter(m => m.tipus === 'p').reduce((t, m) => t + m.import, 0);
    return `<div class="dia"><h2>${dmy(d)}</h2><span class="setm">${h(nomDia(d))}</span><span class="net">${c ? `<span class="cobr">${eur(c)}</span>` : ''}${c && pg ? ' · ' : ''}${pg ? `<span class="pag">${eur(pg)}</span>` : ''} · net <b>${eur(c + pg)}</b></span></div>
      <table class="tbl informe"><thead><tr><th></th><th>Qui</th><th>Número</th><th>Concepte</th><th>Forma</th><th class="num">Import</th></tr></thead><tbody>
        ${md.map(m => `<tr class="row" data-taula="${m.taula}" data-id="${m.id}"><td><span class="tipus ${m.tipus}">${m.tipus === 'c' ? 'cobrament' : 'pagament'}${m.fet ? ' · fet' : ''}${m.dubtosa ? ' · dubtós' : ''}</span></td><td>${h(m.qui)}</td><td>${h(m.num)}</td><td class="obs">${h(m.concepte.length > 70 ? m.concepte.slice(0, 68) + '…' : m.concepte)}</td><td>${h(formaCurta[m.forma] || m.forma || '')}</td><td class="num ${m.tipus === 'c' ? 'cobr' : 'pag'}">${eur(m.import)}</td></tr>`).join('')}
        <tr class="total"><td colspan="5">Subtotal ${dmy(d)}</td><td class="num">${eur(c + pg)}</td></tr>
      </tbody></table>`;
  }).join('');
  main.innerHTML = `
    <h1>Calendari de facturació</h1>
    <p class="sub">Cobraments previstos (factures emeses, per data de venciment) i pagaments previstos (factures de proveïdor, per data de venciment) entre dues dates, amb subtotal per dia.</p>
    <div class="bar">
      <input type="date" id="cal-desde" value="${st.desde}" style="width:auto"> <input type="date" id="cal-fins" value="${st.fins}" style="width:auto">
      <label class="chk" style="padding:0"><input type="checkbox" id="cal-cobr" ${st.cobr ? 'checked' : ''}> Cobraments</label>
      <label class="chk" style="padding:0"><input type="checkbox" id="cal-pag" ${st.pag ? 'checked' : ''}> Pagaments</label>
      <label class="chk" style="padding:0"><input type="checkbox" id="cal-fets" ${st.fets ? 'checked' : ''}> Inclou els ja cobrats/pagats</label>
      <label class="chk" style="padding:0"><input type="checkbox" id="cal-dubtoses" ${st.dubtoses ? 'checked' : ''}> Inclou els dubtosos</label>
      <label class="chk" style="padding:0"><input type="checkbox" id="cal-detall" ${st.detall ? 'checked' : ''}> Detall per dia</label>
      <button class="btn ghost" id="cal-print">Imprimeix</button>
    </div>
    <div class="cal">
      <div class="resum">
        <div><div class="k">Cobraments</div><div class="v cobr">${eur(totC)}</div></div>
        <div><div class="k">Pagaments</div><div class="v pag">${eur(totP)}</div></div>
        <div><div class="k">Net del període</div><div class="v">${eur(totC + totP)}</div></div>
        <div><div class="k">Moviments · dies</div><div class="v">${mov.length} · ${dies.length}</div></div>
      </div>
      ${senseData ? `<p class="sub">${senseData} factures pendents no tenen data de venciment i no surten al calendari.</p>` : ''}
      ${dies.length ? `<h3>Resum per dies</h3><table class="tbl informe"><thead><tr><th>Dia</th><th class="num">Mov.</th><th class="num">Cobraments</th><th class="num">Pagaments</th><th class="num">Net</th><th class="num">Acumulat</th></tr></thead><tbody>${resumFiles}
        <tr class="total"><td>Total</td><td class="num">${mov.length}</td><td class="num cobr">${eur(totC)}</td><td class="num pag">${eur(totP)}</td><td class="num">${eur(totC + totP)}</td><td></td></tr></tbody></table>` : '<div class="empty">Cap cobrament ni pagament amb venciment en aquest període.</div>'}
      ${st.detall ? detall : ''}
    </div>`;
  const rerender = () => renderMain();
  $('#cal-desde').addEventListener('change', e => { st.desde = e.target.value; rerender(); });
  $('#cal-fins').addEventListener('change', e => { st.fins = e.target.value; rerender(); });
  [['cal-cobr', 'cobr'], ['cal-pag', 'pag'], ['cal-fets', 'fets'], ['cal-dubtoses', 'dubtoses'], ['cal-detall', 'detall']].forEach(([id, k]) => $('#' + id).addEventListener('change', e => { st[k] = e.target.checked; rerender(); }));
  $('#cal-print').addEventListener('click', () => window.print());
  main.querySelectorAll('tr.row[data-taula]').forEach(tr => tr.addEventListener('click', () => {
    state.mode = 'consulta'; state.table = tr.dataset.taula; state.editing = Number(tr.dataset.id); renderApp(); window.scrollTo({ top: 0 });
  }));
}

/* ---------- Gràfiques d'ingressos (factures a clients) i de despeses (factures de proveïdor) per mes, amb l'any anterior ---------- */
let graficsFacturacio = [];
// import d'una factura de proveïdor sense IVA: la base si hi és; si no, el total menys la quota; si no, el total
const baseProveidor = f => f.base_imponible != null ? Number(f.base_imponible) : (f.quota_iva != null ? Number(f.total || 0) - Number(f.quota_iva) : Number(f.total || 0));
function mesosFacturacio(any, ambIva) {
  const ing = Array(12).fill(0), des = Array(12).fill(0);
  C.rows('factures').filter(f => f.actiu && (f.estat === 'emesa' || f.estat === 'cobrada') && String(f.data_factura || '').slice(0, 4) === String(any))
    .forEach(f => { ing[Number(String(f.data_factura).slice(5, 7)) - 1] += ambIva ? Number(f.total || 0) : Number(f.base_imponible || 0); });
  C.rows('factures_proveidor').filter(f => f.actiu && String(f.data_factura || '').slice(0, 4) === String(any))
    .forEach(f => { des[Number(String(f.data_factura).slice(5, 7)) - 1] += ambIva ? Number(f.total || 0) : baseProveidor(f); });
  return { ing: ing.map(v => Math.round(v * 100) / 100), des: des.map(v => Math.round(v * 100) / 100) };
}
function renderGrafiquesFacturacio(main) {
  const st = state.graf;
  const anys = [...new Set([...C.rows('factures').map(f => String(f.data_factura || '').slice(0, 4)), ...C.rows('factures_proveidor').map(f => String(f.data_factura || '').slice(0, 4)), String(new Date().getFullYear())].filter(a => /^\d{4}$/.test(a)))].sort();
  if (!anys.includes(st.any)) st.any = anys[anys.length - 1];
  const any = Number(st.any), ara = mesosFacturacio(any, st.ambIva), abans = mesosFacturacio(any - 1, st.ambIva);
  const suma = a => a.reduce((t, v) => t + v, 0);
  const totIng = suma(ara.ing), totIngA = suma(abans.ing), totDes = suma(ara.des), totDesA = suma(abans.des);
  const dif = (a, b) => b ? ` <span class="hint">(${a >= b ? '+' : ''}${Math.round((a - b) / b * 100)} % respecte a ${any - 1})</span>` : '';
  const taula = (a, b) => `<table class="tbl informe graf-taula"><thead><tr><th>Mes</th><th class="num">${any}</th><th class="num">${any - 1}</th><th class="num">Diferència</th></tr></thead><tbody>
    ${MESOS.map((m, i) => `<tr><td>${m}</td><td class="num">${fmtEur(a[i])}</td><td class="num">${fmtEur(b[i])}</td><td class="num ${a[i] - b[i] < 0 ? 'v-no' : ''}">${b[i] || a[i] ? fmtEur(a[i] - b[i]) : ''}</td></tr>`).join('')}
    <tr class="total"><td>Total</td><td class="num">${fmtEur(suma(a))}</td><td class="num">${fmtEur(suma(b))}</td><td class="num">${fmtEur(suma(a) - suma(b))}</td></tr></tbody></table>`;
  main.innerHTML = `
    <h1>Gràfiques d’ingressos i despeses</h1>
    <p class="sub noprint">Facturació per mes (data de la factura), recurrent i puntual junta. Les columnes són l’any triat i la línia, l’any anterior. Ingressos: factures emeses i cobrades (sense esborranys ni anul·lades). Despeses: factures de proveïdor.</p>
    <div class="bar">
      <span class="nota">Any</span> <select id="graf-any" style="width:auto">${anys.map(a => `<option value="${a}" ${a === st.any ? 'selected' : ''}>${a}</option>`).join('')}</select>
      <label class="chk" style="padding:0"><input type="checkbox" id="graf-iva" ${st.ambIva ? 'checked' : ''}> Imports amb IVA</label>
      <button class="btn ghost" id="graf-print">Imprimeix</button>
    </div>
    <div class="resum">
      <div><div class="k">Ingressos ${any}</div><div class="v cobr">${fmtEur(totIng)}</div><div class="k">${any - 1}: ${fmtEur(totIngA)}${dif(totIng, totIngA)}</div></div>
      <div><div class="k">Despeses ${any}</div><div class="v pag">${fmtEur(totDes)}</div><div class="k">${any - 1}: ${fmtEur(totDesA)}${dif(totDes, totDesA)}</div></div>
      <div><div class="k">Diferència ${any}</div><div class="v">${fmtEur(totIng - totDes)}</div><div class="k">${any - 1}: ${fmtEur(totIngA - totDesA)}</div></div>
    </div>
    <h2 class="grup">Gràfica d’ingressos</h2>
    <div class="graf"><canvas id="g-ing"></canvas></div>
    <details class="noprint"><summary class="hint">Taula de valors</summary>${taula(ara.ing, abans.ing)}</details>
    <h2 class="grup">Gràfica de despeses</h2>
    <div class="graf"><canvas id="g-des"></canvas></div>
    <details class="noprint"><summary class="hint">Taula de valors</summary>${taula(ara.des, abans.des)}</details>`;
  $('#graf-any').addEventListener('change', e => { st.any = e.target.value; renderMain(); });
  $('#graf-iva').addEventListener('change', e => { st.ambIva = e.target.checked; renderMain(); });
  $('#graf-print').addEventListener('click', () => window.print());
  graficsFacturacio.forEach(g => g.destroy()); graficsFacturacio = [];
  if (typeof Chart !== 'function') { main.insertAdjacentHTML('beforeend', '<div class="msg err">No s’ha pogut carregar la llibreria de gràfiques (cal connexió a Internet). Recarrega la pàgina.</div>'); return; }
  const fes = (id, titol, barres, linia) => graficsFacturacio.push(new Chart($(id), {
    data: { labels: MESOS, datasets: [
      { type: 'bar', label: String(any), data: barres, backgroundColor: '#1f4e79', borderColor: '#1f4e79', borderWidth: 1, barPercentage: 0.55, order: 2 },
      { type: 'line', label: String(any - 1), data: linia, borderColor: '#9dc3e6', backgroundColor: '#9dc3e6', borderWidth: 3, tension: 0, pointRadius: 4, pointBackgroundColor: '#9dc3e6', fill: false, order: 1 } ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        title: { display: true, text: titol + (st.ambIva ? ' (amb IVA)' : ' (sense IVA)'), color: '#1f4e79', font: { size: 19, weight: '600' }, padding: { top: 4, bottom: 10 } },
        legend: { position: 'bottom', labels: { font: { weight: '600' } } },
        tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + fmtEur(c.parsed.y) } } },
      scales: { y: { beginAtZero: true, title: { display: true, text: '€', font: { weight: '600' } }, ticks: { font: { weight: '600' }, callback: v => Number(v).toLocaleString('ca-ES') + ' €' } }, x: { ticks: { font: { weight: '600' } } } } }
  }));
  fes('#g-ing', 'Gràfica d’ingressos ' + any, ara.ing, abans.ing);
  fes('#g-des', 'Gràfica de despeses ' + any, ara.des, abans.des);
}

/* ---------- Marcat de cobrats/pagats: llista per marcar amb una casella les factures que s'han cobrat (clients) o pagat (proveïdors) ---------- */
// llocs d'una factura de client: els de les instal·lacions de l'agrupació; si no en té, els llocs del client
function llocsFactura(f) {
  let ids = [];
  if (f.agrupacio_id) ids = [...C.rows('jardins'), ...C.rows('piscines')].filter(x => x.actiu && Number(x.agrupacio_id) === Number(f.agrupacio_id)).map(x => Number(x.lloc_id));
  if (!ids.length) ids = C.rows('llocs').filter(l => l.actiu && Number(l.client_id) === Number(f.client_id)).map(l => l.id);
  return [...new Set(ids)].map(id => (C.get('llocs', id) || {}).nom).filter(Boolean).join(', ');
}
function renderMarcatCobrats(main) {
  const st = state.marcat; if (!st.data) st.data = avui();
  const q = (st.q || '').trim().toLowerCase();
  const fet = (t, id) => !!st.fets[t + ':' + id];
  const cob = C.rows('factures').filter(f => f.actiu && (f.estat === 'emesa' || (f.estat === 'cobrada' && fet('factures', f.id))))
    .map(f => ({ f, client: f.client_nom || L('clients', f.client_id), llocs: llocsFactura(f) }))
    .filter(x => !q || [x.f.numero_complet, x.client, x.llocs, x.f.concepte].some(v => String(v || '').toLowerCase().includes(q)))
    .sort((a, b) => a.client.localeCompare(b.client, 'ca') || String(a.f.data_factura).localeCompare(String(b.f.data_factura)));
  const pag = C.rows('factures_proveidor').filter(f => f.actiu && (!f.pagada || fet('factures_proveidor', f.id)))
    .map(f => ({ f, prov: L('proveidors', f.proveidor_id) }))
    .filter(x => !q || [x.f.numero, x.prov, x.f.concepte].some(v => String(v || '').toLowerCase().includes(q)))
    .sort((a, b) => a.prov.localeCompare(b.prov, 'ca') || String(a.f.data_factura).localeCompare(String(b.f.data_factura)));

    <div class="bar">

      <input type="text" id="mc-q" placeholder="Filtra per número, client, lloc, proveïdor…" value="${h(st.q || '')}">
      <span class="n">${nFets ? nFets + ' marcades en aquesta sessió · ' : ''}pendents: ${eur(totC)} a cobrar · ${eur(totP)} a pagar</span>
    </div>
    <h2 class="grup">Clients · cobrat</h2>
    ${cob.length ? `<table class="tbl informe mc"><thead><tr><th>Factura</th><th>Data factura</th><th>Client</th><th>Lloc</th><th>Venciment</th><th class="num">Import</th><th class="mc-c">Cobrat</th></tr></thead><tbody>
      ${cob.map(x => { const f = x.f, ok = f.estat === 'cobrada'; return `<tr class="${ok ? 'fet' : ''}"><td><a href="#" data-obre-taula="factures" data-obre-id="${f.id}">${h(f.numero_complet || '')}</a></td><td>${dmy(f.data_factura)}</td><td>${h(x.client)}</td><td>${h(x.llocs)}</td><td>${dmy(f.data_venciment)}${f.data_venciment && f.data_venciment < st.data && !ok ? ' <span class="v-no">vençuda</span>' : ''}</td><td class="num">${eur(f.total)}</td><td class="mc-c"><label class="mc-box ${ok ? 'on' : ''}"><input type="checkbox" data-marca="${f.id}" data-taula="factures" ${ok ? 'checked' : ''}> ${ok ? 'cobrada ' + dmy(f.data_cobrament) : 'cobrat'}</label></td></tr>`; }).join('')}
      <tr class="total"><td colspan="5">Pendent de cobrar</td><td class="num">${eur(totC)}</td><td></td></tr></tbody></table>` : '<div class="empty">Cap factura emesa pendent de cobrar.</div>'}
    <h2 class="grup">Proveïdors · pagat</h2>
    ${pag.length ? `<table class="tbl informe mc"><thead><tr><th>Factura</th><th>Data factura</th><th>Proveïdor</th><th>Concepte</th><th>Venciment</th><th class="num">Import</th><th class="mc-c">Pagat</th></tr></thead><tbody>
      ${pag.map(x => { const f = x.f, ok = !!f.pagada; return `<tr class="${ok ? 'fet' : ''}"><td><a href="#" data-obre-taula="factures_proveidor" data-obre-id="${f.id}">${h(f.numero || '(sense número)')}</a></td><td>${dmy(f.data_factura)}</td><td>${h(x.prov)}${f.dubtosa ? ' <span class="cal"><span class="tipus p">dubtosa</span></span>' : ''}</td><td>${h(String(f.concepte || '').split('\n')[0].slice(0, 60))}</td><td>${dmy(f.data_venciment)}${f.data_venciment && f.data_venciment < st.data && !ok ? ' <span class="v-no">vençuda</span>' : ''}</td><td class="num">${eur(f.total)}</td><td class="mc-c"><label class="mc-box ${ok ? 'on' : ''}"><input type="checkbox" data-marca="${f.id}" data-taula="factures_proveidor" ${ok ? 'checked' : ''}> ${ok ? 'pagada ' + dmy(f.data_pagament) : 'pagat'}</label></td></tr>`; }).join('')}
      <tr class="total"><td colspan="5">Pendent de pagar</td><td class="num">${eur(totP)}</td><td></td></tr></tbody></table>` : '<div class="empty">Cap factura de proveïdor pendent de pagar.</div>'}`;
  $('#mc-data').addEventListener('change', e => { st.data = e.target.value || avui(); renderMain(); });
  $('#mc-q').addEventListener('input', e => { st.q = e.target.value; renderMain(); const el = $('#mc-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); });
  main.querySelectorAll('a[data-obre-taula]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); state.mode = 'consulta'; state.table = a.dataset.obreTaula; state.editing = Number(a.dataset.obreId); renderApp(); window.scrollTo({ top: 0 }); }));
  main.querySelectorAll('input[data-marca]').forEach(c => c.addEventListener('change', async () => {
    const taula = c.dataset.taula, id = Number(c.dataset.marca), data = st.data || avui(), marcat = c.checked;
    c.disabled = true;
    const canvis = taula === 'factures' ? { data_cobrament: marcat ? data : null } : (marcat ? { pagada: true, data_pagament: data } : { pagada: false, data_pagament: null });
    const res = await sb.from(taula).update(canvis).eq('id', id);
    if (res.error) { c.checked = !marcat; c.disabled = false; toastErr(friendly(res.error)); return; }
    await loadTable(taula);
    st.fets[taula + ':' + id] = marcat;
    toast(marcat ? (taula === 'factures' ? 'Cobrada el ' + dmy(data) : 'Pagada el ' + dmy(data)) : 'Desmarcada: torna a estar pendent');
    renderMain();
  }));
}

/* =====================================================================
   FULLS DE TREBALL: un per acció d'operari (es crea sol) o sense incidència. La demanda la posa qui demana la feina;
   l'operari hi apunta jornades, material i fotos, i el marca com a totalment finalitzat; l'oficina en fa l'albarà.
   ===================================================================== */
const ESTATS_FULL = { pendent: 'Pendent', en_curs: 'En curs', finalitzat: 'Totalment finalitzat', albara: 'Amb albarà', anul_lat: 'Anul·lat' };
const GRUPS_FOTO_FULL = [['compra', 'Fotos dels albarans de compra'], ['abans', 'Fotos de la feina · abans'], ['despres', 'Fotos de la feina · després']];
const TIPUS_SENSE_FULL = ['obrir', 'tancar', 'reobrir', 'assignar_seguidora', 'visibilitat_client', 'consultar', 'demanar_preu', 'demanar_instruccions', 'decisio_client', 'autoritzar_actuacio'];
// quines accions porten full de treball: les del carril d'operari que són feina (no peticions)
const accioAmbFull = a => !!a && a.carril === 'operari' && !a.es_peticio && !!a.responsable_treballador_id && !TIPUS_SENSE_FULL.includes(a.tipus);
const fullDeAccio = a => a ? C.rows('fulls_treball').find(f => f.actiu && Number(f.accio_id) === Number(a.id)) : null;
// qui pot crear el full d'una acció (és el que permet la base de dades): l'oficina, l'encarregat de l'acció o qui la va crear
const potCrearFullDe = a => { const t = treballadorActual(); return !!t && (esOficina(t) || Number(a.responsable_treballador_id) === t.id || Number(a.creat_per) === t.id); };
const jornadesFull = id => C.rows('full_treball_jornades').filter(j => j.actiu && Number(j.full_id) === Number(id)).sort((a, b) => String(a.data).localeCompare(String(b.data)) || String(a.hora_inici || '').localeCompare(String(b.hora_inici || '')) || a.id - b.id);
const materialFull = id => C.rows('full_treball_material').filter(m => m.actiu && Number(m.full_id) === Number(id)).sort((a, b) => String(a.data).localeCompare(String(b.data)) || a.id - b.id);
const horesJornada = j => { if (!j || !j.hora_inici || !j.hora_fi) return 0; const [h1, m1] = String(j.hora_inici).split(':').map(Number), [h2, m2] = String(j.hora_fi).split(':').map(Number); let min = (h2 * 60 + (m2 || 0)) - (h1 * 60 + (m1 || 0)); if (min < 0) min += 24 * 60; return Math.round(min / 60 * 100) / 100; };
const horesFull = id => Math.round(jornadesFull(id).reduce((t, j) => t + horesJornada(j) * Number(j.persones || 1), 0) * 100) / 100;
const resumJornades = id => jornadesFull(id).map(j => dmy(j.data) + ': ' + (j.feina || '')).filter(x => !/: $/.test(x)).join('\n');
const fotosFull = (f, grup) => (Array.isArray(f.adjunts) ? f.adjunts : []).filter(x => (x.grup || 'abans') === grup);
const fullProgramat = f => !!f && !!f.inici && f.estat === 'pendent' && !f.finalitzat && new Date(f.inici) > new Date();   // encara no toca
const potEditarFull = f => { const t = treballadorActual(); return !!f && !f.finalitzat && f.estat !== 'albara' && f.estat !== 'anul_lat' && !!t && (esOficina(t) || Number(f.encarregat_id) === t.id || Number(f.demanat_per) === t.id); };
async function recarregaFulls() { await Promise.all(['fulls_treball', 'full_treball_jornades', 'full_treball_material'].map(loadTable)); }
// el full d'una acció d'operari: la demanda surt de l'acció (nom = títol, termini = venciment, lloc = el de la incidència…)
async function creaFullPerAccio(inc, a) {
  const ja = fullDeAccio(a); if (ja) return ja.id;
  const termini = a.venciment || vencimentPerGrup(a.grup_termini || 'mig_termini').toISOString();
  const dades = { nom: a.titol || nomTipus(a.tipus), termini, lloc_id: inc.lloc_id, observacions_previes: a.descripcio || null, encarregat_id: a.responsable_treballador_id, demanat_per: a.creat_per || null,
    incidencia_id: inc.id, accio_id: a.id, estat: a.estat === 'en_curs' ? 'en_curs' : 'pendent', inici: a.inici || null };
  const r = await sb.from('fulls_treball').insert(dades).select('id').single(); if (r.error) throw r.error;
  await loadTable('fulls_treball'); return r.data.id;
}
async function marcaFullEnCurs(a) {
  const f = fullDeAccio(a); if (!f || f.estat !== 'pendent') return;
  const r = await sb.from('fulls_treball').update({ estat: 'en_curs' }).eq('id', f.id); if (!r.error) await loadTable('fulls_treball');
}
// totalment finalitzat (des del full sol, o des de l'oficina)
async function finalitzaFull(id, opts) {
  const f = C.get('fulls_treball', id), t = treballadorActual(); if (!f) return;
  if (!jornadesFull(id).length) { showFormError('Abans de finalitzar el full cal almenys una jornada (data, hores, persones i què s’ha fet).'); return; }
  const resum = opts && opts.resum != null ? opts.resum : (f.resum || resumJornades(id));
  if (opts && opts.desDeOficina && !confirm(`Marcar ${f.numero || 'el full'} com a totalment finalitzat?`)) return;
  const r = await sb.from('fulls_treball').update({ finalitzat: true, finalitzat_el: new Date().toISOString(), finalitzat_per: t ? t.id : null, estat: 'finalitzat', resum: resum || null }).eq('id', id);
  if (r.error) { showFormError(friendly(r.error)); return; }
  await loadTable('fulls_treball'); toast('Full de treball totalment finalitzat');
  if (opts && opts.despres) opts.despres(); else renderMain();
}
// ---- seccions del full (jornades, material, fotos): a l'app sota l'acció, i al full sol ----
function seccionsFullHTML(f) {
  const edit = potEditarFull(f), jorn = jornadesFull(f.id), mat = materialFull(f.id), hores = horesFull(f.id), avuiL = ymd(new Date());

  const filaM = m => `<tr><td>${dmy(m.data)}</td><td>${h(m.nom)}</td><td class="num">${String(m.quantitat).replace('.', ',')}</td>${edit ? `<td class="num"><button type="button" class="btn ghost small" data-treu-material="${m.id}">Treu</button></td>` : ''}</tr>`;

  return `<div class="ft" id="ft" data-full="${f.id}">
    <div class="ft-cap"><span>Full de treball</span><b>${h(f.numero || '')}</b><span class="pill e-${f.estat === 'finalitzat' || f.estat === 'albara' ? 'finalitzada' : f.estat === 'en_curs' ? 'en_curs' : fullProgramat(f) ? 'programada' : 'pendent'}">${fullProgramat(f) ? 'Programat ' + textInici(f) : h(ESTATS_FULL[f.estat] || f.estat)}</span>${f.finalitzat ? `<span class="hint">totalment finalitzat el ${dmyhm(f.finalitzat_el)}</span>` : ''}</div>
    <h4>Jornades de feina ${jorn.length ? `· ${jorn.length} · ${String(hores).replace('.', ',')} h × persones` : ''}</h4>
    ${jorn.length ? `<table class="ft-taula">${jorn.map(filaJ).join('')}</table>` : '<p class="hint">Encara cap. Apunta cada dia que hi treballis: data, hora d’inici i final, persones i què s’ha fet.</p>'}
    ${edit ? `<div class="ft-nova" id="ft-nova-jornada">
      <label class="f"><span class="l">Data</span><input type="date" data-nj="data" value="${avuiL}"></label>
      <label class="f"><span class="l">Persones</span><input type="number" min="1" step="1" data-nj="persones" value="1" inputmode="numeric"></label>

async function creaAlbaraDeFull(id) {
  const f = C.get('fulls_treball', id); if (!f) return;
  if (!f.finalitzat) { showFormError('El full ha d’estar totalment finalitzat abans de fer-ne l’albarà.'); return; }

  const jorn = jornadesFull(id), mat = materialFull(id);

  jorn.forEach(j => { const q = Math.round(horesJornada(j) * Number(j.persones || 1) * 100) / 100; linies.push({ descripcio: `Mà d’obra ${dmy(j.data)} · ${j.persones} ${Number(j.persones) === 1 ? 'persona' : 'persones'} · ${String(j.hora_inici || '').slice(0, 5)}–${String(j.hora_fi || '').slice(0, 5)}${j.feina ? ' · ' + j.feina : ''}`, quantitat: q || 1, preu_unitari: preuHora || 0, preu_cost: null, producte_id: null }); });
  mat.forEach(m => { const p = m.producte_id ? C.get('productes', m.producte_id) : C.rows('productes').find(x => x.actiu && x.nom.trim().toLowerCase() === String(m.nom).trim().toLowerCase()); linies.push({ descripcio: m.nom, quantitat: Number(m.quantitat) || 1, preu_unitari: p ? Number(p.pvp || 0) : 0, preu_cost: p && p.preu_cost != null ? Number(p.preu_cost) : null, producte_id: p ? p.id : null }); });
  const total = linies.reduce((t, l) => t + Math.round(l.quantitat * l.preu_unitari * 100) / 100, 0);

  if (!confirm(text)) return;
  const alb = await sb.from('albarans').insert({ client_id: lloc.client_id, lloc_id: lloc.id, data: f.finalitzat_el ? ymd(new Date(f.finalitzat_el)) : ymd(new Date()), descripcio: `${f.numero || 'Full de treball'} · ${f.nom}`, observacions: `Creat des del full de treball ${f.numero || ''}` + (f.incidencia_id ? ` (incidència ${(C.get('incidencies', f.incidencia_id) || {}).numero || ''})` : '') }).select('id').single();
  if (alb.error) { showFormError('Albarà: ' + friendly(alb.error)); return; }
  const lin = await sb.from('albara_linies').insert(linies.map((l, i) => ({ albara_id: alb.data.id, ordre: i + 1, ...l })));
  if (lin.error) { showFormError('Línies de l’albarà: ' + friendly(lin.error)); return; }
  const upd = await sb.from('fulls_treball').update({ albara_id: alb.data.id, estat: 'albara' }).eq('id', id);
  if (upd.error) { showFormError(friendly(upd.error)); return; }

}

function missatgeIaHTML(m, i) {

function renderPreguntaIA(main) {
  const st = state.ia;
  main.innerHTML = `<h1>Pregunta-ho</h1>

    <div class="ia-xat" id="ia-xat">
      ${st.missatges.length ? st.missatges.map(missatgeIaHTML).join('') : `<div class="ia-exemples">${EXEMPLES_IA.map(e => `<button type="button" class="btn ghost small" data-ex="${h(e)}">${h(e)}</button>`).join('')}</div>`}
      ${st.enviant ? '<div class="ia-m ia-r ia-pensant">Pensant… (pot trigar uns segons)</div>' : ''}
    </div>
    <form class="ia-form" id="ia-form"><textarea id="ia-q" rows="2" placeholder="Escriu la pregunta… (Retorn per enviar, Maj+Retorn per fer un salt de línia)" ${st.enviant ? 'disabled' : ''}></textarea><button class="btn" type="submit" ${st.enviant ? 'disabled' : ''}>Pregunta</button>${st.missatges.length ? '<button class="btn ghost" type="button" id="ia-neteja">Comença de nou</button>' : ''}</form>`;
  const q = $('#ia-q');

  $('#ia-form').addEventListener('submit', e => { e.preventDefault(); envia(); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envia(); } });
  main.querySelectorAll('[data-ex]').forEach(b => b.addEventListener('click', () => preguntaIa(b.dataset.ex)));
  main.querySelectorAll('[data-csv]').forEach(b => b.addEventListener('click', () => { const m = st.missatges[Number(b.dataset.csv)]; const blob = new Blob([csvDeFiles(m.files)], { type: 'text/csv;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'resposta.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }));
  const nt = $('#ia-neteja'); if (nt) nt.addEventListener('click', () => { st.missatges = []; renderMain(); });
  if (!st.enviant) q.focus();
  const xat = $('#ia-xat'); if (xat && st.missatges.length) { const ult = xat.querySelector('.ia-m.ia-r:last-of-type, .ia-m:last-child'); if (ult && ult.scrollIntoView) ult.scrollIntoView({ block: 'end' }); }
}
async function preguntaIa(text) {
  const st = state.ia, m = { q: text };
  st.missatges.push(m); st.enviant = true; renderMain();
  try {
    const historial = st.missatges.filter(x => x !== m && x.sql).slice(-6).map(x => ({ pregunta: x.q, sql: x.sql, resposta: x.resposta }));
    const { data, error } = await sb.functions.invoke('pregunta-bd', { body: { pregunta: text, historial } });
    let dades = data;
    if (error && !dades) { try { dades = error.context && error.context.json ? await error.context.json() : null; } catch (e) { dades = null; } }
    if (!dades || dades.error) throw new Error((dades && dades.error) || (error && error.message) || 'No s’ha pogut preguntar');
    Object.assign(m, { resposta: dades.resposta || '', sql: dades.sql || null, explicacio: dades.explicacio || '', files: Array.isArray(dades.files) ? dades.files : [] });
  } catch (e) { m.error = /Failed to fetch|FunctionsFetchError/i.test(String(e.message)) ? 'No s’ha pogut connectar amb la funció «pregunta-bd»: cal crear-la a Supabase (Edge Functions) amb el secret GEMINI_API_KEY.' : friendly(e); }
  st.enviant = false; renderMain();
}

    const blocs = [...dates.entries()].sort((a, b) => (a[0] || '9999').localeCompare(b[0] || '9999')).map(([data, xs]) => {

/* ---------- Hores del sol: sortida i posta de cada dia de l'any en una població ---------- */
function renderHoresSol(main) {
  const st = state.sol;
  const pobl = C.rows('poblacions_sol').filter(x => x.actiu).sort((a, b) => a.id - b.id);
  if (!st.poblacio || !pobl.some(p => String(p.id) === st.poblacio)) st.poblacio = pobl.length ? String(pobl[0].id) : '';
  const p = pobl.find(x => String(x.id) === st.poblacio);
  const any = Number(st.any) || new Date().getFullYear(), avuiS = avui();
  const mesos = [];
  if (p) for (let m = 0; m < 12; m++) {
    const dies = [];
    for (let d = 1; d <= 31; d++) {
      const iso = any + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const dt = new Date(iso + 'T00:00:00Z'); if (isNaN(dt.getTime()) || dt.getUTCMonth() !== m) break;
      const sol = solEnDia(p.latitud, p.longitud, iso);
      const [sh, sm] = sol.sortida.split(':').map(Number), [ph, pm] = sol.posta.split(':').map(Number);
      const durada = (ph * 60 + pm) - (sh * 60 + sm);
      dies.push({ iso, d, setm: ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'][dt.getUTCDay()], sortida: sol.sortida, posta: sol.posta, durada: Math.floor(durada / 60) + ' h ' + String(durada % 60).padStart(2, '0') });
    }
    mesos.push({ nom: MESOS_CAT[m], dies });
  }
  main.innerHTML = `
    <h1>Hores del sol</h1>
    <p class="sub noprint">Sortida i posta del sol de cada dia de l’any, calculades amb les coordenades de la població (precisió d’un minut). Són les hores que fan servir les línies de llum dels jardins i les piscines: un lloc va amb la seva població si és en aquesta llista, i si no, amb la primera (${h(pobl.length ? pobl[0].nom : '—')}).</p>
    <div class="bar">
      <select id="sol-pobl" style="width:auto; min-width:220px">${pobl.map(x => `<option value="${x.id}" ${String(x.id) === st.poblacio ? 'selected' : ''}>${h(x.nom)}</option>`).join('')}</select>
      <input type="number" id="sol-any" value="${any}" min="2000" max="2100" style="width:110px">
      <button class="btn ghost" id="sol-avui">Ves a avui</button>
      <button class="btn ghost" id="sol-print">Imprimeix</button>
    </div>
    ${p ? `<div class="capsal"><span>Població <b>${h(p.nom)}</b></span><span>Coordenades <b>${h(p.latitud)}, ${h(p.longitud)}</b></span><span>Any <b>${any}</b></span></div>
    <div class="sol-mesos">${mesos.map(m => `<div class="sol-mes"><h3>${h(m.nom)} ${any}</h3><table class="tbl informe"><thead><tr><th>Dia</th><th>Sortida</th><th>Posta</th><th>Llum</th></tr></thead><tbody>
      ${m.dies.map(x => `<tr ${x.iso === avuiS ? 'class="avui" id="sol-dia-avui"' : ''}><td>${x.d} <span class="hint">${h(x.setm)}</span></td><td>${x.sortida}</td><td>${x.posta}</td><td>${x.durada}</td></tr>`).join('')}
    </tbody></table></div>`).join('')}</div>` : '<div class="empty">Cap població. Afegeix-ne una a Poblacions (hora del sol).</div>'}`;
  $('#sol-pobl').addEventListener('change', e => { st.poblacio = e.target.value; renderMain(); });
  $('#sol-any').addEventListener('change', e => { st.any = e.target.value; renderMain(); });
  $('#sol-avui').addEventListener('click', () => { const t = $('#sol-dia-avui'); if (t) t.scrollIntoView({ block: 'center', behavior: 'smooth' }); else { st.any = String(new Date().getFullYear()); renderMain(); } });
  $('#sol-print').addEventListener('click', () => window.print());
}

/* ---------- Clients per administrador (l'antic "llistat de clients per assessoria") ---------- */
function renderClientsPerAdministrador(main) {
  const st = state.cpa, avuiS = avui();
  const admins = C.rows('administradors').filter(a => a.actiu || st.baixes).sort((a, b) => a.nom.localeCompare(b.nom, 'ca'));
  const contracteVigent = c => C.rows('agrupacions').some(a => a.actiu && Number(a.client_id) === c.id && a.data_inici <= avuiS && (!a.data_fi || a.data_fi >= avuiS));
  const norm = s => String(s || '').toLowerCase();
  const nomGestor = c => { const g = c.gestor_id ? C.get('contactes', c.gestor_id) : null; return g ? g.nom : ''; };
  const contacteHTML = id => { const p = id ? C.get('contactes', id) : null; return p ? h(p.nom) + (p.telefon ? ` <span class="tel">${h(p.telefon)}</span>` : '') : ''; };
  main.innerHTML = `
    <h1>Clients per administrador</h1>
    <p class="sub noprint">Els llocs de cada client agrupats per l’administrador que el porta, amb l’adreça, el gestor del despatx i el contacte a peu de finca. Clica una fila per obrir el lloc.</p>
    <div class="bar">
      <select id="cpa-admin" style="width:auto; min-width:260px"><option value="">Tots els administradors</option>${admins.map(a => `<option value="${a.id}" ${String(a.id) === st.admin ? 'selected' : ''}>${h(a.nom)}</option>`).join('')}</select>
      <input type="text" id="cpa-q" placeholder="Filtra per client, lloc, adreça o població…" value="${h(st.q)}">
      <label class="chk" style="padding:0"><input type="checkbox" id="cpa-vigent" ${st.vigent ? 'checked' : ''}> Només amb contracte vigent</label>
      <label class="chk" style="padding:0"><input type="checkbox" id="cpa-baixes" ${st.baixes ? 'checked' : ''}> Inclou els donats de baixa</label>
      <button class="btn ghost" id="cpa-print">Imprimeix (A4 apaïsat)</button>
    </div>
    <div id="cpa-cos" class="cpa"></div>`;
  const cos = () => {
    const q = norm(st.q).trim();
    let nAdm = 0, nCli = 0, nLlocs = 0, blocs = '';
    for (const a of admins) {
      if (st.admin && String(a.id) !== st.admin) continue;
      const clients = C.rows('clients').filter(c => Number(c.administrador_id) === a.id && (c.actiu || st.baixes) && (!st.vigent || contracteVigent(c)));
      const files = [];
      for (const c of clients) {
        const llocs = C.rows('llocs').filter(l => Number(l.client_id) === c.id && (l.actiu || st.baixes));
        if (!llocs.length) files.push({ c, l: null, pobl: c.poblacio, adr: c.adreca, nom: '', off: !c.actiu });
        llocs.forEach(l => files.push({ c, l, pobl: l.poblacio, adr: l.adreca, nom: l.nom, off: !c.actiu || !l.actiu }));
      }
      const vis = files.filter(f => !q || [a.nom, f.c.nom, f.nom, f.adr, f.pobl].some(x => norm(x).includes(q)))
        .sort((x, y) => (x.l ? 0 : 1) - (y.l ? 0 : 1) || (x.nom || '').localeCompare(y.nom || '', 'ca', { numeric: true }) || x.c.nom.localeCompare(y.c.nom, 'ca'));
      if (!vis.length) continue;
      const nc = new Set(vis.map(f => f.c.id)).size, nl = vis.filter(f => f.l).length;
      nAdm++; nCli += nc; nLlocs += nl;
      const meta = [a.telefon, a.email, a.poblacio].filter(Boolean).map(h).join(' · ');
      blocs += `<div class="blk${a.actiu ? '' : ' off'}">
        <div class="cap"><h2>${h(a.nom)}</h2>${meta ? `<span class="meta">${meta}</span>` : ''}<span class="n">${nc} ${nc === 1 ? 'client' : 'clients'} · ${nl} ${nl === 1 ? 'lloc' : 'llocs'}</span></div>
        <table class="tbl informe"><colgroup><col style="width:17%"><col style="width:22%"><col style="width:12%"><col style="width:25%"><col style="width:11%"><col style="width:13%"></colgroup><thead><tr><th>Població</th><th>Adreça</th><th>Lloc</th><th>Client</th><th>Gestor</th><th>Contacte</th></tr></thead><tbody>
          ${vis.map(f => `<tr class="row${f.off ? ' off' : ''}" data-taula="${f.l ? 'llocs' : 'clients'}" data-id="${f.l ? f.l.id : f.c.id}"><td class="pobl">${h(f.pobl || '')}</td><td>${h(f.adr || '')}</td><td class="lloc">${f.l ? h(f.nom) : '<i>sense lloc</i>'}</td><td>${h(f.c.nom)}${f.off ? ' <span class="tel">(baixa)</span>' : ''}</td><td>${h(nomGestor(f.c))}</td><td>${f.l ? contacteHTML(f.l.contacte_id) : ''}</td></tr>`).join('')}
        </tbody></table></div>`;
    }
    $('#cpa-cos').innerHTML = `<div class="capsal"><span>Administradors <b>${nAdm}</b></span><span>Clients <b>${nCli}</b></span><span>Llocs <b>${nLlocs}</b></span><span>Data <b>${dmy(avuiS)}</b></span></div>` + (blocs || '<div class="empty">Cap client amb aquests filtres.</div>');
    $('#cpa-cos').querySelectorAll('tr.row[data-taula]').forEach(tr => tr.addEventListener('click', () => {
      state.mode = 'consulta'; state.table = tr.dataset.taula; state.editing = Number(tr.dataset.id); renderApp(); window.scrollTo({ top: 0 });
    }));
  };
  cos();
  $('#cpa-admin').addEventListener('change', e => { st.admin = e.target.value; cos(); });
  $('#cpa-q').addEventListener('input', e => { st.q = e.target.value; cos(); });
  $('#cpa-vigent').addEventListener('change', e => { st.vigent = e.target.checked; cos(); });
  $('#cpa-baixes').addEventListener('change', e => { st.baixes = e.target.checked; renderMain(); });
  $('#cpa-print').addEventListener('click', imprimeixApaisat);
}

/* ---------- Informe: adob per equips ---------- */
const kgAdob = j => Math.round((Number(j.m2_gespa) || 0) / 10000 * 420 / 6 / 0.19);
const fmtNum = v => Number.isInteger(Number(v)) ? String(v) : Number(v).toFixed(2).replace('.', ',');

function renderInformeAdob(main) {
  const avuiS = avui();
  const contracteViu = j => { if (!j.agrupacio_id) return false; const a = C.get('agrupacions', j.agrupacio_id); return !!a && a.actiu && (!a.data_fi || a.data_fi >= avuiS); };
  const jardins = C.rows('jardins').filter(j => j.actiu && contracteViu(j));
  const equips = C.rows('equips').filter(e => e.actiu).sort((a, b) => a.nom.localeCompare(b.nom, 'ca'));
  const grups = [...equips.map(e => ({ id: e.id, nom: e.nom })), { id: null, nom: 'Sense equip' }].filter(g => !state.filtreEquip || String(g.id) === state.filtreEquip);
  let total = 0, blocs = '', mostrats = 0;
  for (const g of grups) {
    const rows = jardins.filter(j => (g.id == null ? !j.equip_id : Number(j.equip_id) === g.id))
      .map(j => ({ lloc: (C.get('llocs', j.lloc_id) || {}).nom || '', m2: Number(j.m2_gespa) || 0, kg: kgAdob(j) }))
      .sort((a, b) => a.lloc.localeCompare(b.lloc, 'ca'));
    if (!rows.length) continue;
    const sub = rows.reduce((t, r) => t + r.kg, 0); total += sub; mostrats++;
    blocs += `<h2 class="grup">${h(g.nom)}</h2>
      <table class="tbl informe"><thead><tr><th>Lloc</th><th class="num">m² de gespa</th><th class="num">Kg d’adob</th><th class="num">Sacs de 25 kg</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${h(r.lloc)}</td><td class="num">${fmtNum(r.m2)}</td><td class="num">${r.kg}</td><td></td></tr>`).join('')}
        <tr class="total"><td>Total ${h(g.nom)}</td><td></td><td class="num">${sub}</td><td class="num">${Math.ceil(sub / 25)}</td></tr>
      </tbody></table>`;
  }
  const totalGeneral = mostrats > 1 ? `<h2 class="grup">Total general</h2>
      <table class="tbl informe"><tbody><tr class="total"><td>Tots els equips</td><td></td><td class="num">${total} kg</td><td class="num">${Math.ceil(total / 25)} sacs</td></tr></tbody></table>` : '';
  main.innerHTML = `
    <h1>Adob per equips</h1>
    <p class="sub">Jardins amb contracte vigent a ${dmy(avuiS)}. Kg d’adob = arrodonir(m² de gespa / 10.000 × 420 / 6 / 0,19). Sacs = Kg / 25, arrodonit a l’alça.</p>
    <div class="bar">
      <select id="equip"><option value="">Tots els equips</option>${equips.map(e => `<option value="${e.id}" ${String(e.id) === state.filtreEquip ? 'selected' : ''}>${h(e.nom)}</option>`).join('')}<option value="null" ${state.filtreEquip === 'null' ? 'selected' : ''}>Sense equip</option></select>
      <button class="btn ghost" id="imprimeix">Imprimeix</button>
    </div>
    ${blocs || '<div class="empty">Cap jardí amb contracte vigent.</div>'}
    ${totalGeneral}`;
  $('#equip').addEventListener('change', e => { state.filtreEquip = e.target.value; renderMain(); });
  $('#imprimeix').addEventListener('click', () => window.print());
}

async function toggleActiu(td) {
  const t = state.table, row = C.get(t, state.editing);
  const label = td.display(row, L);
  if (row.actiu && !confirm(`Donar de baixa "${label}"? No s’esborra res: deixa de sortir a les llistes i als desplegables.`)) return;
  const { error } = await sb.from(t).update({ actiu: !row.actiu }).eq('id', row.id);
  if (error) { showFormError(friendly(error)); return; }
  await loadTable(t);
  let extra = '';
  if (row.actiu && td.enBaixa) { try { extra = (await td.enBaixa(row)) || ''; } catch (e) { toastErr(friendly(e)); } }
  state.editing = null; toast((row.actiu ? 'Donat de baixa' : 'Reactivat') + extra);
  renderMain();
}

const dmyhm = ts => { if (!ts) return ''; const d = new Date(ts); if (isNaN(d.getTime())) return ''; const p = n => String(n).padStart(2, '0'); return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const aLocalDT = ts => { if (!ts) return ''; const d = new Date(ts); if (isNaN(d.getTime())) return ''; const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const deLocalDT = v => v ? new Date(v).toISOString() : null;
// venciment segons el grup de termini (dies naturals; límit a les 20:00)
function vencimentPerGrup(grup, base) {
  const d = base ? new Date(base) : new Date();
  const a20 = dies => { const x = new Date(d); x.setDate(x.getDate() + dies); x.setHours(20, 0, 0, 0); return x; };
  if (grup === 'emergencia') return d;
  if (grup === 'molt_urgent') { const x = a20(0); return x > d ? x : new Date(d.getTime() + 2 * 3600000); }
  if (grup === 'forca_urgent') return a20(1);
  if (grup === 'mig_termini') return a20(7);
  if (grup === 'urgencia_relativa') return a20(14);
  return a20(30);
}
const accionsInc = inc => C.rows('incidencia_accions').filter(a => a.actiu && Number(a.incidencia_id) === inc.id);
// peticions fetes des d'una acció que encara no s'han donat per resoltes (a la vista del client, només les que el client pot veure)
const peticionsPendents = a => C.rows('incidencia_accions').filter(x => x.actiu && Number(x.origen_accio_id) === a.id && x.es_peticio && !x.resolta && accioVisibleCapa(x));
// programada: té una data d'inici que encara no ha arribat (només es pot començar al març, s'ha de fer dijous vinent…); fins llavors no compta com a oberta
const iniciFutur = a => !!a && !!a.inici && a.estat === 'pendent' && new Date(a.inici) > new Date();
const estatEfectiu = a => a.estat === 'finalitzada' ? 'finalitzada' : (peticionsPendents(a).length ? 'esperant' : iniciFutur(a) ? 'programada' : a.estat);

const foraTermini = a => !!a.venciment && (a.estat === 'finalitzada' ? !!a.finalitzada_el && new Date(a.finalitzada_el) > new Date(a.venciment) : new Date() > new Date(a.venciment));
const nomResponsable = a => a.responsable_treballador_id ? nomTreballador(C.get('treballadors', a.responsable_treballador_id)) : a.responsable_proveidor_id ? (C.get('proveidors', a.responsable_proveidor_id) || {}).nom || '' : a.responsable_contacte_id ? (C.get('contactes', a.responsable_contacte_id) || {}).nom || '' : '';
const socResponsable = a => { const t = trebInc(); return !!t && (Number(a.responsable_treballador_id) === t.id || Number(a.gestor_id) === t.id); };
const socCreador = a => { const t = trebInc(); return !!t && Number(a.creat_per) === t.id; };

// persones del client i del seu administrador, i el contacte a peu de finca del lloc
function contactesDelLloc(llocId) {
  const lloc = C.get('llocs', llocId); if (!lloc) return [];
  const client = C.get('clients', lloc.client_id) || {};
  const ids = new Set();

  return out.filter(c => { if (ids.has(c.id)) return false; ids.add(c.id); return true; }).sort((a, b) => a.nom.localeCompare(b.nom, 'ca'));
}

/* ---------- adjunts (fotos, vídeos, documents) a Storage ---------- */
const tipusAdjunt = nom => /\.(jpe?g|png|gif|webp|heic)$/i.test(nom) ? 'foto' : /\.(mp4|mov|webm|m4v|3gp)$/i.test(nom) ? 'video' : 'document';
async function pujaAdjunts(carpeta, fitxers) {
  const out = [];
  for (const f of fitxers) {
    const path = `incidencies/${carpeta}/${Date.now()}_${f.name.replace(/[^\w.\-]+/g, '_')}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || undefined });
    if (error) throw new Error('No s’ha pogut pujar ' + f.name + ': ' + friendly(error));
    out.push({ path, nom: f.name, tipus: tipusAdjunt(f.name) });
  }
  return out;
}
async function urlAdjunt(path) {
  if (INC_URLS[path]) return INC_URLS[path];
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (error) return null;
  INC_URLS[path] = data.signedUrl; return data.signedUrl;
}
function miniaturesHTML(adjunts, maxim) {
  const llista = Array.isArray(adjunts) ? adjunts : [];
  const vis = maxim ? llista.slice(0, maxim) : llista, resta = llista.length - vis.length;
  return vis.map(a => a.tipus === 'foto' ? `<img class="ic-mini" data-adj="${h(a.path)}" alt="${h(a.nom)}" title="${h(a.nom)}">`
    : a.tipus === 'video' ? `<video class="ic-mini" data-adj="${h(a.path)}" muted preload="metadata" title="${h(a.nom)}"></video>`
    : `<a class="ic-doc" data-adj="${h(a.path)}" href="#" title="${h(a.nom)}">📄 ${h(a.nom.length > 18 ? a.nom.slice(0, 16) + '…' : a.nom)}</a>`).join('') + (resta > 0 ? `<span class="ic-mes">+${resta}</span>` : '');
}
// posa els enllaços signats a les miniatures acabades de pintar
async function ompleMiniatures(arrel) {
  const els = [...(arrel || document).querySelectorAll('[data-adj]')];
  for (const el of els) {
    if (el.dataset.fet) continue; el.dataset.fet = '1';
    const url = await urlAdjunt(el.dataset.adj); if (!url) continue;
    if (el.tagName === 'IMG') { el.src = url; el.addEventListener('click', () => window.open(url, '_blank')); }
    else if (el.tagName === 'VIDEO') { el.src = url + '#t=0.5'; el.addEventListener('click', () => { if (el.controls) return; el.controls = true; el.currentTime = 0; el.play(); }); }
    else { el.href = url; el.target = '_blank'; }
  }
}

function reportBind(frm, td) {
  const btn = $('#gps-report'), nota = $('#gps-nota');

      const cand = C.rows('llocs').filter(l => l.actiu && l.latitud != null && l.longitud != null).map(l => ({ l, d: distKm(la, lo, Number(l.latitud), Number(l.longitud)) })).sort((a, b) => a.d - b.d);

      const m = cand[0]; if (m.d > 2) { nota.textContent = `El lloc més proper (${m.l.nom}) és a ${m.d.toFixed(1)} km: tria’l a mà.`; return; }
      const sel = frm.querySelector('select[name="lloc_id"]'); sel.value = String(m.l.id); sel.dispatchEvent(new Event('change', { bubbles: true })); nota.textContent = `${m.l.nom} (${Math.round(m.d * 1000)} m)`;
    }, err => { btn.disabled = false; nota.textContent = 'No s’ha pogut llegir el GPS (' + err.message + '). Tria el lloc a mà.'; }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });
  // en triar una persona registrada, s'omplen nom, correu i telèfon (si eren buits)
  const selC = frm.querySelector('[name="contacte_id"]');
  if (selC) selC.addEventListener('change', () => {

  });
  const inp = $('#rep-fitxers');
  if (inp) inp.addEventListener('change', async () => {

    catch (e) { showFormError(friendly(e)); }
  });
  ompleMiniatures($('#main'));

        ${rep ? `<div class="f wide"><span class="l">Reportat per</span><div class="info">${h(quiReporta(rep))}${rep.treballador_comunica_id ? ' (treballador)' : ''}${correuReporta(rep) ? ' · ' + h(correuReporta(rep)) : ''}${rep.telefon_comunica ? ' · ' + h(rep.telefon_comunica) : ''} · ${dmyhm(rep.data_hora)}${Array.isArray(rep.adjunts) && rep.adjunts.length ? ' · ' + rep.adjunts.length + ' fitxers adjunts (quedaran a la documentació de la incidència)' : ''}</div></div>` : ''}
        <label class="f wide"><span class="l">Títol <b>*</b></span><input type="text" name="titol" value="${h(n.titol || '')}"></label>
        <label class="f wide"><span class="l">Descripció</span><textarea lang="ca" spellcheck="true" name="descripcio">${h(n.descripcio || '')}</textarea></label>
        <div class="ic-primera">
          <h4>Primer pas: a qui s’encarrega i amb quin termini</h4>
          <label class="f"><span class="l">Què s’encarrega <b>*</b></span><select name="p_tipus">${INC.primers.map(k => `<option value="${k}" ${(n.p_tipus || 'diagnosticar') === k ? 'selected' : ''}>F${INC.tipus[k].fase} · ${h(INC.tipus[k].nom)}</option>`).join('')}</select></label>
          <label class="f"><span class="l">Responsable <b>*</b></span><select name="p_resp">${treballadors.map(x => `<option value="${x.id}" ${Number(n.p_resp || (t ? t.id : 0)) === x.id ? 'selected' : ''}>${h(nomTreballador(x))}</option>`).join('')}</select></label>
          <label class="f"><span class="l">Es pot començar</span><input type="datetime-local" name="p_inici" value="${h(n.p_inici || '')}"><span class="hint">buit = de seguida; amb data, queda programada fins llavors</span></label>
          <label class="f"><span class="l">Grup de termini <b>*</b></span><select name="p_grup">${INC.grups.map(g => `<option value="${g[0]}" ${g[0] === grup ? 'selected' : ''}>${h(g[1])}</option>`).join('')}</select></label>
          <label class="f"><span class="l">Termini final (venciment) <b>*</b></span><input type="datetime-local" name="p_venc" value="${h(venc)}"></label>
          <label class="f wide"><span class="l">Instruccions per a qui ho fa</span><textarea lang="ca" spellcheck="true" name="p_desc">${h(n.p_desc || '')}</textarea></label>
        </div>
        <div class="f wide"><span class="l">Informació a disposició de (client, administrador, president…)</span>
          <div class="multi" id="inc-contactes">${contactes.length ? contactes.map(c => `<label><input type="checkbox" name="contactes" value="${c.id}" ${marcats.has(c.id) ? 'checked' : ''}><span>${h(c.nom)}${c.carrec ? ' (' + h(c.carrec) + ')' : ''}${c.administrador_id ? ' · ' + h(L('administradors', c.administrador_id)) : ''}</span></label>`).join('') : '<span class="hint">tria el lloc per veure’n les persones</span>'}</div>
          <span class="hint">només informa: al carril del client només hi haurà una caixa quan se li demani una autorització (econòmica o d’actuació)</span></div>
        <label class="f wide"><span class="l">Observacions internes</span><textarea lang="ca" spellcheck="true" name="observacions_internes">${h(n.observacions_internes || '')}</textarea><span class="hint">${NOTA_INTERNES}</span></label>
      </div>
      <div class="actions"><button class="btn" id="inc-crea">Obre la incidència</button><button class="btn ghost" id="inc-cancel">Cancel·la</button></div>
    </div>`;
  const guarda = () => { n.titol = $('[name=titol]').value; n.descripcio = $('[name=descripcio]').value; n.seguidora_id = t.id; n.p_tipus = $('[name=p_tipus]').value; n.p_resp = Number($('[name=p_resp]').value); n.p_grup = $('[name=p_grup]').value; n.grup = n.p_grup; n.p_inici = $('[name=p_inici]').value; n.venciment = $('[name=p_venc]').value; n.p_desc = $('[name=p_desc]').value; n.observacions_internes = $('[name=observacions_internes]').value; n.contactes = [...document.querySelectorAll('[name=contactes]:checked')].map(e => Number(e.value)); };
  $('[name=lloc_id]').addEventListener('change', e => { guarda(); n.lloc_id = Number(e.target.value) || null; n.contactes = null; renderMain(); });
  $('[name=p_grup]').addEventListener('change', () => { guarda(); n.venciment = ''; renderMain(); });
  $('[name=p_inici]').addEventListener('change', () => { guarda(); n.venciment = ''; renderMain(); });
  $('#inc-cancel').addEventListener('click', () => { st.vista = 'llista'; st.nova = null; renderMain(); });
  $('#inc-crea').addEventListener('click', async () => {
    guarda();
    const lloc_id = Number($('[name=lloc_id]').value), titol = n.titol.trim(), seguidora_id = n.seguidora_id;
    if (!lloc_id || !titol || !seguidora_id) { showFormError('Falten el lloc, el títol o la seguidora.'); return; }
    if (!n.p_tipus || !n.p_resp || !n.venciment) { showFormError('Cal encarregar el primer pas: què, a qui i amb quin venciment.'); return; }
    if (n.p_inici && new Date(n.p_inici) > new Date(n.venciment)) { showFormError('La data en què es pot començar no pot ser després del venciment.'); return; }
    $('#inc-crea').disabled = true;
    try {
      const ins = await sb.from('incidencies').insert({ lloc_id, titol, descripcio: n.descripcio.trim() || null, seguidora_id, contactes_autoritzats: n.contactes, observacions_internes: n.observacions_internes.trim() || null }).select('id').single();
      if (ins.error) throw ins.error;
      const incId = ins.data.id, ara = new Date().toISOString();
      const obrir = await sb.from('incidencia_accions').insert({ incidencia_id: incId, tipus: 'obrir', carril: 'seguidora', titol: 'Obertura de la incidència', descripcio: n.descripcio.trim() || null, creat_per: t.id, responsable_treballador_id: seguidora_id, estat: 'finalitzada', finalitzada_el: ara, finalitzada_per: t.id, resultat: rep ? 'Oberta a partir del report de ' + quiReporta(rep) + ' (' + dmyhm(rep.data_hora) + ')' : 'Oberta', adjunts: [], visible_client: true }).select('id').single();
      if (obrir.error) throw obrir.error;
      const tp = INC.tipus[n.p_tipus], incTmp = { seguidora_id };
      const carril = carrilDeResponsable(incTmp, n.p_resp);
      const dadesPrimer = { incidencia_id: incId, tipus: n.p_tipus, carril, titol: tp.nom, descripcio: n.p_desc.trim() || null, creat_per: t.id, responsable_treballador_id: n.p_resp, estat: 'pendent', grup_termini: n.p_grup, venciment: deLocalDT(n.venciment), inici: n.p_inici ? deLocalDT(n.p_inici) : null, origen_accio_id: obrir.data.id, es_peticio: false, visible_client: tp.visibleClient !== false };
      const primer = await sb.from('incidencia_accions').insert(dadesPrimer).select('id').single();
      if (primer.error) throw primer.error;
      if (accioAmbFull(dadesPrimer)) { try { await creaFullPerAccio({ id: incId, lloc_id }, { ...dadesPrimer, id: primer.data.id }); } catch (e2) { toastErr('Incidència oberta, però el full de treball del primer pas no: ' + friendly(e2)); } }
      if (rep) { await sb.from('incidencia_reports').update({ estat: 'incidencia', incidencia_id: incId }).eq('id', rep.id); }
      await eventInc(incId, obrir.data.id, 'obertura', 'Incidència oberta' + (rep ? ' des del report ' + rep.id : ''));
      await eventInc(incId, primer.data.id, 'nova_accio', tp.nom + ' → ' + nomTreballador(C.get('treballadors', n.p_resp)) + ' · venç ' + dmyhm(n.venciment));
      const nomsC = n.contactes.map(id => (C.get('contactes', id) || {}).nom).filter(Boolean).join(', ');
      await eventInc(incId, null, 'informacio_client', nomsC ? 'Informació a disposició de: ' + nomsC : 'Cap persona del client marcada');
      await recarregaInc();
      toast('Incidència oberta');
      st.vista = 'diagrama'; st.id = incId; st.nova = null; st.sel = null; st.form = null; renderMain(); window.scrollTo({ top: 0 });
    } catch (e) { $('#inc-crea').disabled = false; showFormError(friendly(e)); }
  });
}

/* ---------- documentació de tota la incidència: fotos, vídeos i documents del report (punt 0) i de cada acció ---------- */
function reportsInc(inc) { return C.rows('incidencia_reports').filter(r => r.actiu && Number(r.incidencia_id) === inc.id).sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora))); }
function adjuntsIncidencia(inc) {
  const grups = [];
  reportsInc(inc).forEach(r => { if (Array.isArray(r.adjunts) && r.adjunts.length) grups.push({ titol: 'Report de ' + quiReporta(r), data: r.data_hora, adjunts: r.adjunts, report: r.id }); });
  accionsVisibles(inc).filter(a => Array.isArray(a.adjunts) && a.adjunts.length).sort((a, b) => String(a.creat_el).localeCompare(String(b.creat_el)))
    .forEach(a => grups.push({ titol: nomTipus(a.tipus) + ' · ' + nomResponsable(a), data: a.finalitzada_el || a.creat_el, adjunts: a.adjunts, accio: a.id }));
  return grups;
}
const nAdjuntsInc = inc => adjuntsIncidencia(inc).reduce((n, g) => n + g.adjunts.length, 0);
function galeriaHTML(inc, compacta) {
  const grups = adjuntsIncidencia(inc);
  if (!grups.length) return '<p class="hint">Encara no hi ha cap foto, vídeo ni document.</p>';
  return grups.map(g => `<div class="ic-gal-grup"><div class="ic-gal-cap">${h(g.titol)} <span class="hint">· ${dmyhm(g.data)}${g.accio ? ` · <a href="#" data-sel="${g.accio}">obre</a>` : ''}</span></div><div class="ic-thumbs ${compacta ? '' : 'gran'}">${miniaturesHTML(g.adjunts)}</div></div>`).join('');
}
const enllacMailto = (a, assumpte, cos) => 'mailto:' + encodeURIComponent(a) + '?subject=' + encodeURIComponent(assumpte) + '&body=' + encodeURIComponent(cos);
// resum per a qui va avisar, en tancar: què s'ha fet (només les accions visibles per al client), motiu i resultat
function cosResumTancament(inc, r) {
  const fetes = accionsInc(inc).filter(a => a.estat === 'finalitzada' && a.visible_client && !['obrir', 'tancar', 'reobrir', 'assignar_seguidora', 'visibilitat_client'].includes(a.tipus)).sort((a, b) => String(a.finalitzada_el).localeCompare(String(b.finalitzada_el)));
  const linies = fetes.map(a => '- ' + dmy(a.finalitzada_el) + ' · ' + nomTipus(a.tipus) + (a.resultat ? ': ' + String(a.resultat).replace(/\s+/g, ' ').slice(0, 160) : ''));
  return `Hola ${quiReporta(r)},\n\nUs informem que l’avís que ens vau fer el ${dmyhm(r.data_hora)} (${String(r.descripcio || '').split('\n')[0].slice(0, 120)}) ha quedat resolt.\n\nIncidència ${inc.numero} · ${inc.titol}\nLloc: ${llocInc(inc).nom || ''}\nTancada el ${dmyhm(inc.data_tancament)} · ${etiquetaOpt(INC.motiusTancament, inc.motiu_tancament)}\nResultat: ${inc.resultat_final || ''}\n${linies.length ? '\nQuè s’ha fet:\n' + linies.join('\n') + '\n' : ''}\nGràcies per avisar-nos.\n\n${nomTreballador(trebInc())}\nOutdoor Engineering Solutions`;
}
/* ---------- codis QR dels llocs: obren la pàgina pública d'avís (report.html?lloc=CODI) ---------- */
function qrSvg(text) { if (typeof qrcode !== 'function') return ''; const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
function renderCodisQR(main) {
  const st = state.qr;
  const base = st.base || new URL('report.html', location.href).href;
  const llocs = C.rows('llocs').filter(l => l.actiu).sort((a, b) => a.nom.localeCompare(b.nom, 'ca'));
  const sel = st.lloc ? llocs.filter(l => String(l.id) === st.lloc) : llocs;
  const teLib = typeof qrcode === 'function';
  const urlDe = l => base + (base.includes('?') ? '&' : '?') + 'lloc=' + l.codi_qr;
  main.innerHTML = `<h1>Codis QR dels llocs</h1>
    <p class="sub noprint">Cada codi obre la pàgina pública d’avís d’un problema d’aquell lloc (només pot enviar l’avís: no veu res més). Imprimeix-los i penja’ls a la finca. Tria un lloc per imprimir-lo gran, en una pàgina.</p>
    <div class="bar noprint">
      <select id="qr-lloc" style="width:auto; min-width:220px"><option value="">Tots els llocs</option>${llocs.map(l => `<option value="${l.id}" ${String(l.id) === st.lloc ? 'selected' : ''}>${h(l.nom)}</option>`).join('')}</select>
      <label class="f" style="flex-direction:row; align-items:center; gap:8px"><span class="l">Adreça de la pàgina pública</span><input type="text" id="qr-base" value="${h(base)}" style="width:360px"></label>
      <button class="btn" id="qr-print">Imprimeix</button><span class="n">${sel.length} ${sel.length === 1 ? 'codi' : 'codis'}</span>
    </div>
    ${!teLib ? '<div class="msg err">No s’ha pogut carregar la llibreria dels codis QR: cal connexió a Internet. Recarrega la pàgina.</div>' : ''}
    <div class="qr-full">${sel.map(l => `<div class="qr-card ${st.lloc ? 'gran' : ''}">${l.codi_qr ? qrSvg(urlDe(l)) : '<div class="hint" style="padding:40px 0">sense codi: executa el SQL 048</div>'}<div class="qr-nom">${h(l.nom)}</div><div class="qr-txt">Has vist un problema al jardí o a la piscina? Escaneja i avisa’ns.<br><span class="es">¿Has visto un problema en el jardín o la piscina? Escanea y avísanos.</span></div>${l.codi_qr ? `<div class="qr-url">${h(urlDe(l))}</div>` : ''}</div>`).join('')}</div>`;
  $('#qr-lloc').addEventListener('change', e => { st.lloc = e.target.value; renderMain(); });
  $('#qr-base').addEventListener('change', e => { st.base = e.target.value.trim(); renderMain(); });
  $('#qr-print').addEventListener('click', () => window.print());
}
// correu a qui va fer el report, amb l'estat actual (el client de correu de l'ordinador; de moment no s'envia res sol)
function enllacCorreuReport(inc) {
  const r = reportsInc(inc).find(x => correuReporta(x)); if (!r) return '';
  const obertes = accionsInc(inc).filter(a => a.estat !== 'finalitzada');
  const cos = `Hola ${quiReporta(r)},\n\nSobre el que ens vau comunicar el ${dmyhm(r.data_hora)} (${String(r.descripcio || '').split('\n')[0]}):\n\nIncidència ${inc.numero} · ${inc.titol}\nEstat: ${inc.estat === 'oberta' ? 'oberta' : 'tancada el ' + dmyhm(inc.data_tancament) + ' (' + etiquetaOpt(INC.motiusTancament, inc.motiu_tancament) + ')'}\n${obertes.length ? 'Ara mateix: ' + obertes.map(a => nomTipus(a.tipus) + ' (' + nomResponsable(a) + (a.venciment ? ', previst ' + dmyhm(a.venciment) : '') + ')').join('; ') : ''}\n\nSalutacions,\n${nomTreballador(trebInc())}\nOutdoor Engineering Solutions`;
  return `<a class="btn ghost small" href="${enllacMailto(correuReporta(r), 'Incidència ' + inc.numero + ' · ' + inc.titol, cos)}" title="${h(correuReporta(r))}">Escriu a ${h(quiReporta(r))}</a>`;
}

/* ---------- qui veu què ----------
   Tota l'organització (administradors, oficina, tècnics i operaris) ho veu tot, observacions internes incloses.
   Els externs (el client, els subcontractistes i els proveïdors) només veuen les accions que els corresponen i mai les observacions internes.
   La capa és com es mira la incidència: 'interna' (la normal), 'client' o 'prov:<id>' (un subcontractista o proveïdor concret). */
const NOTA_INTERNES = 'les veu tota l’organització (també els operaris); mai el client, els subcontractistes ni els proveïdors';
const CARRILS_EXTERNS = ['client', 'subcontractista', 'proveidor'];
const vistaExterna = () => state.inc.capa !== 'interna';
const proveidorDeCapa = () => { const m = /^prov:(\d+)$/.exec(String(state.inc.capa || '')); return m ? Number(m[1]) : null; };
function accioVisibleCapa(a) {
  const capa = state.inc.capa;
  if (capa === 'interna') return true;
  if (capa === 'client') return !!a.visible_client;
  const p = proveidorDeCapa(); return p != null && Number(a.responsable_proveidor_id) === p;
}
// els externs que intervenen en una incidència: el client sempre, i cada subcontractista o proveïdor que hi té alguna acció
function externsInc(inc) {
  const out = [{ capa: 'client', carril: 'client', nom: clientInc(inc).nom || 'Client' }];
  const vists = new Set();
  accionsInc(inc).filter(a => a.responsable_proveidor_id).sort((a, b) => String(a.creat_el).localeCompare(String(b.creat_el))).forEach(a => {
    const id = Number(a.responsable_proveidor_id); if (vists.has(id)) return; vists.add(id);
    const p = C.get('proveidors', id) || {};
    out.push({ capa: 'prov:' + id, carril: CARRILS_EXTERNS.includes(a.carril) ? a.carril : (p.subcontractista ? 'subcontractista' : 'proveidor'), nom: p.nom || ('proveïdor ' + id), proveidor: p });
  });
  return out;
}
const externDeCapa = inc => vistaExterna() ? externsInc(inc).find(e => e.capa === state.inc.capa) || null : null;
const nomExtern = e => e.carril === 'client' ? 'el client' : (e.carril === 'subcontractista' ? 'el subcontractista ' : 'el proveïdor ') + e.nom;
const etiquetaCapa = e => e.carril === 'client' ? 'Vista del client' : (e.carril === 'subcontractista' ? 'Subcontractista: ' : 'Proveïdor: ') + (e.nom.length > 24 ? e.nom.slice(0, 22) + '…' : e.nom);
// correu a un subcontractista o proveïdor amb l'encàrrec: què, on i fins quan; cap observació interna (s'obre al programa de correu)
function enllacCorreuProveidor(inc, a, p) {
  const lloc = llocInc(inc), g = (a.gestor_id && C.get('treballadors', a.gestor_id)) || trebInc(), tipus = nomTipus(a.tipus);
  const cos = `Hola ${p.contacte || p.nom},\n\n${a.es_peticio ? 'Us demanem' : 'Us encarreguem'}: ${tipus}${a.titol && a.titol !== tipus ? ' · ' + a.titol : ''}\n${a.descripcio ? a.descripcio + '\n' : ''}\nLloc: ${lloc.nom || ''}${lloc.adreca ? ' · ' + lloc.adreca : ''}${lloc.poblacio ? ', ' + lloc.poblacio : ''}\nIncidència ${inc.numero} · ${inc.titol}${inc.descripcio ? '\n' + inc.descripcio : ''}\n${a.venciment ? 'Termini: ' + dmyhm(a.venciment) + '\n' : ''}\nPer a qualsevol dubte: ${nomTreballador(g)}${g && (g.email_acces || g.email) ? ' · ' + (g.email_acces || g.email) : ''}\n\nSalutacions,\n${nomTreballador(trebInc())}\nOutdoor Engineering Solutions`;
  return `<a class="btn ghost small" href="${enllacMailto(p.email, 'Incidència ' + inc.numero + ' · ' + tipus + ' · ' + (lloc.nom || ''), cos)}" title="${h(p.email)}">Prepara el correu per a ${h(p.nom)}</a> `;
}

/* ---------- el diagrama ---------- */
function accionsVisibles(inc) { return accionsInc(inc).filter(accioVisibleCapa); }
// files del diagrama: només per temps de creació, la més nova a dalt; així tota acció derivada queda per sobre de la d'origen i les fletxes sempre pugen
function ordenaAccions(acc) {
  return [...acc].sort((a, b) => String(b.creat_el).localeCompare(String(a.creat_el)) || (b.id - a.id));
}
function caixaHTML(a, fila) {
  const ee = estatEfectiu(a), fora = foraTermini(a), pend = peticionsPendents(a).length, tp = INC.tipus[a.tipus] || { nom: a.tipus, fase: '' };
  const client = vistaExterna(); // vista externa: sense qui ho gestiona ni ampliacions
  const amp = C.rows('incidencia_ampliacions').filter(x => x.actiu && Number(x.accio_id) === a.id && x.estat === 'pendent').length;
  const col = Math.max(1, INC.carrils.findIndex(c => c[0] === a.carril) + 1);
  return `<div class="ic-caixa e-${ee} ${fora ? 'fora' : ''} ${state.inc.sel === a.id ? 'sel' : ''}" data-accio="${a.id}" style="grid-row:${fila}; grid-column:${col}; --lc:${colorCarril(a.carril)}">
    <div class="ic-tipus"><span class="ic-fase">F${tp.fase}</span> ${h(tp.nom)}</div>
    ${a.titol && a.titol !== tp.nom ? `<div class="ic-titol">${h(a.titol)}</div>` : ''}
    <div class="ic-qui">${h(nomResponsable(a))}${a.gestor_id && !client ? ` <span class="hint">· gestiona ${h(nomCurtTreballador(C.get('treballadors', a.gestor_id)))}</span>` : ''}</div>
    <div class="ic-pills"><span class="pill e-${ee}">${INC.estats[ee]}</span>${fora ? '<span class="pill fora">Fora de termini</span>' : ''}${pend ? `<span class="pill dep">espera ${pend} ${pend === 1 ? 'resposta' : 'respostes'}</span>` : ''}${a.es_peticio && a.estat === 'finalitzada' && !a.resolta ? '<span class="pill dep">resposta per acceptar</span>' : ''}${amp && !client ? '<span class="pill dep">ampliació demanada</span>' : ''}${a.decisio ? `<span class="pill dec">${h(etiquetaOpt(INC.decisions, a.decisio).replace('Demana ', ''))}</span>` : ''}</div>
