<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestió de manteniment</title>
<meta name="theme-color" content="#2f7d4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icona-192.png">
<link rel="apple-touch-icon" href="icones/icona-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d2a1b; --ink-2:#5b6858; --ink-3:#8a9486;
    --line:#e2e7df; --line-2:#c6d0c1;
    --bg:#ffffff; --bg-2:#f5f8f3;
    --green:#2f7d4a; --green-2:#e4f1e8;
    --blue:#2b5f8a; --blue-2:#e5eef6;
    --red:#b8432b; --red-2:#fbebe7;
    --mode:var(--green); --mode-2:var(--green-2);
  }
  body[data-mode="consulta"]{ --mode:var(--blue); --mode-2:var(--blue-2); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
  body{ font-feature-settings:"tnum" 1; }
  a{ color:var(--mode); }
  h1{ font-size:26px; font-weight:500; margin:0 0 20px; letter-spacing:-.01em; }
  h2{ font-size:19px; font-weight:500; margin:0 0 14px; }
  h3{ font-size:15px; font-weight:500; margin:24px 0 10px; color:var(--ink-2); }
  p{ margin:0 0 12px; }
  .modebar{ height:4px; background:var(--mode); }
  .top{ display:flex; align-items:center; gap:20px; padding:12px 24px; border-bottom:1px solid var(--line); }
  .top .brand{ font-weight:500; cursor:pointer; }
  .top .who{ margin-left:auto; color:var(--ink-2); font-size:14px; display:flex; gap:14px; align-items:center; }
  .seg{ display:inline-flex; border:1px solid var(--line-2); border-radius:6px; overflow:hidden; }
  .seg button{ border:0; background:transparent; padding:6px 14px; font:inherit; cursor:pointer; color:var(--ink-2); }
  .seg button.on{ background:var(--mode); color:#fff; }
  .shell{ display:grid; grid-template-columns:230px minmax(0,1fr); min-height:calc(100vh - 53px); }
  .side{ border-right:1px solid var(--line); padding:20px 0; }
  .side .grp{ display:flex; align-items:stretch; margin:4px 0 14px; }
  .side .glw{ position:relative; width:38px; flex:0 0 38px; }
  .side .glw::after{ content:''; position:absolute; right:3px; top:6px; bottom:6px; width:3px; border-radius:2px; background:var(--gc); }
  .side .gl{ position:absolute; left:50%; top:50%; transform:translate(-50%, -50%) rotate(-90deg); transform-origin:center; font:600 13.5px/1 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; letter-spacing:.06em; color:var(--ink); white-space:nowrap; margin-left:-3px; }
  .side .gi{ flex:1; padding:4px 0 0 6px; min-width:0; }
  .side .buit{ padding:8px 14px; font-size:12.5px; color:var(--ink-3); font-style:italic; }
  .side button{ display:block; width:100%; text-align:left; border:0; background:transparent; padding:7px 14px; font:inherit; cursor:pointer; color:var(--ink); border-left:3px solid transparent; }
  .side button:hover{ background:var(--bg-2); }
  .side button.on{ border-left-color:var(--mode); background:var(--mode-2); }
  .main{ padding:32px 40px 60px; max-width:1160px; }
  .home{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; max-width:760px; margin-top:12px; }
  .home button{ text-align:left; border:1px solid var(--line-2); border-radius:8px; background:#fff; padding:28px 26px; font:inherit; cursor:pointer; color:var(--ink); }
  .home button:hover{ border-color:var(--ink-2); }
  .home button strong{ display:block; font-size:22px; font-weight:500; margin-bottom:6px; }
  .home button span{ color:var(--ink-2); font-size:14px; }
  .home button.entrada strong{ color:var(--green); }
  .home button.consulta strong{ color:var(--blue); }
  .operari .home{ grid-template-columns:1fr; max-width:520px; }
  .operari .home button strong{ font-size:24px; }
  .operari .main{ padding:20px 18px 60px; }
  .panel{ border:1px solid var(--line-2); border-left:4px solid var(--mode); border-radius:6px; padding:22px 26px 24px; margin-bottom:28px; background:#fff; }
  .panel.editing{ border-left-color:var(--red); }
  .panel .ph{ display:flex; align-items:baseline; gap:12px; margin-bottom:18px; }
  .panel .ph h2{ margin:0; }
  .panel .ph .sub{ color:var(--ink-2); font-size:14px; }
  .grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 26px; }
  .f{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .f.wide{ grid-column:1 / -1; }
  .f .l{ font-size:13.5px; color:var(--ink-2); }
  .f .l b{ color:var(--red); font-weight:500; }
  .f .hint{ font-size:12.5px; color:var(--ink-3); }
  .f .dup{ font-size:12.5px; color:var(--red); }
  .f .info{ padding:7px 0; font-weight:500; }
  .c-verd-fort{ background:#2e7d32 !important; color:#fff !important; }
  .c-verd-suau{ background:#a5d6a7 !important; color:#1d2a1b !important; }
  .c-taronja{ background:#ffb74d !important; color:#1d2a1b !important; }
  .c-vermell{ background:#d32f2f !important; color:#fff !important; font-weight:600; }
  .c-negre{ background:#222 !important; color:#fff !important; }
  td.cel{ border-radius:4px; font-weight:500; white-space:nowrap; }
  .avis{ margin-top:7px; padding:10px 13px; border:3px solid var(--line-2); border-radius:7px; line-height:1.35; background:#fff; text-align:center; }
  .avis .ca{ text-transform:uppercase; font-size:15.5px; font-weight:600; }
  .avis .es{ font-size:13px; color:var(--ink-2); margin-top:4px; }
  .avis.b-verd-suau{ border-color:#66bb6a; } .avis.b-taronja{ border-color:#fb8c00; } .avis.b-vermell{ border-color:#d32f2f; } .avis.b-negre{ border-color:#222; }
  .focs{ position:fixed; left:0; top:0; width:0; height:0; pointer-events:none; z-index:9999; }
  .focs i{ position:fixed; left:0; top:0; border-radius:50%; will-change:transform, opacity; }
  .f[hidden]{ display:none; }
  .chks{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px 20px; padding:12px 14px; border:1px solid var(--line-2); border-radius:6px; }
  .chks .f.chk{ padding-top:0; }
  @media (max-width:820px){ .chks{ grid-template-columns:1fr; } }
  .f .l .toca{ color:var(--red); font-weight:600; margin-left:6px; }
  .extres{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 16px; }
  .extres .nota{ font-size:13px; color:var(--ink-2); }
  @media (max-width:820px){ input[type=number],input[type=date],input[type=time],select{ font-size:16px; padding:10px 12px; } .btn{ padding:11px 18px; } }
  input:disabled,select:disabled,textarea:disabled{ background:var(--bg-2); color:var(--ink-2); }
  .ctx{ display:flex; flex-wrap:wrap; gap:6px 28px; align-items:baseline; margin:-4px 0 18px; padding:10px 14px; background:var(--bg-2); border-radius:5px; }
  .ctx .k{ font-size:12.5px; color:var(--ink-3); margin-right:8px; }
  .ctx .v{ font-size:18px; font-weight:500; }
  input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{
    font:inherit; color:var(--ink); background:#fff; border:1px solid var(--line-2); border-radius:4px; padding:7px 10px; width:100%; }
  textarea{ min-height:74px; resize:vertical; }
  input:focus,select:focus,textarea:focus,button:focus-visible{ outline:2px solid var(--mode); outline-offset:1px; }
  input[type=checkbox]{ width:16px; height:16px; accent-color:var(--mode); }
  .chk{ display:flex; align-items:center; gap:8px; padding-top:22px; }
  .file{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:14px; }
  .actions{ display:flex; gap:10px; align-items:center; margin-top:22px; flex-wrap:wrap; }
  .btn{ font:inherit; font-weight:500; border:1px solid var(--mode); background:var(--mode); color:#fff; border-radius:5px; padding:8px 16px; cursor:pointer; }
  .btn.ghost{ background:#fff; color:var(--ink); border-color:var(--line-2); }
  .btn.danger{ background:#fff; color:var(--red); border-color:var(--red); margin-left:auto; }
  .btn.small{ padding:4px 10px; font-weight:400; font-size:13.5px; }
  .btn:disabled{ opacity:.55; cursor:default; }
  .bar{ display:flex; gap:16px; align-items:center; margin:0 0 14px; flex-wrap:wrap; }
  .bar input[type=text]{ width:320px; }
  .bar .n{ color:var(--ink-3); font-size:14px; margin-left:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:14px; }
  .tbl th{ text-align:left; font-weight:500; color:var(--ink-2); padding:8px 10px; border-bottom:1px solid var(--line-2); white-space:nowrap; }
  .tbl td{ padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .tbl tr.row{ cursor:pointer; }
  .tbl tr.row:hover td{ background:var(--bg-2); }
  .tbl tr.off td{ color:var(--ink-3); }
  .tbl td.num{ text-align:right; white-space:nowrap; }
  .empty{ color:var(--ink-3); padding:24px 0; }
  .children{ margin-top:26px; }
  .children h3{ font-size:17px; font-weight:600; color:var(--ink); margin:22px 0 10px; }
  .toast.err{ background:var(--red); }
  .addrow{ display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-top:10px; }
  .addrow .f{ flex:1 1 150px; min-width:120px; }
  .addrow .f.chk{ flex:0 0 auto; padding-top:0; padding-bottom:8px; }
  .addrow .btn{ margin-bottom:1px; }
  .msg{ border-radius:5px; padding:10px 14px; margin:0 0 16px; font-size:14px; }
  .msg.err{ background:var(--red-2); color:var(--red); }
  .toast{ position:fixed; left:24px; bottom:24px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:6px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on{ opacity:1; }
  .login{ max-width:380px; margin:80px auto; padding:0 20px; }
  .login .f{ margin-bottom:14px; }
  @media (max-width:820px){
    .shell{ grid-template-columns:1fr; }
    .side{ border-right:0; border-bottom:1px solid var(--line); padding:8px 0; display:flex; overflow-x:auto; }
    .side .grp{ flex-direction:column; margin:0 6px; }
    .side .glw{ width:auto; min-height:0; padding:0 8px; }
    .side .glw::after{ left:8px; right:8px; top:auto; bottom:0; width:auto; height:3px; }
    .side .gl{ position:static; transform:none; padding:4px 0 6px; margin:0; }
    .side .grp{ min-height:0 !important; }
    .side .gi{ display:flex; padding:4px 0 0; }
    .side button{ width:auto; white-space:nowrap; border-left:0; border-bottom:3px solid transparent; }
    .side button.on{ border-bottom-color:var(--mode); }
    .main{ padding:20px 16px 50px; }
    .grid,.home{ grid-template-columns:1fr; }
    .bar input[type=text]{ width:100%; }
  }
  .graf{ position:relative; max-width:900px; height:380px; margin:8px 0 30px; }
  h2.grup{ margin-top:28px; padding-bottom:6px; border-bottom:2px solid var(--mode); display:inline-block; }
  .informe tr.total td{ font-weight:600; border-top:2px solid var(--ink-2); border-bottom:0; }
  .informe th.num{ text-align:right; }
  .sub{ color:var(--ink-2); font-size:14px; max-width:760px; }
  .capsal{ display:flex; flex-wrap:wrap; gap:6px 28px; margin:0 0 14px; }
  .capsal span{ font-size:14px; color:var(--ink-2); } .capsal b{ font-weight:600; color:var(--ink); }
  .tasques{ font-size:12.5px; border-collapse:separate; border-spacing:0 4px; }
  .tasques th, .tasques td{ padding:3px 6px; white-space:nowrap; }
  .tasques td{ border-bottom:1px solid var(--line); }
  .tasques th.vert{ height:92px; vertical-align:bottom; padding:4px 2px; }
  .tasques th.vert span{ display:inline-block; writing-mode:vertical-rl; transform:rotate(180deg); white-space:nowrap; font-weight:500; }
  .tasques td.ok, .tasques td.no, .tasques td.fet{ text-align:center; font-weight:700; }
  .tasques td.ok{ color:#2e7d32; } .tasques td.no{ color:#d32f2f; } .tasques td.fet{ color:#1f4e79; }
  .tasques td.cel{ padding:3px 6px; }
  .tasques td.obs{ font-size:11.5px; min-width:200px; white-space:normal; width:100%; }
  @media print{ .tasques{ font-size:9.5px; } .tasques th.vert{ height:70px; } .tasques td.cel, .tasques td.ok, .tasques td.no, .tasques td.fet, .avis{ -webkit-print-color-adjust:exact; print-color-adjust:exact; } .capsal{ margin-bottom:8px; } }
  @media print{
    .modebar,.top,.side,.bar,.toast{ display:none !important; }
    .shell{ display:block; }
    .main{ padding:0; max-width:none; }
    body{ font-size:12px; }
    h2.grup{ border-bottom-color:#000; }
    .tbl th{ border-bottom:1px solid #000; }
    .tbl td{ border-bottom:1px solid #ccc; }
    tr{ page-break-inside:avoid; }
    body.print-grafiques .ca-taula, body.print-grafiques h2.grup{ display:none !important; }
    body.print-grafiques .graf{ page-break-inside:avoid; height:420px; }
  }
  @media (prefers-reduced-motion:reduce){ .toast{ transition:none; } }
</style>
</head>

   ===================================================================== */
function readConfig() { try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null'); } catch (e) { return null; } }

async function loadTable(t) {
  const { data, error } = await sb.from(t).select('*').order((SCHEMA.tables[t] || {}).pk || 'id');
  if (error) throw error;
  cache[t] = data;
}
// carrega totes les taules; les que no existeixin (fitxer SQL pendent) no bloquegen l'entrada
async function loadAll() {
  const noms = Object.keys(SCHEMA.tables);
  const res = await Promise.allSettled(noms.map(loadTable));
  const faltes = [];
  res.forEach((r, i) => { if (r.status === 'rejected') { cache[noms[i]] = []; faltes.push(noms[i]); } });
  return faltes;
}

function renderConfig(err) {
  document.body.dataset.mode = 'entrada';
  $('#app').innerHTML = `
    <div class="login">
      <h1>Connexió</h1>
      <p>Les dues dades són a Supabase: Project Settings → API. Es guarden només en aquest navegador.</p>

      <form id="cfg">
        <div class="f"><span class="l">Project URL</span><input type="text" name="url" required placeholder="https://xxxx.supabase.co"></div>
        <div class="f"><span class="l">Clau anon (public)</span><input type="text" name="key" required></div>
        <div class="actions"><button class="btn" type="submit">Desa i continua</button></div>
      </form>
    </div>`;
  $('#cfg').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    let url = fd.get('url').trim();
    const dash = url.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
    const proj = url.match(/https?:\/\/[a-z0-9-]+\.supabase\.co/i);
    if (dash) url = 'https://' + dash[1] + '.supabase.co';
    else if (proj) url = proj[0];
    else url = url.replace(/\/+$/, '');
    localStorage.setItem(CONFIG_KEY, JSON.stringify({ url, key: fd.get('key').trim() }));
    init();
  });
}

function renderLogin(err) {
  document.body.dataset.mode = 'entrada';
  $('#app').innerHTML = `
    <div class="login">
      <h1>Gestió de manteniment</h1>
      ${err ? `<div class="msg err">${h(err)}</div>` : ''}
      <form id="lg">
        <div class="f"><span class="l">Correu</span><input type="email" name="email" required autocomplete="username"></div>
        <div class="f"><span class="l">Contrasenya</span><input type="password" name="password" required autocomplete="current-password"></div>
        <div class="actions">
          <button class="btn" type="submit">Entra</button>
          <button class="btn ghost" type="button" id="cfgbtn">Canvia la connexió</button>
        </div>
      </form>
    </div>`;
  $('#cfgbtn').addEventListener('click', () => { localStorage.removeItem(CONFIG_KEY); renderConfig(); });
  $('#lg').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
    if (error) { renderLogin(friendly(error)); return; }
    user = data.user;
    start();
  });
}

async function init() {
  const cfg = readConfig();
  if (!cfg) { renderConfig(); return; }
  try {
    sb = supabase.createClient(cfg.url, cfg.key);
  } catch (e) { renderConfig('La configuració no és vàlida: ' + e.message); return; }
  const { data } = await sb.auth.getSession();
  if (data && data.session) { user = data.session.user; start(); } else renderLogin();
}

async function start() {
  $('#app').innerHTML = `<div class="login"><p>Carregant dades…</p></div>`;
  let faltes = [];
  try { faltes = await loadAll(); }
  catch (e) { renderLogin('No s’han pogut carregar les taules: ' + friendly(e)); return; }
  renderApp();
  if (faltes.length) toastErr('Taules que la base de dades encara no té: ' + faltes.join(', ') + '. Executa el fitxer SQL que les crea (o «notify pgrst, \'reload schema\'» si acabes de fer-ho).');
}

/* ---------- Formulari ---------- */
function defaultValue(f) {
  if (f.key in state.keep) return state.keep[f.key];
  if (f.default === 'avui') return avui();
  if (typeof f.default === 'function') return f.default();
  return f.default ?? '';
}

function optionsHTML(f, vals, current) {
  const cur = current === '' || current == null ? null : Number(current);
  let rows = C.rows(f.ref).filter(r => r.actiu || r.id === cur);
  if (f.filter) rows = rows.filter(r => r.id === cur || f.filter(r, vals, C));
  const items = rows.map(r => ({ id: r.id, label: f.optionLabel ? f.optionLabel(r, C) : L(f.ref, r.id), grup: f.optgroup ? f.optgroup(r, vals, C) : null }));
  items.sort((a, b) => a.label.localeCompare(b.label, 'ca'));
  const opt = i => `<option value="${i.id}" ${i.id === cur ? 'selected' : ''}>${h(i.label)}</option>`;
  let out = `<option value="">${f.required ? 'Tria…' : '—'}</option>`;
  if (f.optgroup) {
    const grups = [...new Set(items.map(i => i.grup))].sort((a, b) => ORDRE_GRUPS.indexOf(a) - ORDRE_GRUPS.indexOf(b));
    for (const g of grups) out += `<optgroup label="${h(g)}">${items.filter(i => i.grup === g).map(opt).join('')}</optgroup>`;
  } else out += items.map(opt).join('');
  return out;
}

function valueOf(f, row) { return row ? (f.derive ? f.derive(row, C) : row[f.key]) : defaultValue(f); }
function inputHTML(f, vals, row) {
  const v = valueOf(f, row);
  const req = f.required ? 'required' : '';
  const dis = f.ro && f.ro(row) ? 'disabled' : '';
  const n = `name="${f.key}" ${dis}`;
  switch (f.type) {
    case 'info': return `<div class="info">${h(row ? (f.fmt ? f.fmt(row) : row[f.key]) : (f.fmt ? f.fmt({}) : ''))}</div>`;
    case 'hidden': return `<input type="hidden" ${n} value="${h(v ?? '')}">`;
    case 'textarea': return `<textarea ${n} ${req}>${h(v)}</textarea>`;
    case 'select': return `<select ${n} ${req} class="${f.color ? f.color(v, row) : ''}"><option value="">${f.required ? 'Tria…' : '—'}</option>${f.options.map(o => `<option value="${o[0]}" ${String(v) === o[0] ? 'selected' : ''}>${h(o[1])}</option>`).join('')}</select>`;
    case 'ref': return `<select ${n} ${req} data-ref="${f.ref}">${optionsHTML(f, vals, v)}</select>`;
    case 'boolean': return `<input type="checkbox" ${n} value="1" ${v === true || v === 'true' ? 'checked' : ''}>`;
    case 'number': return `<input type="number" ${n} ${req} step="${f.step || 'any'}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} value="${h(v)}" class="${f.color ? f.color(v, row) : ''}" inputmode="decimal">`;
    case 'integer': return `<input type="number" ${n} ${req} step="1" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} value="${h(v)}">`;
    case 'date': return `<input type="date" ${n} ${req} value="${h(v ? String(v).slice(0, 10) : '')}">`;
    case 'time': return `<input type="time" ${n} ${req} value="${h(v || '')}">`;
    case 'email': return `<input type="email" ${n} ${req} value="${h(v)}">`;
    case 'file': return `<div class="file">
        ${v ? `<span>${h(String(v).split('/').pop())}</span><button type="button" class="btn ghost small" data-open="${h(v)}">Obre</button>` : '<span class="hint">cap fitxer</span>'}
        <input type="file" ${n} accept="application/pdf"><input type="hidden" name="${f.key}__actual" value="${h(v || '')}">
      </div>`;
    default: return `<input type="text" ${n} ${req} value="${h(v)}">`;
  }
}

function formHTML(td, row) {

function childrenHTML(td, row) {

/* ---------- Llistes ---------- */
function cellText(td, key, row) {
  if (td.computed && td.computed[key]) { const r = td.computed[key].fn(row, C); return td.computed[key].num ? String(r).replace('.', ',') : String(r); }
  const f = fieldDef(td, key); const v = row[key];
  if (f && f.type === 'info' && f.fmt) return f.fmt(row);
  if (v == null || v === '') return '';
  if (!f) return String(v);
  switch (f.type) {
    case 'info': return f.fmt ? f.fmt(row) : String(v);
    case 'ref': return L(f.ref, v);
    case 'boolean': return v ? 'sí' : 'no';
    case 'select': { const o = f.options.find(o => o[0] === String(v)); return o ? o[1] : String(v); }
    case 'date': return dmy(v);
    case 'time': return String(v).slice(0, 5);
    case 'file': return 'PDF';
    case 'number': return String(v).replace('.', ',');
    default: return String(v);
  }
}
function colLabel(td, key) {

  const f = fieldDef(td, key); return f ? (f.curt || f.label) : key;
}
function isNum(td, key) {

}
function sortRows(td, rows) {

    const x = a[k], y = b[k]; let c;
    if (typeof x === 'number' && typeof y === 'number') c = x - y;
    else c = String(x ?? '').localeCompare(String(y ?? ''), 'ca');
    if (c === 0 && a.id != null && b.id != null) c = a.id - b.id;
    return td.desc ? -c : c;

}
function tableHTML(td, rows, clickable) {

  return `<table class="tbl"><thead><tr>${cols.map(k => `<th>${h(colLabel(td, k))}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr class="${clickable ? 'row' : ''} ${r.actiu ? '' : 'off'}" data-id="${td.pk ? r[td.pk] : r.id}">${cols.map(k => { const f = fieldDef(td, k); const cp = td.computed && td.computed[k]; const c = f && f.color ? f.color(r[k], r) : (cp && cp.color ? cp.color(r) : ''); return `<td class="${isNum(td, k) ? 'num' : ''} ${c ? 'cel ' + c : ''}">${h(cellText(td, k, r))}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table>`;
}
function recentHTML(td) {

  const q = $('#q'); if (q) q.addEventListener('input', () => { state.q = q.value; refreshList(td); });

function bindRows(td) {

const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
function checkDups(td, frm) {
  const editingId = frm.dataset.id ? Number(frm.dataset.id) : null;
  const vals = formValues(frm);
  td.fields.filter(f => f.dup).forEach(f => {
    const box = frm.querySelector(`[data-dup="${f.key}"]`); if (!box) return;
    const v = norm(vals[f.key]);
    if (v.length < 3) { box.textContent = ''; return; }
    let rows = C.rows(state.table).filter(r => r.actiu && r.id !== editingId);
    if (f.dupScope) rows = rows.filter(r => String(r[f.dupScope] ?? '') === String(vals[f.dupScope] ?? ''));
    const hits = rows.filter(r => { const x = norm(r[f.key]); return x && (f.dup === 'exact' ? x === v : (x.includes(v) || v.includes(x))); }).slice(0, 3);
    box.textContent = hits.length ? (f.dup === 'exact' ? 'Ja existeix: ' : 'S’assembla a: ') + hits.map(r => td.display(r, L)).join(' · ') : '';
  });
}
function updateCtx(td, frm) {

  const vals = formValues(frm); const parts = [];
  if (state.table === 'clients') { if (vals.nom) parts.push(['Client', vals.nom]); }
  else {

    if (lid) { const l = C.get('llocs', lid); if (l) { parts.push(['Lloc', l.nom]); if (!td.ctxSenseClient) parts.push(['Client', L('clients', l.client_id)]); } }
    else if (fieldDef(td, 'client_id') && vals.client_id) parts.push(['Client', L('clients', vals.client_id)]);
    else if (fieldDef(td, 'administrador_id') && vals.administrador_id) parts.push(['Administrador', L('administradors', vals.administrador_id)]);

function pintaAvisos(td, frm) {

function focs(el, gran) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!el.getBoundingClientRect) return;
  const r = el.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const n = gran ? 56 : 28, dur = gran ? 1800 : 900, dist = gran ? 190 : 95;
  const cont = document.createElement('div'); cont.className = 'focs'; document.body.appendChild(cont);
  const colors = ['#2e7d32', '#66bb6a', '#ffd54f', '#ff7043', '#42a5f5', '#ab47bc'];
  const parts = [];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'); const a = Math.random() * Math.PI * 2, d = dist * (0.45 + Math.random() * 0.55), sz = (gran ? 8 : 4) + Math.random() * (gran ? 8 : 4);
    p.style.background = colors[i % colors.length]; p.style.width = p.style.height = sz + 'px'; cont.appendChild(p); parts.push({ p, a, d });
  }
  const t0 = performance.now();
  const pas = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    parts.forEach(({ p, a, d }) => { p.style.transform = `translate(${cx + Math.cos(a) * d * e}px, ${cy + Math.sin(a) * d * e + 35 * k * k}px)`; p.style.opacity = String(1 - k); });
    if (k < 1) requestAnimationFrame(pas); else cont.remove();
  };
  requestAnimationFrame(pas);
}

function aplicaVisibilitat(td, frm) {

  const vals = formValues(frm);
  const tot = !!(frm.closest('.panel').querySelector('#mostra-tot') || {}).checked;
  td.fields.filter(f => f.visible).forEach(f => {
    const w = frm.querySelector(`[data-fkey="${f.key}"]`); if (!w) return;
    const toca = f.visible(vals, C);

    const teValor = el && el.value !== '';
    w.hidden = !(toca || tot || teValor);
    const t = w.querySelector('[data-toca]'); if (t) t.textContent = toca ? 'toca avui' : (f.quan ? '(' + f.quan + ')' : '');
  });
}

/* ---------- GPS: troba el lloc més proper ---------- */
function gpsExtresHTML(row) {
  return `<button type="button" class="btn" id="gps">Localitza’m</button>
    <label class="chk" style="padding:0"><input type="checkbox" id="mostra-tot"> Mostra tots els paràmetres</label>
    <span class="nota" id="gps-nota"></span>`;
}
function gpsBind(frm, td) {
  const nota = $('#gps-nota'), btn = $('#gps');
  const posa = (llocId, msg) => {
    const sel = frm.querySelector('select[name="_lloc"]'); if (!sel) return;
    sel.value = String(llocId); sel.dispatchEvent(new Event('change', { bubbles: true }));
    const ps = frm.querySelector('select[name="piscina_id"]');
    if (ps) { const opts = [...ps.options].filter(o => o.value); if (opts.length === 1) { ps.value = opts[0].value; ps.dispatchEvent(new Event('change', { bubbles: true })); } }
    nota.textContent = msg;
  };
  $('#mostra-tot').addEventListener('change', () => aplicaVisibilitat(td, frm));
  btn.addEventListener('click', () => {
    if (!navigator.geolocation) { nota.textContent = 'Aquest navegador no té GPS.'; return; }
    btn.disabled = true; nota.textContent = 'Buscant…';
    navigator.geolocation.getCurrentPosition(pos => {
      btn.disabled = false;
      const { latitude: la, longitude: lo } = pos.coords;
      const gl = frm.querySelector('[name="gps_lat"]'), gn = frm.querySelector('[name="gps_lng"]');
      if (gl) gl.value = la.toFixed(6); if (gn) gn.value = lo.toFixed(6);
      const cand = C.rows('llocs').filter(l => l.actiu && l.latitud != null && l.longitud != null).map(l => ({ l, d: distKm(la, lo, Number(l.latitud), Number(l.longitud)) })).sort((a, b) => a.d - b.d);
      if (!cand.length) { nota.textContent = 'Cap lloc té coordenades encara: tria’l a mà.'; return; }
      const m = cand[0];
      if (m.d > 2) { nota.textContent = `El lloc més proper (${m.l.nom}) és a ${m.d.toFixed(1)} km: tria’l a mà.`; return; }
      posa(m.l.id, `${m.l.nom} (${Math.round(m.d * 1000)} m)`);
    }, err => { btn.disabled = false; nota.textContent = 'No s’ha pogut llegir el GPS (' + err.message + '). Tria el lloc a mà.'; }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });
  // en obrir el formulari nou, intenta-ho sol si ja tenim permís
  if (!frm.dataset.id && navigator.geolocation && navigator.permissions) {
    navigator.permissions.query({ name: 'geolocation' }).then(p => { if (p.state === 'granted') btn.click(); }).catch(() => {});
  }
}

function readRaw(fields, box) {

      case 'integer': payload[f.key] = v === '' || v == null ? null : parseInt(v, 10); break;
      case 'ref': payload[f.key] = v === '' || v == null ? null : Number(v); break;
      case 'hidden': payload[f.key] = v === '' || v == null ? null : (isNaN(Number(v)) ? v : Number(v)); break;
      case 'select': payload[f.key] = v === '' || v == null ? null : (f.bool ? v === 'true' : (f.num ? Number(v) : v)); break;
      case 'file': {
        if (v) {
          const path = `${f.folder}/${Date.now()}_${v.name.replace(/[^\w.\-]+/g, '_')}`;
          const { error } = await sb.storage.from(BUCKET).upload(path, v);
          if (error) throw new Error('No s’ha pogut pujar el PDF: ' + friendly(error));
          payload[f.key] = path;
        } else payload[f.key] = raw[f.key + '__actual'] || null;
        break;
      }
      default: payload[f.key] = typeof v === 'string' ? (v.trim() === '' ? null : v.trim()) : (v ?? null);
    }
  }
  return payload;
}

async function save(td, frm) {
  const t = state.table;
  const id = frm.dataset.id ? (td.pk ? frm.dataset.id : Number(frm.dataset.id)) : null;
  $('#ferr').innerHTML = '';
  if (faltaObligatori(td.fields, frm)) return;
  const btn = frm.querySelector('button[type=submit]');
  try {
    const raw = readRaw(td.fields, frm);
    const payload = await buildPayload(td.fields, raw);
    if (td.validate) { const m = td.validate(payload); if (m) { showFormError(m); return; } }
    btn.disabled = true;
    const res = id
      ? await sb.from(t).update(payload).eq(td.pk || 'id', id)
      : await sb.from(t).insert(payload).select(td.pk || 'id').single();
    btn.disabled = false;
    if (res.error) { showFormError(friendly(res.error)); return; }
    await loadTable(t);
    if (id) {
      state.editing = null; toast('Canvis desats');
    } else if (td.children && res.data && res.data.id) {
      // el registre acabat de crear queda obert perquè s'hi puguin afegir els aparells
      state.editing = res.data.id; state.keep = {}; toast('Desat. Ara pots afegir-hi els aparells.');
    } else {
      // en entrada de dades, conserva les referències per encadenar entrades
      state.keep = {};
      td.fields.filter(f => f.type === 'ref' || f.type === 'select').forEach(f => { if (f.virtual) { if (raw[f.key]) state.keep[f.key] = Number(raw[f.key]); } else if (payload[f.key] != null) state.keep[f.key] = payload[f.key]; });
      toast('Desat');
    }
    renderMain();
  } catch (e) {
    if (btn) btn.disabled = false;
    showFormError(friendly(e));
  }
}

// desa els canvis del formulari obert sense tancar-lo (abans d'emetre, previsualitzar…)
async function desaFormulari(td, frm) {
  const id = frm.dataset.id ? (td.pk ? frm.dataset.id : Number(frm.dataset.id)) : null;
  if (!id) return true;
  $('#ferr').innerHTML = '';
  if (faltaObligatori(td.fields, frm)) return false;
  try {
    const payload = await buildPayload(td.fields, readRaw(td.fields, frm));
    if (td.validate) { const m = td.validate(payload); if (m) { showFormError(m); return false; } }
    const res = await sb.from(state.table).update(payload).eq(td.pk || 'id', id);
    if (res.error) { showFormError(friendly(res.error)); return false; }
    await loadTable(state.table);
    return true;
  } catch (e) { showFormError(friendly(e)); return false; }
}

async function addChild(td, childTable, box) {
  const ch = td.children.find(c => c.table === childTable);
  const ct = SCHEMA.tables[childTable];
  $('#ferr').innerHTML = '';
  if (faltaObligatori(ct.fields, box)) return;
  try {
    const payload = await buildPayload(ct.fields, readRaw(ct.fields, box));
    payload[ch.fk] = state.editing;
    const res = await sb.from(childTable).insert(payload);
    if (res.error) { showFormError(friendly(res.error)); return; }
    await loadTable(childTable);
    toast('Afegit');
    renderMain();
  } catch (e) { showFormError(friendly(e)); }
}

async function removeChild(childTable, id) {
  if (!confirm('Treure aquesta línia de la llista?')) return;
  const res = await sb.from(childTable).update({ actiu: false }).eq('id', id);
  if (res.error) { showFormError(friendly(res.error)); return; }

  toast('Tret');
  renderMain();
}

/* ---------- PDF de la factura ---------- */
const fmtEur = n => { const neg = Number(n) < 0; const [i, d] = Math.abs(Number(n || 0)).toFixed(2).split('.'); return (neg ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d + ' €'; };

function pdfFactura(f) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const emp = C.rows('empresa').find(e => e.actiu) || {};
  const client = C.get('clients', f.client_id) || {};
  const tema = teJardi(f) ? 'verd' : 'blau';
  const acc = ACCENT[tema], ink = [40, 40, 40], grey = [125, 125, 125];
  const linies = C.rows('factura_linies').filter(l => l.actiu && Number(l.factura_id) === f.id).sort((a, b) => (a.ordre - b.ordre) || (a.id - b.id));
  const M = 20, R = 210 - M, W = R - M;
  const label = (t, x, y, opt) => { doc.setTextColor(...grey); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.text(t, x, y, opt); };
  const text = (t, x, y, size, style, color, opt) => { doc.setTextColor(...(color || ink)); doc.setFont('helvetica', style || 'normal'); doc.setFontSize(size || 10); doc.text(t, x, y, opt); };

  if (f.estat === 'esborrany') { doc.setTextColor(232, 232, 232); doc.setFont('helvetica', 'bold'); doc.setFontSize(64); doc.text('ESBORRANY', 105, 170, { align: 'center', angle: 30 }); }

  // logotip
  const lw = 62, lh = lw * LOGO_RATIO;
  doc.addImage(LOGOS[tema], 'JPEG', (210 - lw) / 2, 14, lw, lh);

  // capçalera esquerra: número, data, venciment
  let y = 52;
  label('FACTURA', M, y);
  text(f.numero_complet || 'ESBORRANY', M, y + 8.5, 20, 'bold', acc);
  label('DATA', M, y + 18);
  text(dmy(f.data_factura), M, y + 23, 11);
  if (f.data_venciment) { label('VENCIMENT', M, y + 31); text(dmy(f.data_venciment), M, y + 36, 11); }

  // capçalera dreta: client
  const rx = 112, rw = R - rx;
  const nom = f.client_nom || client.nom || '';
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5);
  const nomL = doc.splitTextToSize(nom, rw);
  text(nomL, rx, y, 11.5, 'bold');
  let ry = y + nomL.length * 5.2 + 1.5;
  const adreca = f.client_adreca || [client.adreca, [client.cp, client.poblacio].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  // el carrer en una línia i el codi postal amb la població en una altra
  const parts = adreca.split(', '); const ultim = parts.length > 1 ? parts.pop() : null;
  const adrL = [...doc.splitTextToSize(parts.join(', '), rw), ...(ultim ? doc.splitTextToSize(ultim, rw) : [])];
  if (adreca) { text(adrL, rx, ry, 10); ry += adrL.length * 5; }
  const nif = f.client_nif || client.nif; if (nif) text('NIF ' + nif, rx, ry + 0.5, 10);

  // línia de separació
  y = 94; doc.setDrawColor(...acc); doc.setLineWidth(0.5); doc.line(M, y, R, y);

  // concepte
  y = 104; label('CONCEPTE', M, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
  const cL = doc.splitTextToSize(f.concepte || '', W);
  text(cL, M, y + 6, 10.5); y = y + 6 + cL.length * 5.3;
  if (f.periode_inici && f.periode_fi) { text('Període del ' + dmy(f.periode_inici) + ' al ' + dmy(f.periode_fi), M, y + 1, 8.5, 'normal', grey); y += 6; }

  // línies (només a les factures manuals)
  if (linies.length) {
    y += 8;
    const ambDte = linies.some(l => l.dte != null && l.dte !== '');
    const cx = ambDte ? { qty: 128, preu: 150, dte: 166, imp: R } : { qty: 138, preu: 163, imp: R };
    const descW = (cx.qty - 12) - (M + 2);
    doc.setFillColor(242, 242, 242); doc.rect(M, y, W, 7, 'F');
    label('DESCRIPCIÓ', M + 2, y + 4.6); label('Nº', cx.qty, y + 4.6, { align: 'right' }); label('IMPORT', cx.preu, y + 4.6, { align: 'right' });
    if (ambDte) label('DTE', cx.dte, y + 4.6, { align: 'right' });
    label('TOTAL', cx.imp - 2, y + 4.6, { align: 'right' });
    y += 7;
    doc.setDrawColor(225); doc.setLineWidth(0.2);
    for (const l of linies) {
      const dL = doc.splitTextToSize(l.descripcio, descW);
      const rh = Math.max(6.5, dL.length * 4.8 + 2);
      text(dL, M + 2, y + 4.6, 9.5);
      text(String(l.quantitat).replace('.', ','), cx.qty, y + 4.6, 9.5, 'normal', ink, { align: 'right' });
      text(fmtEur(l.preu_unitari), cx.preu, y + 4.6, 9.5, 'normal', ink, { align: 'right' });
      if (ambDte) text(l.dte != null && l.dte !== '' ? String(Number(l.dte)).replace('.', ',') + ' %' : '', cx.dte, y + 4.6, 9.5, 'normal', ink, { align: 'right' });
      text(fmtEur(l.base), cx.imp - 2, y + 4.6, 9.5, 'normal', ink, { align: 'right' });
      y += rh; doc.line(M, y, R, y);
    }
    const suma = linies.reduce((t, l) => t + Number(l.base || 0), 0);
    text('Base imposable', cx.preu, y + 5.2, 9.5, 'bold', ink, { align: 'right' });
    text(fmtEur(suma), cx.imp - 2, y + 5.2, 9.5, 'bold', ink, { align: 'right' });
    y += 8;
  }

  // pagament
  const py = Math.max(y + 14, 196);
  label('PAGAMENT', M, py);
  const forma = f.forma_pagament || client.forma_pagament;
  const venc = f.data_venciment ? dmy(f.data_venciment) : null;
  const ptxt = forma === 'domiciliacio'
    ? 'Rebut domiciliat al compte del client' + (venc ? ', amb càrrec el ' + venc : '') + '.'
    : 'Transferència al compte ' + (f.compte_cobrament_text || '') + (venc ? ', abans del ' + venc : '') + '.';
  text(doc.splitTextToSize(ptxt, 95), M, py + 5.5, 9.5);

  // totals
  const tx = 118, ty = 232, tv = R - 3;
  const fila = (t, v, yy, big) => { text(t, tx + 3, yy, big ? 11 : 9.5, big ? 'bold' : 'normal'); text(v, tv, yy, big ? 12 : 10, big ? 'bold' : 'normal', big ? acc : ink, { align: 'right' }); };
  fila('Base imposable', fmtEur(f.base_imponible), ty);
  fila('IVA ' + String(Number(f.iva_percent)).replace('.', ',') + ' %', fmtEur(f.quota_iva), ty + 7.5);
  doc.setFillColor(243, 243, 243); doc.rect(tx, ty + 12, R - tx, 10, 'F');
  fila('TOTAL FACTURA', fmtEur(f.total), ty + 18.8, true);

  // codi de client, a baix a l'esquerra
  const codi = f.codi_client || client.codi_client;
  if (codi) { label('CODI CLIENT', M, 262); text(String(codi), M, 267.5, 10); }

  // peu: dades de l'empresa
  doc.setDrawColor(205); doc.setLineWidth(0.2); doc.line(M, 279, R, 279);
  const peu1 = [emp.nom, emp.nif].filter(Boolean).join('   ·   ');
  const peu2 = [[emp.adreca, [emp.cp, emp.poblacio].filter(Boolean).join(' ')].filter(Boolean).join(', '), emp.telefon ? 'T ' + emp.telefon : '', emp.email].filter(Boolean).join('   ·   ');
  text(peu1, 105, 284, 8, 'normal', grey, { align: 'center' });
  text(peu2, 105, 288.5, 8, 'normal', grey, { align: 'center' });
  return doc;
}

async function generaPdfFactura(id, { obrir = true } = {}) {
  const f = C.get('factures', id);
  const doc = pdfFactura(f);
  const blob = doc.output('blob');
  if (obrir) window.open(URL.createObjectURL(blob), '_blank');
  if (f.estat === 'esborrany') return null;
  const path = 'factures/' + (f.numero_complet || 'id' + f.id).replace(/\//g, '-') + '.pdf';
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { upsert: true, contentType: 'application/pdf' });
  if (error) throw new Error('No s’ha pogut desar el PDF: ' + friendly(error));
  const res = await sb.from('factures').update({ pdf: path }).eq('id', id);
  if (res.error) throw new Error(friendly(res.error));
  await loadTable('factures');
  return path;
}

async function generaPdfsPendents() {
  const pend = C.rows('factures').filter(r => r.actiu && r.estat !== 'esborrany' && !r.pdf);
  let n = 0;
  for (const f of pend) {
    try { await generaPdfFactura(f.id, { obrir: false }); n++; }
    catch (e) { toastErr(friendly(e)); break; }
  }
  return n;
}

/* ---------- Albarans ---------- */
async function facturaAlbarans(ids) {
  if (!ids.length) { toastErr('Marca almenys un albarà'); return; }
  if (!confirm(`Fer una factura esborrany amb ${ids.length} albar${ids.length === 1 ? 'à' : 'ans'}?`)) return;

function renderConsumAigua(main) {

    <h1>Consum d’aigua</h1>
    <div class="bar">
      <select id="ca-lloc"><option value="">Tria el lloc…</option>${llocs.map(l => `<option value="${l.id}" ${String(l.id) === a.lloc ? 'selected' : ''}>${h(l.nom)} — ${h(L('clients', l.client_id))}</option>`).join('')}</select>
      <select id="ca-comptador" ${comptadors.length ? '' : 'disabled'}><option value="">Tria el comptador…</option>${comptadors.map(c => `<option value="${c.id}" ${String(c.id) === a.comptador ? 'selected' : ''}>${h((c.numero_serie || 'Comptador ' + c.id) + ' — ' + cobreixText(c) + (c.data_baixa ? ' (baixa ' + dmy(c.data_baixa) + ')' : ''))}</option>`).join('')}</select>
      <select id="ca-any">${anys.map(y => `<option value="${y}" ${y === a.any ? 'selected' : ''}>${y}</option>`).join('')}</select>
      <button class="btn ghost" id="ca-print-graf" ${a.comptador ? '' : 'disabled'}>Imprimeix només les gràfiques</button>
      <button class="btn ghost" id="ca-print" ${a.comptador ? '' : 'disabled'}>Imprimeix tot</button>
    </div>
    <div id="ca-cos">${a.comptador ? '<p class="sub">Carregant…</p>' : '<div class="empty">Tria un lloc i un comptador.</div>'}</div>`;
  $('#ca-lloc').addEventListener('change', e => { a.lloc = e.target.value; a.comptador = ''; renderMain(); });
  $('#ca-comptador').addEventListener('change', e => { a.comptador = e.target.value; renderMain(); });
  $('#ca-any').addEventListener('change', e => { a.any = e.target.value; renderMain(); });
  $('#ca-print').addEventListener('click', () => window.print());
  $('#ca-print-graf').addEventListener('click', () => {
    document.body.classList.add('print-grafiques');
    const treu = () => document.body.classList.remove('print-grafiques');
    window.addEventListener('afterprint', treu, { once: true });
    setTimeout(() => { window.print(); setTimeout(treu, 2000); }, 50);
  });
  if (a.comptador) carregaConsumAigua(Number(a.comptador), Number(a.any));
}

async function carregaConsumAigua(comptadorId, any) {
  const cos = $('#ca-cos'); if (!cos) return;
  const [rc, re] = await Promise.all([
    sb.rpc('consum_mensual', { p_comptador: comptadorId, p_any: any }),
    sb.rpc('escenaris_comptador', { p_comptador: comptadorId }),
  ]);
  if (rc.error || re.error) { cos.innerHTML = `<div class="msg err">${h(friendly(rc.error || re.error))}</div>`; return; }
  const consum = Array.from({ length: 12 }, (_, i) => { const r = (rc.data || []).find(x => x.mes === i + 1); return r ? Number(r.m3) : 0; });
  const esc = Array.from({ length: 12 }, (_, i) => (re.data || []).find(x => x.mes === i + 1) || { baix: 0, alt: 0, torrid: 0 });
  // només hi ha consum fins al mes de l'última lectura
  const c = C.get('comptadors', comptadorId);
  const lect = C.rows('lectures').filter(l => l.actiu && l.comptador_id === comptadorId).map(l => l.data).sort();
  const ultima = lect.length ? lect[lect.length - 1] : (c ? c.data_alta : null);
  // un mes només es mostra quan hi ha una lectura de l'últim dia del mes o posterior
  const ultimDia = i => { const d = new Date(Date.UTC(any, i + 1, 0)); return d.toISOString().slice(0, 10); };
  const ambDades = i => !!ultima && ultima >= ultimDia(i);
  const consumMostrat = consum.map((v, i) => ambDades(i) ? v : null);
  const acum = (arr) => { let t = 0; return arr.map(v => (v == null ? null : (t += v))); };
  const cAcum = acum(consumMostrat.map(v => v == null ? null : v));
  const lloc = c ? C.get('llocs', c.lloc_id) : null;
  const client = lloc ? L('clients', lloc.client_id) : '';
  const titol = ` · ${client} · ${(c && c.numero_serie) || 'comptador'} · ${any}`;
  const tot = arr => arr.reduce((t, v) => t + (v || 0), 0);
  cos.innerHTML = `
    <h2 class="grup">Consum mensual</h2><div class="graf"><canvas id="g-mes"></canvas></div>
    <h2 class="grup">Consum acumulat</h2><div class="graf"><canvas id="g-acum"></canvas></div>
    <table class="tbl informe ca-taula"><thead><tr><th>Mes</th><th class="num">Consum (m³)</th><th class="num">Acumulat</th><th class="num">Escenari baix</th><th class="num">Escenari alt</th><th class="num">Escenari tòrrid</th></tr></thead><tbody>
      ${MESOS.map((m, i) => `<tr><td>${m}</td><td class="num">${f1(consumMostrat[i])}</td><td class="num">${f1(cAcum[i])}</td><td class="num">${f1(esc[i].baix)}</td><td class="num">${f1(esc[i].alt)}</td><td class="num">${f1(esc[i].torrid)}</td></tr>`).join('')}
      <tr class="total"><td>Any</td><td class="num">${f1(tot(consumMostrat))}</td><td></td><td class="num">${f1(tot(esc.map(e => Number(e.baix))))}</td><td class="num">${f1(tot(esc.map(e => Number(e.alt))))}</td><td class="num">${f1(tot(esc.map(e => Number(e.torrid))))}</td></tr>
    </tbody></table>`;
  if (typeof Chart === 'undefined') return;
  graficsAigua.forEach(g => g.destroy()); graficsAigua = [];
  const labels = MESOS.map(m => m.slice(0, 3));
  const linia = (label, data, color) => ({ type: 'line', label, data, borderColor: color, backgroundColor: color, borderWidth: 2.5, tension: 0.35, pointRadius: 0, fill: false });
  const fes = (id, titolG, barres, b, al, to) => graficsAigua.push(new Chart($(id), {
    data: { labels, datasets: [
      { type: 'bar', label: 'Consum total', data: barres, backgroundColor: 'rgba(79, 129, 189, 0.85)', borderColor: '#2f5597', borderWidth: 1, barPercentage: 0.45 },
      linia('Escenari baix', b, '#9dc3e6'), linia('Escenari alt', al, '#1f4e79'), linia('Escenari tòrrid', to, '#843c0c') ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        title: { display: true, text: titolG, color: '#1f4e79', font: { size: 19, weight: '600' }, padding: { top: 4, bottom: 2 } },
        subtitle: { display: true, text: c ? cobreixMajuscules(c) : '', color: '#1f4e79', font: { size: 14, weight: 'bold' }, padding: { bottom: 14 } },
        legend: { position: 'right', labels: { font: { weight: '600' } } } },
      scales: { y: { beginAtZero: true, title: { display: true, text: 'm³', font: { weight: '600' } }, ticks: { font: { weight: '600' } } }, x: { ticks: { font: { weight: '600' } } } } }
  }));
  fes('#g-mes', 'Consum mensual' + titol, consumMostrat, esc.map(e => Number(e.baix)), esc.map(e => Number(e.alt)), esc.map(e => Number(e.torrid)));
  fes('#g-acum', 'Consum acumulat' + titol, cAcum, acum(esc.map(e => Number(e.baix))), acum(esc.map(e => Number(e.alt))), acum(esc.map(e => Number(e.torrid))));
}

/* ---------- Informes de tasques de piscina ---------- */
const TASCA_MESURES = ['clor_lliure_1', 'clor_lliure_2', 'clor_combinat_1', 'clor_combinat_2', 'ph_1', 'ph_2', 'isocianuric', 'alcalinitat', 'duresa', 'temperatura', 'salinitat', 'comptador_aigua_nova', 'transparencia'];
const TASCA_CHECKS = [['nivell_aigua_ok', 'Nivell aigua'], ['flux_retorns_ok', 'Flux retorns'], ['fons_parets_ok', 'Fons i parets'], ['motor_ok', 'Motor'], ['cloracio_electrode_ok', 'Cloració salina'], ['pressio_filtre_ok', 'Pressió filtre']];
const TASCA_FEINES = [['netejafons', 'Netejafons'], ['passat_xarxa', 'Xarxa'], ['raspallat', 'Raspall'], ['neteja_skimmers', 'Skimmers'], ['neteja_linia_flotacio', 'Línia flotació'], ['neteja_aspes_prefiltre', 'Aspes i prefiltre'], ['neteja_filtre', 'Backwash']];
const primerDiaMes = () => avui().slice(0, 8) + '01';

function taulaTasquesHTML(rows, opts) {
  const td = SCHEMA.tables.tasques_piscina;
  const head = ['<th>Data</th>'];
  if (opts.hora) head.push('<th>Hora</th>');
  if (opts.piscina) head.push('<th>Piscina</th>');
  head.push('<th>Fet per</th>');
  TASCA_MESURES.forEach(k => { const f = fieldDef(td, k); head.push(`<th class="num">${h(f.curt || f.label)}</th>`); });
  TASCA_CHECKS.forEach(([k, l]) => head.push(`<th class="vert"><span>${h(l)}</span></th>`));
  TASCA_FEINES.forEach(([k, l]) => head.push(`<th class="vert"><span>${h(l)}</span></th>`));
  head.push('<th>Observacions</th>');
  const body = rows.map(r => {
    const c = [`<td>${dmy(r.data).slice(0, 5)}</td>`];
    if (opts.hora) c.push(`<td>${h(String(r.hora || '').slice(0, 5))}</td>`);
    if (opts.piscina) c.push(`<td>${h(L('piscines', r.piscina_id))}</td>`);
    c.push(`<td>${h(nomCurtTreballador(C.get('treballadors', r.treballador_id)))}</td>`);
    TASCA_MESURES.forEach(k => { const f = fieldDef(td, k); const col = f.color ? f.color(r[k], r) : ''; c.push(`<td class="num ${col ? 'cel ' + col : ''}">${h(cellText(td, k, r))}</td>`); });
    TASCA_CHECKS.forEach(([k]) => c.push(r[k] === true ? '<td class="ok">✓</td>' : '<td></td>'));
    TASCA_FEINES.forEach(([k]) => c.push(r[k] ? '<td class="fet">✓</td>' : '<td></td>'));
    c.push(`<td class="obs">${h(r.observacions || '')}</td>`);
    return `<tr>${c.join('')}</tr>`;
  }).join('');
  return rows.length ? `<table class="tbl informe tasques"><thead><tr>${head.join('')}</tr></thead><tbody>${body}</tbody></table>` : '<div class="empty">Cap tasca en aquest període.</div>';
}

function imprimeixApaisat() {
  const st = document.createElement('style'); st.id = 'print-apaisat'; st.textContent = '@page { size: A4 landscape; margin: 10mm; }';
  document.head.appendChild(st);
  const treu = () => { const e = document.getElementById('print-apaisat'); if (e) e.remove(); };
  window.addEventListener('afterprint', treu, { once: true });
  setTimeout(() => { window.print(); setTimeout(treu, 2000); }, 50);
}

function renderInformeTasquesPiscina(main) {
  const st = state.tp; if (!st.desde) st.desde = primerDiaMes(); if (!st.fins) st.fins = avui();
  const llocs = C.rows('llocs').filter(l => l.actiu && C.rows('piscines').some(p => p.actiu && Number(p.lloc_id) === l.id)).sort((a, b) => a.nom.localeCompare(b.nom, 'ca'));
  const piscines = C.rows('piscines').filter(p => p.actiu && (!st.lloc || Number(p.lloc_id) === Number(st.lloc)));
  if (st.piscina && !piscines.some(p => String(p.id) === st.piscina)) st.piscina = '';
  if (!st.piscina && piscines.length === 1 && st.lloc) st.piscina = String(piscines[0].id);
  const pisc = st.piscina ? C.get('piscines', st.piscina) : null;
  const lloc = pisc ? C.get('llocs', pisc.lloc_id) : null;
  const rows = pisc ? C.rows('tasques_piscina').filter(t => t.actiu && Number(t.piscina_id) === pisc.id && t.data >= st.desde && t.data <= st.fins).sort((a, b) => (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || ''))) : [];
  main.innerHTML = `
    <h1>Tasca per piscina</h1>
    <div class="bar">
      <select id="tp-lloc"><option value="">Tria el lloc…</option>${llocs.map(l => `<option value="${l.id}" ${String(l.id) === st.lloc ? 'selected' : ''}>${h(l.nom)}${l.poblacio ? ' — ' + h(l.poblacio) : ''}</option>`).join('')}</select>
      <select id="tp-piscina" ${piscines.length ? '' : 'disabled'}><option value="">Tria la piscina…</option>${piscines.map(p => `<option value="${p.id}" ${String(p.id) === st.piscina ? 'selected' : ''}>${h(p.nom)}</option>`).join('')}</select>
      <input type="date" id="tp-desde" value="${st.desde}" style="width:auto"> <input type="date" id="tp-fins" value="${st.fins}" style="width:auto">
      <button class="btn ghost" id="tp-print" ${pisc ? '' : 'disabled'}>Imprimeix (A4 apaïsat)</button>
    </div>
    ${pisc ? `<div class="capsal"><span>Client <b>${h(L('clients', lloc ? lloc.client_id : null))}</b></span><span>Lloc <b>${h(lloc ? lloc.nom : '')}</b></span><span>Piscina <b>${h(pisc.nom)}</b></span><span>Període <b>${dmy(st.desde)} – ${dmy(st.fins)}</b></span><span>Tasques <b>${rows.length}</b></span></div>` : ''}
    ${pisc ? taulaTasquesHTML(rows, { hora: false, piscina: false }) : '<div class="empty">Tria un lloc i una piscina.</div>'}`;
  $('#tp-lloc').addEventListener('change', e => { st.lloc = e.target.value; st.piscina = ''; renderMain(); });
  $('#tp-piscina').addEventListener('change', e => { st.piscina = e.target.value; renderMain(); });
  $('#tp-desde').addEventListener('change', e => { st.desde = e.target.value; renderMain(); });
  $('#tp-fins').addEventListener('change', e => { st.fins = e.target.value; renderMain(); });
  $('#tp-print').addEventListener('click', imprimeixApaisat);
}

function renderInformeTasquesDates(main) {
  const st = state.tdt; if (!st.desde) st.desde = primerDiaMes(); if (!st.fins) st.fins = avui();
  const nomLloc = t => { const p = C.get('piscines', t.piscina_id); const l = p ? C.get('llocs', p.lloc_id) : null; return l ? l.nom : ''; };
  const rows = C.rows('tasques_piscina').filter(t => t.actiu && t.data >= st.desde && t.data <= st.fins)
    .sort((a, b) => a.data.localeCompare(b.data) || nomLloc(a).localeCompare(nomLloc(b), 'ca') || String(a.hora || '').localeCompare(String(b.hora || '')));
  main.innerHTML = `
    <h1>Tasca per dates</h1>
    <div class="bar">
      <input type="date" id="td-desde" value="${st.desde}" style="width:auto"> <input type="date" id="td-fins" value="${st.fins}" style="width:auto">
      <button class="btn ghost" id="td-print">Imprimeix (A4 apaïsat)</button>
    </div>
    <div class="capsal"><span>Període <b>${dmy(st.desde)} – ${dmy(st.fins)}</b></span><span>Tasques <b>${rows.length}</b></span><span>Piscines <b>${new Set(rows.map(r => r.piscina_id)).size}</b></span></div>
    ${taulaTasquesHTML(rows, { hora: false, piscina: true })}`;
  $('#td-desde').addEventListener('change', e => { st.desde = e.target.value; renderMain(); });
  $('#td-fins').addEventListener('change', e => { st.fins = e.target.value; renderMain(); });
  $('#td-print').addEventListener('click', imprimeixApaisat);
}

/* ---------- Informe: adob per equips ---------- */
const kgAdob = j => Math.round((Number(j.m2_gespa) || 0) / 10000 * 420 / 6 / 0.19);
const fmtNum = v => Number.isInteger(Number(v)) ? String(v) : Number(v).toFixed(2).replace('.', ',');

function renderInformeAdob(main) {
  const avuiS = avui();
  const contracteViu = j => { if (!j.agrupacio_id) return false; const a = C.get('agrupacions', j.agrupacio_id); return !!a && a.actiu && (!a.data_fi || a.data_fi >= avuiS); };
  const jardins = C.rows('jardins').filter(j => j.actiu && contracteViu(j));
  const equips = C.rows('equips').filter(e => e.actiu).sort((a, b) => a.nom.localeCompare(b.nom, 'ca'));
  const grups = [...equips.map(e => ({ id: e.id, nom: e.nom })), { id: null, nom: 'Sense equip' }].filter(g => !state.filtreEquip || String(g.id) === state.filtreEquip);
  let total = 0, blocs = '', mostrats = 0;
  for (const g of grups) {
    const rows = jardins.filter(j => (g.id == null ? !j.equip_id : Number(j.equip_id) === g.id))
      .map(j => ({ lloc: (C.get('llocs', j.lloc_id) || {}).nom || '', m2: Number(j.m2_gespa) || 0, kg: kgAdob(j) }))
      .sort((a, b) => a.lloc.localeCompare(b.lloc, 'ca'));
    if (!rows.length) continue;
    const sub = rows.reduce((t, r) => t + r.kg, 0); total += sub; mostrats++;
    blocs += `<h2 class="grup">${h(g.nom)}</h2>
      <table class="tbl informe"><thead><tr><th>Lloc</th><th class="num">m² de gespa</th><th class="num">Kg d’adob</th><th class="num">Sacs de 25 kg</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${h(r.lloc)}</td><td class="num">${fmtNum(r.m2)}</td><td class="num">${r.kg}</td><td></td></tr>`).join('')}
        <tr class="total"><td>Total ${h(g.nom)}</td><td></td><td class="num">${sub}</td><td class="num">${Math.ceil(sub / 25)}</td></tr>
      </tbody></table>`;
  }
  const totalGeneral = mostrats > 1 ? `<h2 class="grup">Total general</h2>
      <table class="tbl informe"><tbody><tr class="total"><td>Tots els equips</td><td></td><td class="num">${total} kg</td><td class="num">${Math.ceil(total / 25)} sacs</td></tr></tbody></table>` : '';
  main.innerHTML = `
    <h1>Adob per equips</h1>
    <p class="sub">Jardins amb contracte vigent a ${dmy(avuiS)}. Kg d’adob = arrodonir(m² de gespa / 10.000 × 420 / 6 / 0,19). Sacs = Kg / 25, arrodonit a l’alça.</p>
    <div class="bar">
      <select id="equip"><option value="">Tots els equips</option>${equips.map(e => `<option value="${e.id}" ${String(e.id) === state.filtreEquip ? 'selected' : ''}>${h(e.nom)}</option>`).join('')}<option value="null" ${state.filtreEquip === 'null' ? 'selected' : ''}>Sense equip</option></select>
      <button class="btn ghost" id="imprimeix">Imprimeix</button>
    </div>
    ${blocs || '<div class="empty">Cap jardí amb contracte vigent.</div>'}
    ${totalGeneral}`;
  $('#equip').addEventListener('change', e => { state.filtreEquip = e.target.value; renderMain(); });
  $('#imprimeix').addEventListener('click', () => window.print());
}

async function toggleActiu(td) {
  const t = state.table, row = C.get(t, state.editing);
  const label = td.display(row, L);
  if (row.actiu && !confirm(`Donar de baixa "${label}"? No s’esborra res: deixa de sortir a les llistes i als desplegables.`)) return;
  const { error } = await sb.from(t).update({ actiu: !row.actiu }).eq('id', row.id);
  if (error) { showFormError(friendly(error)); return; }
  await loadTable(t);
  state.editing = null; toast(row.actiu ? 'Donat de baixa' : 'Reactivat');
  renderMain();
}

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
