<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestió de manteniment</title>
<meta name="theme-color" content="#2f7d4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona-192.png">
<link rel="apple-touch-icon" href="icona-192.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d2a1b; --ink-2:#5b6858; --ink-3:#8a9486;
    --line:#e2e7df; --line-2:#c6d0c1;
    --bg:#ffffff; --bg-2:#f5f8f3;
    --green:#2f7d4a; --green-2:#e4f1e8;
    --blue:#2b5f8a; --blue-2:#e5eef6;
    --red:#b8432b; --red-2:#fbebe7;
    --mode:var(--green); --mode-2:var(--green-2);
  }
  body[data-mode="consulta"]{ --mode:var(--blue); --mode-2:var(--blue-2); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
  body{ font-feature-settings:"tnum" 1; }
  a{ color:var(--mode); }
  h1{ font-size:26px; font-weight:500; margin:0 0 20px; letter-spacing:-.01em; }
  h2{ font-size:19px; font-weight:500; margin:0 0 14px; }
  h3{ font-size:15px; font-weight:500; margin:24px 0 10px; color:var(--ink-2); }
  p{ margin:0 0 12px; }
  .modebar{ height:4px; background:var(--mode); }
  .top{ display:flex; align-items:center; gap:20px; padding:12px 24px; border-bottom:1px solid var(--line); }
  .top .brand{ font-weight:500; cursor:pointer; }
  .top .who{ margin-left:auto; color:var(--ink-2); font-size:14px; display:flex; gap:14px; align-items:center; }
  .seg{ display:inline-flex; border:1px solid var(--line-2); border-radius:6px; overflow:hidden; }
  .seg button{ border:0; background:transparent; padding:6px 14px; font:inherit; cursor:pointer; color:var(--ink-2); }
  .seg button.on{ background:var(--mode); color:#fff; }
  .shell{ display:grid; grid-template-columns:230px minmax(0,1fr); min-height:calc(100vh - 53px); }
  .side{ border-right:1px solid var(--line); padding:20px 0; }
  .side .grp{ display:flex; align-items:stretch; margin:4px 0 14px; }
  .side .glw{ position:relative; width:38px; flex:0 0 38px; }
  .side .glw::after{ content:''; position:absolute; right:3px; top:6px; bottom:6px; width:3px; border-radius:2px; background:var(--gc); }
  .side .gl{ position:absolute; left:50%; top:50%; transform:translate(-50%, -50%) rotate(-90deg); transform-origin:center; font:600 13.5px/1 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; letter-spacing:.06em; color:var(--ink); white-space:nowrap; margin-left:-3px; }
  .side .gi{ flex:1; padding:4px 0 0 6px; min-width:0; }
  .side .buit{ padding:8px 14px; font-size:12.5px; color:var(--ink-3); font-style:italic; }
  .side button{ display:block; width:100%; text-align:left; border:0; background:transparent; padding:7px 14px; font:inherit; cursor:pointer; color:var(--ink); border-left:3px solid transparent; }
  .side button:hover{ background:var(--bg-2); }
  .side button.on{ border-left-color:var(--mode); background:var(--mode-2); }
  .main{ padding:32px 40px 60px; max-width:1160px; }
  .home{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; max-width:760px; margin-top:12px; }
  .home button{ text-align:left; border:1px solid var(--line-2); border-radius:8px; background:#fff; padding:28px 26px; font:inherit; cursor:pointer; color:var(--ink); }
  .home button:hover{ border-color:var(--ink-2); }
  .home button strong{ display:block; font-size:22px; font-weight:500; margin-bottom:6px; }
  .home button span{ color:var(--ink-2); font-size:14px; }
  .home button.entrada strong{ color:var(--green); }
  .home button.consulta strong{ color:var(--blue); }
  .operari .home{ grid-template-columns:1fr; max-width:520px; }
  .operari .home button strong{ font-size:24px; }
  /* menú d'entrada de l'app (croquis): Fitxar, Tasques piscina i Reports a tota amplada; la resta de dues en dues.
     Cada casella té el seu color (--p clar → --pf fosc) i una escena dibuixada i difuminada al darrere del text. */
  .operari .home.menu-app{ grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; max-width:560px; margin-top:6px; }
  .menu-app button{ position:relative; overflow:hidden; text-align:left; padding:16px 16px; border:0; border-radius:14px; min-height:104px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:4px; color:#fff; background:linear-gradient(180deg, var(--p) 0%, var(--pf) 100%) center/cover no-repeat; box-shadow:0 4px 12px rgba(0,0,0,.16); }
  .menu-app button:hover{ filter:brightness(1.06); }
  .menu-app button:active{ transform:translateY(1px); box-shadow:0 2px 6px rgba(0,0,0,.16); }
  .menu-app button.ample{ grid-column:1 / -1; min-height:120px; }
  .menu-app button svg.esc{ position:absolute; top:0; bottom:0; right:0; left:0; width:100%; height:100%; z-index:0; filter:blur(1.2px); pointer-events:none; }
  .menu-app button.ample svg.esc{ left:auto; width:52%; }
  .menu-app button::before{ content:""; position:absolute; inset:0; z-index:1; pointer-events:none; background:linear-gradient(90deg, rgba(0,0,0,.26) 0%, rgba(0,0,0,.08) 55%, rgba(0,0,0,0) 82%); }
  .menu-app button.ample::before{ background:linear-gradient(90deg, rgba(0,0,0,.16) 0%, rgba(0,0,0,.04) 40%, rgba(0,0,0,0) 55%); }
  .menu-app button > :not(svg){ position:relative; z-index:2; }
  .operari .menu-app button strong{ font-size:16px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; line-height:1.15; margin:0; text-shadow:0 1px 3px rgba(0,0,0,.4); }
  .operari .menu-app button.ample strong{ font-size:23px; }
  .operari .menu-app button.ample.llarg strong{ font-size:20px; letter-spacing:.06em; }
  .menu-app button em.sub{ font-style:normal; font-size:16px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4); }
  .menu-app button span{ font-size:13px; color:#fff; opacity:.94; line-height:1.3; text-shadow:0 1px 2px rgba(0,0,0,.4); }
  .menu-app button span.pend{ display:inline-block; background:#fff; color:var(--pf); border-radius:999px; padding:2px 11px; font-size:12px; font-weight:700; margin-top:3px; opacity:1; text-shadow:none; }
  .operari .main{ padding:14px 12px 90px; max-width:100%; }
  body.operari{ overflow-x:hidden; }
  .operari .grid{ grid-template-columns:1fr; }
  .operari form .actions{ position:sticky; bottom:0; background:#fff; padding:12px 0; border-top:1px solid var(--line); z-index:5; }
  .operari .btn{ padding:12px 20px; font-size:16px; }
  .operari h1{ font-size:24px; }
  body.operari{ font-size:17px; }
  .operari .f .l{ font-size:16px; color:var(--ink); }
  .operari .f .hint{ font-size:14px; }
  .operari input[type=text],.operari input[type=email],.operari input[type=number],.operari input[type=date],.operari input[type=time],.operari input[type=datetime-local],.operari select,.operari textarea{ font-size:18px; padding:11px 12px; }
  .operari .ctx .v{ font-size:20px; }
  .operari h3{ font-size:17px; }
  .operari .targeta, .operari .xip{ font-size:15px; }
  /* caselles de comprovacions i feines: botons que es posen en verd en prémer-los */
  .chks .f.chk{ padding:0; display:block; }
  .chks .f.chk > span:first-child{ display:none; }
  .chks .f.chk .l{ display:block; border:2px solid var(--line-2); border-radius:8px; padding:10px 12px; text-align:center; cursor:pointer; user-select:none; color:var(--ink); background:#fff; font-size:15px; line-height:1.3; }
  .chks .f.chk.on .l{ background:#2e7d32; border-color:#2e7d32; color:#fff; font-weight:600; }
  .chks .f.chk.on .l::before{ content:'✓ '; }
  .chks .f.chk.tri .l{ width:100%; font:inherit; font-size:15px; }
  .chks .f.chk.tri.on .l::before, .chks .f.chk.tri.no .l::before{ content:''; }
  .chks .f.chk.no .l{ background:#c62828; border-color:#c62828; color:#fff; font-weight:600; }
  .operari .chks{ grid-template-columns:1fr; gap:10px; padding:10px; }
  .operari .chks .f.chk .l{ font-size:17px; padding:14px 10px; }
  .operari .chks .f.chk.tri .l{ font-size:17px; }
  .targeta{ border:1px solid var(--line-2); border-radius:8px; padding:10px 12px; margin:0 0 10px; background:#fff; }
  .tcap{ font-size:14px; margin-bottom:6px; }
  .xips{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0; }
  .xip{ font-size:13px; padding:3px 8px; border-radius:6px; background:var(--bg-2); border:1px solid var(--line); white-space:nowrap; }
  .xip.ok{ color:#2e7d32; border-color:#a5d6a7; background:#fff; }
  .xip.fet{ color:#1f4e79; border-color:#9dc3e6; background:#fff; }
  .tobs{ font-size:13px; color:var(--ink-2); margin-top:4px; }
  .panel{ border:1px solid var(--line-2); border-left:4px solid var(--mode); border-radius:6px; padding:22px 26px 24px; margin-bottom:28px; background:#fff; }
  .panel.editing{ border-left-color:var(--red); }
  .panel .ph{ display:flex; align-items:baseline; gap:12px; margin-bottom:18px; }
  .panel .ph h2{ margin:0; }
  .panel .ph .sub{ color:var(--ink-2); font-size:14px; }
  .grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 26px; }
  .f{ display:flex; flex-direction:column; gap:5px; min-width:0; }
  .f.wide{ grid-column:1 / -1; }
  .f .l{ font-size:13.5px; color:var(--ink-2); }
  .f .l b{ color:var(--red); font-weight:500; }
  .f .hint{ font-size:12.5px; color:var(--ink-3); }
  /* botó Ajuda al costat d'una mesura (obre la guia de com es mesura) i la guia a pantalla sencera */
  .amb-ajuda{ display:flex; gap:8px; align-items:stretch; }
  .amb-ajuda > input, .amb-ajuda > select{ flex:1 1 auto; min-width:0; }

  .btn-ajuda b{ width:24px; height:24px; border:2px solid #fff; border-radius:50%; color:#fff; font:700 17px/22px "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.6); box-shadow:0 1px 3px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.08); background:rgba(0,40,90,.28); }
  .btn-ajuda:active{ transform:translateY(1px); }
  .operari .btn-ajuda{ width:52px; }
  .guia{ position:fixed; inset:0; z-index:9500; background:#0b1a2b; display:flex; flex-direction:column; }
  .guia-top{ display:flex; align-items:center; gap:10px; padding:8px 12px; color:#fff; background:#07121f; }
  .guia-titol{ font-weight:600; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .guia-idiomes b{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; color:#9fb4c8; cursor:pointer; margin-left:2px; }
  .guia-idiomes b.on{ background:#fff; color:#07121f; }
  .guia-tanca{ background:none; border:0; color:#fff; font-size:24px; line-height:1; cursor:pointer; padding:0 2px 0 6px; }
  .guia-img{ flex:1; min-height:0; width:100%; object-fit:contain; cursor:pointer; background:#0b1a2b; -webkit-user-select:none; user-select:none; }
  .guia-peu{ color:#9fb4c8; font-size:13px; text-align:center; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); }
  body.amb-guia{ overflow:hidden; }
  .v-ok{ color:#2e7d32 !important; font-weight:600; } input.v-ok{ border-color:#a5d6a7; }
  .v-no{ color:#b8432b !important; font-weight:600; } input.v-no{ border-color:#f0b9ad; }
  .v-calc{ color:var(--ink-3) !important; font-style:italic; }
  .f .nota.n-ok{ color:#2e7d32; } .f .nota.n-no{ color:#b8432b; }
  h3.seccio{ grid-column:1 / -1; margin:14px 0 0; padding-bottom:4px; border-bottom:1px solid var(--line-2); font-size:15px; font-weight:600; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 16px; }
  h3.seccio .avui{ font-weight:500; font-size:13px; color:#1f5fbf; }
  h4.seccio{ grid-column:1 / -1; margin:10px 0 0; font-size:14px; font-weight:600; color:var(--ink-2); }
  .seccio-nota{ grid-column:1 / -1; margin:-4px 0 2px; }
  .tl{ display:flex; height:14px; width:100%; max-width:560px; border-radius:4px; overflow:hidden; border:1px solid var(--line-2); } .tl i{ display:block; min-width:0; }
  .t-on{ background:#2e7d32; } .t-pos{ background:#ffb74d; } .t-off{ background:#e6e6e6; }
  .tl-esc{ display:flex; justify-content:space-between; max-width:560px; font-size:11px; color:var(--ink-3); } .tl-esc b{ font-weight:400; }
  .tl-txt{ display:block; font-size:13px; color:#1f5fbf; margin-top:2px; }
  .f .dup{ font-size:12.5px; color:var(--red); }
  .f .info{ padding:7px 0; font-weight:500; }
  .c-verd-fort{ background:#2e7d32 !important; color:#fff !important; }
  .c-verd-suau{ background:#a5d6a7 !important; color:#1d2a1b !important; }
  .c-taronja{ background:#ffb74d !important; color:#1d2a1b !important; }
  .c-vermell{ background:#d32f2f !important; color:#fff !important; font-weight:600; }
  .c-negre{ background:#222 !important; color:#fff !important; }
  td.cel{ border-radius:4px; font-weight:500; white-space:nowrap; }
  .avis{ margin-top:7px; padding:10px 13px; border:3px solid var(--line-2); border-radius:7px; line-height:1.35; background:#fff; text-align:center; }
  .avis .ca{ text-transform:uppercase; font-size:15.5px; font-weight:600; }
  .avis .es{ font-size:13px; color:var(--ink-2); margin-top:4px; }
  .avis.b-verd-fort{ border-color:#2e7d32; } .avis.b-verd-suau{ border-color:#66bb6a; } .avis.b-taronja{ border-color:#fb8c00; } .avis.b-vermell{ border-color:#d32f2f; } .avis.b-negre{ border-color:#222; }
  .focs{ position:fixed; left:0; top:0; width:0; height:0; pointer-events:none; z-index:9999; }

function friendly(err) {
  const m = (err && err.message) || String(err);
  const nn = m.match(/null value in column "(\w+)"/);
  if (nn) { const td = SCHEMA.tables[state.table]; const f = td && fieldDef(td, nn[1]); return `Falta un camp obligatori: ${f ? f.label : nn[1]}.`; }
  if (/row-level security|permission denied/i.test(m)) {
    const taula = (m.match(/for (?:table|relation) "?(\w+)"?/) || [])[1] || (state.table || '');
    const t = treballadorActual();
    return `No tens permís per a aquesta acció${taula ? ' (taula ' + taula + ')' : ''}. El programa et veu com a ${t ? nomTreballador(t) + ', rol ' + t.rol : 'un usuari sense fitxa de treballador (' + (user ? user.email : '') + ')'}; només oficina i administradors poden escriure. Si el rol és correcte, executa el SQL de permisos (042).`;
  }
  for (const k in MSG) if (m.includes(k)) return MSG[k];
  return m;
}

// la connexió pot venir d'un fitxer config.js al costat de la pàgina (versió publicada) o del navegador
function normalitzaUrl(url) {
  url = String(url || '').trim();
  const dash = url.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
  const proj = url.match(/https?:\/\/[a-z0-9-]+\.supabase\.co/i);
  if (dash) return 'https://' + dash[1] + '.supabase.co';
  if (proj) return proj[0];
  return url.replace(/\/+$/, '');
}
function configPredefinida() {
  const p = window.CONFIG_PREDEFINIDA; if (!p || !p.url || !p.key) return null;
  if (/XXXX/.test(p.url) || /XXXX/.test(p.key)) return null;   // encara és la plantilla
  return { url: normalitzaUrl(p.url), key: String(p.key).trim() };
}
function readConfig() {
  try { const c = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null'); if (c && c.url && c.key) return c; } catch (e) {}
  return configPredefinida();
}

// carrega una taula sencera per blocs de 1.000 files (Supabase no en torna més d'un cop)
async function loadTable(t) {
  const pk = (SCHEMA.tables[t] || {}).pk || 'id';
  const BLOC = 1000; let des = 0; const tot = [];
  while (true) {
    const { data, error } = await sb.from(t).select('*').order(pk).range(des, des + BLOC - 1);
    if (error) throw error;
    tot.push(...data);
    if (data.length < BLOC) break;
    des += BLOC;
  }
  cache[t] = tot;
}
// carrega totes les taules; les que no existeixin (fitxer SQL pendent) no bloquegen l'entrada
async function loadAll() {
  const noms = Object.keys(SCHEMA.tables);
  const res = await Promise.allSettled(noms.map(loadTable));
  const faltes = [];
  res.forEach((r, i) => { if (r.status === 'rejected') { cache[noms[i]] = []; faltes.push(noms[i]); } });
  return faltes;
}

  if ($('#canvia-usuari')) $('#canvia-usuari').addEventListener('click', e => { e.preventDefault(); localStorage.removeItem(USUARI_KEY); renderLogin(); });
  $('#lg').addEventListener('submit', async e => {
    e.preventDefault();

    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: String(fd.get('email') || '').trim(), password: fd.get('password') });

async function init() {
  const cfg = readConfig();
  if (!cfg) { renderConfig(); return; }
  try {
    sb = supabase.createClient(cfg.url, cfg.key);
  } catch (e) { renderConfig('La configuració no és vàlida: ' + e.message); return; }
  const { data } = await sb.auth.getSession();
  if (data && data.session) { user = data.session.user; start(); } else renderLogin();
}

async function start() {
  $('#app').innerHTML = `<div class="login"><p>Carregant dades…</p></div>`;
  let faltes = [];
  try { faltes = await loadAll(); }
  catch (e) { renderLogin('No s’han pogut carregar les taules: ' + friendly(e)); return; }
  recordaUsuari();
  renderApp();
  mostraFelicitacions();
  if (faltes.length) toastErr('Taules que la base de dades encara no té: ' + faltes.join(', ') + '. Executa el fitxer SQL que les crea (o «notify pgrst, \'reload schema\'» si acabes de fer-ho).');
}

function renderAppOperari() {

  const t = treballadorActual();
  $('#app').innerHTML = `
    <div class="top">
      <span class="brand" id="brand">Outdoor</span>
      <span class="who">${h(t ? nomCurtTreballador(t) : user.email)} <button class="btn ghost small" id="logout">Surt</button></span>
    </div>
    <div class="shell" style="grid-template-columns:minmax(0,1fr)"><div class="main" id="main"></div></div>`;
  $('#brand').addEventListener('click', () => { state.table = null; state.editing = null; renderApp(); });
  $('#logout').addEventListener('click', async () => { await sb.auth.signOut(); user = null; renderLogin(); });
  const main = $('#main');
  if (!state.table) {
    main.innerHTML = `
      ${t ? '' : '<div class="msg err">El teu usuari no té fitxa de treballador amb aquest correu d’accés: demana a l’oficina que t’hi afegeixin.</div>'}

function renderMain() {
  const main = $('#main');
  document.body.classList.remove('ic-full');
  if (!state.table) {
    main.innerHTML = `
      <h1>Què vols fer?</h1>
      <div class="home">
        <button class="entrada" data-mode="entrada"><strong>Entrada de dades</strong><span>Formularis per afegir registres nous. Les llistes que hi veuràs són només de lectura.</span></button>
        <button class="consulta" data-mode="consulta"><strong>Consulta de dades</strong><span>Llistes amb filtres. Editar és una acció expressa: obre un registre i canvia’l.</span></button>
      </div>
      <h3>Ordre recomanat per entrar un cas nou</h3>
      <p>Administrador i les seves persones → client → lloc → agrupació de facturació → aparells del lloc → jardí o piscina → comptadors → lectures.</p>
      <h3>Facturació</h3>
      <p>${C.rows('factures').filter(r => r.actiu && r.estat === 'esborrany').length} esborranys pendents d’emetre, ${C.rows('factures').filter(r => r.actiu && r.estat === 'emesa').length} factures emeses pendents de cobrar.</p>`;
    main.querySelectorAll('.home button').forEach(b => b.addEventListener('click', () => { state.mode = b.dataset.mode; renderApp(); }));
    return;
  }
  if (SCHEMA.pages[state.table]) { SCHEMA.pages[state.table].render(main); return; }
  const t = state.table, td = SCHEMA.tables[t];
  let html = `<h1>${h(td.label)}</h1>`;
  if (state.mode === 'entrada') {
    html += formHTML(td, state.editing ? C.get(t, state.editing) : null) + recentHTML(td);
  } else {
    if (state.editing) html += formHTML(td, C.get(t, state.editing));
    html += listHTML(td);
  }
  main.innerHTML = html;
  bindMain(td);
  ompleMiniatures(main);
}

/* ---------- Formulari ---------- */
function defaultValue(f) {
  if (f.key in state.keep) return state.keep[f.key];
  if (f.default === 'avui') return avui();
  if (typeof f.default === 'function') return f.default();
  return f.default ?? '';
}

function optionsHTML(f, vals, current) {
  const cur = current === '' || current == null ? null : Number(current);
  let rows = C.rows(f.ref).filter(r => r.actiu || f.inclouInactius || r.id === cur);
  if (f.filter) rows = rows.filter(r => r.id === cur || f.filter(r, vals, C));
  const items = rows.map(r => ({ id: r.id, label: f.optionLabel ? f.optionLabel(r, C) : L(f.ref, r.id), grup: f.optgroup ? f.optgroup(r, vals, C) : null }));
  items.sort((a, b) => a.label.localeCompare(b.label, 'ca'));
  const opt = i => `<option value="${i.id}" ${i.id === cur ? 'selected' : ''}>${h(i.label)}</option>`;
  let out = `<option value="">${f.required ? 'Tria…' : '—'}</option>`;
  if (f.optgroup) {
    const grups = [...new Set(items.map(i => i.grup))].sort((a, b) => ORDRE_GRUPS.indexOf(a) - ORDRE_GRUPS.indexOf(b));
    for (const g of grups) out += `<optgroup label="${h(g)}">${items.filter(i => i.grup === g).map(opt).join('')}</optgroup>`;
  } else out += items.map(opt).join('');
  return out;
}

// caselles múltiples (una per registre de la taula referida), agrupades si el camp té optgroup
function multiHTML(f, vals, marcats) {
  let rows = C.rows(f.ref).filter(r => r.actiu);
  if (f.filter) rows = rows.filter(r => f.filter(r, vals, C)); // les que ja no toquen desapareixen (i no es desen)
  const items = rows.map(r => ({ id: r.id, label: f.optionLabel ? f.optionLabel(r, C) : L(f.ref, r.id), grup: f.optgroup ? f.optgroup(r, vals, C) : null, ordre: r.ordre || 0 }))
    .sort((a, b) => (a.ordre - b.ordre) || a.label.localeCompare(b.label, 'ca'));
  if (!items.length) return `<span class="hint">${h(f.buit || 'cap opció per triar')}</span>`;

/* ---------- Llistes ---------- */
function cellText(td, key, row) {

    case 'multi': return (Array.isArray(v) ? v : []).map(id => { const r = C.get(f.ref, id); return r ? (f.optionLabel ? f.optionLabel(r, C) : L(f.ref, id)) : ''; }).filter(Boolean).join(', ');
    case 'boolean': return v ? 'sí' : 'no';

    case 'select': { const o = f.options.find(o => o[0] === String(v)); return o ? o[1] : String(v); }

function listHTML(td) {

/* ---------- Esdeveniments ---------- */
function formValues(form) {
  const o = {};
  new FormData(form).forEach((v, k) => { o[k] = v; });
  form.querySelectorAll('input[type=checkbox]').forEach(c => { o[c.name] = c.checked; });
  return o;
}

function bindMain(td) {
  const main = $('#main');
  const frm = $('#frm');
  if (frm) {
    frm.addEventListener('change', e => {
      const changed = e.target.name; if (!changed) return;
      const vals = formValues(frm);
      td.fields.filter(f => f.dependsOn === changed).forEach(f => {
        const sel = frm.querySelector(`select[name="${f.key}"]`); if (!sel) return;
        const cur = sel.value;
        sel.innerHTML = optionsHTML(f, vals, ''); // es refan les opcions segons el pare nou; la tria anterior només es manté si encara hi és
        sel.value = cur && sel.querySelector(`option[value="${cur}"]`) ? cur : '';
        if (triaUnica(f, sel)) sel.dispatchEvent(new Event('change', { bubbles: true })); // una sola opció possible: queda triada, i els que en depenen també s'actualitzen
      });
      td.fields.filter(f => f.type === 'multi' && changed !== f.key).forEach(f => {
        const box = frm.querySelector(`[data-multi="${f.key}"]`); if (!box) return;
        const marcats = new Set([...box.querySelectorAll(`[name="${f.key}"]:checked`)].map(e => Number(e.value)));
        box.innerHTML = multiHTML(f, vals, marcats);

    });
    frm.addEventListener('submit', e => { e.preventDefault(); save(td, frm); });
    // Enter en un camp no desa el registre: passa al camp següent (com el tabulador). Desar és el botó Desa.
    frm.addEventListener('keydown', e => {
      const el = e.target; if (e.key !== 'Enter' || !el || el.tagName === 'TEXTAREA' || el.tagName === 'BUTTON' || el.type === 'submit') return;
      e.preventDefault();
      const camps = [...frm.querySelectorAll('input, select, textarea')].filter(x => !x.disabled && x.type !== 'hidden' && !x.closest('[hidden]'));
      const seg = camps[camps.indexOf(el) + 1];

    });
    // mentre s'escriu (input) només es refresquen el context, els duplicats i les notes; els colors, els avisos i la visibilitat
    // s'avaluen quan el valor ja està entrat (change: en sortir del camp o prémer Enter), perquè "2" no surti verd abans d'acabar "2,9"
    const viu = () => { updateCtx(td, frm); checkDups(td, frm); pintaColors(td, frm); aplicaVisibilitat(td, frm); pintaAvisos(td, frm); pintaNotes(td, frm); };
    const escrivint = e => { updateCtx(td, frm); checkDups(td, frm); pintaNotes(td, frm); const el = e.target; const f = el && el.name ? fieldDef(td, el.name) : null; if (f && f.color && f.type === 'number') { el.classList.remove('c-verd-fort', 'c-verd-suau', 'c-taronja', 'c-vermell', 'c-negre'); const box = frm.querySelector(`[data-avis-for="${f.key}"]`); if (box) box.hidden = true; } };
    frm.addEventListener('input', escrivint); frm.addEventListener('change', viu);
    frm.dataset.inicial = '1'; viu(); delete frm.dataset.inicial; // en pintar, els camps amb valor no es buiden encara que ara no toquin
    // registre nou: els desplegables que depenen d'un altre i només tenen una opció (l'únic lloc del client, l'única piscina del lloc…) queden triats
    if (!frm.dataset.id) td.fields.filter(f => f.dependsOn).forEach(f => { const sel = frm.querySelector(`select[name="${f.key}"]`); if (triaUnica(f, sel)) sel.dispatchEvent(new Event('change', { bubbles: true })); });
    // focs artificials quan un valor queda en verd (fort: grans; suau: petits), un cop per canvi de color, i només amb el valor ja entrat

      const el = frm.querySelector(`[name="${f.key}"]`); if (!el) return;

      el.addEventListener('change', () => { const c = f.color(el.value, formValues(frm)); if (c !== darrerColor[f.key]) { darrerColor[f.key] = c; if (c === 'c-verd-fort') focs(el, true); else if (c === 'c-verd-suau') focs(el, false); } });
    });

    // botons de tres estats: sense tocar (buit) -> correcte (verd) -> incorrecte (vermell) -> buit
    frm.querySelectorAll('.f.chk.tri').forEach(w => {
      const inp = w.querySelector('input[data-tristat]'), btn = w.querySelector('.tri-btn'), f = fieldDef(td, inp.name); if (!inp || !btn || !f) return;

      pinta();

    });
    if (td.bindExtras) td.bindExtras(frm, td);
    main.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => obreFitxer(b.dataset.open)));
    main.querySelectorAll('[data-ajuda]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); obreGuia(b.dataset.ajuda); }));
    const cancel = $('#cancel'); if (cancel) cancel.addEventListener('click', () => { state.editing = null; renderMain(); });
    const baixa = $('#baixa'); if (baixa) baixa.addEventListener('click', () => toggleActiu(td));
  }
  main.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', async () => {
    const accio = td.actions(C.get(state.table, state.editing))[Number(b.dataset.action)];
    if (accio.noDesa) { accio.run(); return; } // obrir un PDF no desa res: així el navegador no bloqueja la finestra

// desplegable dependent amb una sola opció real i sense valor: es tria sola (llevat que el camp digui autoUnic: false)
function triaUnica(f, sel) {

const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
function checkDups(td, frm) {
  const editingId = frm.dataset.id ? Number(frm.dataset.id) : null;
  const vals = formValues(frm);
  td.fields.filter(f => f.dup).forEach(f => {
    const box = frm.querySelector(`[data-dup="${f.key}"]`); if (!box) return;
    const v = norm(vals[f.key]);
    if (v.length < 3) { box.textContent = ''; return; }
    let rows = C.rows(state.table).filter(r => r.actiu && r.id !== editingId);
    if (f.dupScope) rows = rows.filter(r => String(r[f.dupScope] ?? '') === String(vals[f.dupScope] ?? ''));
    const hits = rows.filter(r => { const x = norm(r[f.key]); return x && (f.dup === 'exact' ? x === v : (x.includes(v) || v.includes(x))); }).slice(0, 3);
    box.textContent = hits.length ? (f.dup === 'exact' ? 'Ja existeix: ' : 'S’assembla a: ') + hits.map(r => td.display(r, L)).join(' · ') : '';
  });
}
function updateCtx(td, frm) {
  const box = frm.closest('.panel').querySelector('#ctx'); if (!box) return;
  const vals = formValues(frm); const parts = [];
  if (state.table === 'clients') { if (vals.nom) parts.push(['Client', vals.nom]); }
  else {
    const lid = (fieldDef(td, 'lloc_id') && vals.lloc_id) || (fieldDef(td, '_lloc') && vals._lloc);
    if (lid) { const l = C.get('llocs', lid); if (l) { parts.push(['Lloc', l.nom]); if (!td.ctxSenseClient) parts.push(['Client', L('clients', l.client_id)]); } }
    else if (fieldDef(td, 'client_id') && vals.client_id) parts.push(['Client', L('clients', vals.client_id)]);
    else if (fieldDef(td, 'administrador_id') && vals.administrador_id) parts.push(['Administrador', L('administradors', vals.administrador_id)]);
  }
  box.innerHTML = parts.map(p => `<span><span class="k">${h(p[0])}</span><span class="v">${h(p[1])}</span></span>`).join('');
  box.style.display = parts.length ? '' : 'none';
}

function pintaAvisos(td, frm) {

function focs(el, gran) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!el.getBoundingClientRect) return;
  const r = el.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const n = gran ? 56 : 28, dur = gran ? 1800 : 900, dist = gran ? 190 : 95;
  const cont = document.createElement('div'); cont.className = 'focs'; document.body.appendChild(cont);
  const colors = ['#2e7d32', '#66bb6a', '#ffd54f', '#ff7043', '#42a5f5', '#ab47bc'];
  const parts = [];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'); const a = Math.random() * Math.PI * 2, d = dist * (0.45 + Math.random() * 0.55), sz = (gran ? 8 : 4) + Math.random() * (gran ? 8 : 4);
    p.style.background = colors[i % colors.length]; p.style.width = p.style.height = sz + 'px'; cont.appendChild(p); parts.push({ p, a, d });
  }
  const t0 = performance.now();
  const pas = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    parts.forEach(({ p, a, d }) => { p.style.transform = `translate(${cx + Math.cos(a) * d * e}px, ${cy + Math.sin(a) * d * e + 35 * k * k}px)`; p.style.opacity = String(1 - k); });
    if (k < 1) requestAnimationFrame(pas); else cont.remove();
  };
  requestAnimationFrame(pas);
}

function aplicaVisibilitat(td, frm) {

  const vals = formValues(frm);
  const tot = !!(frm.closest('.panel').querySelector('#mostra-tot') || {}).checked;
  td.fields.filter(f => f.visible).forEach(f => {
    const w = frm.querySelector(`[data-fkey="${f.key}"]`); if (!w) return;
    const toca = f.visible(vals, C);
    const el = frm.querySelector(`[name="${f.key}"]`);
    if (f.neteja && !toca && el && el.value !== '' && !frm.dataset.inicial) { el.value = ''; el.dataset.netejat = '1'; } // camp que no toca amb aquesta tria: es buida (p. ex. els minuts quan passes de "posta de sol" a "sensor")
    if (f.neteja && toca && el && el.value === '' && el.dataset.netejat && !frm.dataset.id) { const d = defaultValue(f); if (d !== '' && d != null) el.value = String(d); delete el.dataset.netejat; } // i si torna a tocar, recupera el valor predeterminat
    const teValor = el && el.value !== '';
    w.hidden = !(toca || tot || teValor);
    const t = w.querySelector('[data-toca]'); if (t) t.textContent = toca ? 'toca avui' : (f.quan ? '(' + f.quan + ')' : '');
  });
}

/* ---------- GPS: troba el lloc més proper ---------- */
function gpsExtresHTML(row) {
  return `<button type="button" class="btn" id="gps">Localitza’m</button>
    <label class="chk" style="padding:0"><input type="checkbox" id="mostra-tot"> Mostra tots els paràmetres</label>
    <span class="nota" id="gps-nota"></span>`;
}
function gpsBind(frm, td) {
  const nota = $('#gps-nota'), btn = $('#gps');
  const posa = (llocId, msg) => {
    const sel = frm.querySelector('select[name="_lloc"]'); if (!sel) return;
    sel.value = String(llocId); sel.dispatchEvent(new Event('change', { bubbles: true }));
    const ps = frm.querySelector('select[name="piscina_id"]');
    if (ps) { const opts = [...ps.options].filter(o => o.value); if (opts.length === 1) { ps.value = opts[0].value; ps.dispatchEvent(new Event('change', { bubbles: true })); } }
    nota.textContent = msg;
  };
  $('#mostra-tot').addEventListener('change', () => aplicaVisibilitat(td, frm));
  btn.addEventListener('click', () => {
    if (!navigator.geolocation) { nota.textContent = 'Aquest navegador no té GPS.'; return; }
    btn.disabled = true; nota.textContent = 'Buscant…';
    navigator.geolocation.getCurrentPosition(pos => {
      btn.disabled = false;
      const { latitude: la, longitude: lo } = pos.coords;
      const gl = frm.querySelector('[name="gps_lat"]'), gn = frm.querySelector('[name="gps_lng"]');
      if (gl) gl.value = la.toFixed(6); if (gn) gn.value = lo.toFixed(6);
      const cand = C.rows('llocs').filter(l => l.actiu && l.latitud != null && l.longitud != null).map(l => ({ l, d: distKm(la, lo, Number(l.latitud), Number(l.longitud)) })).sort((a, b) => a.d - b.d);
      if (!cand.length) { nota.textContent = 'Cap lloc té coordenades encara: tria’l a mà.'; return; }
      const m = cand[0];
      if (m.d > 2) { nota.textContent = `El lloc més proper (${m.l.nom}) és a ${m.d.toFixed(1)} km: tria’l a mà.`; return; }
      posa(m.l.id, `${m.l.nom} (${Math.round(m.d * 1000)} m)`);
    }, err => { btn.disabled = false; nota.textContent = 'No s’ha pogut llegir el GPS (' + err.message + '). Tria el lloc a mà.'; }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });
  // en obrir el formulari nou, intenta-ho sol si ja tenim permís
  if (!frm.dataset.id && navigator.geolocation && navigator.permissions) {
    navigator.permissions.query({ name: 'geolocation' }).then(p => { if (p.state === 'granted') btn.click(); }).catch(() => {});
  }
}

function showFormError(msg) {
  $('#ferr').innerHTML = `<div class="msg err">${h(msg)}</div>`;
  window.scrollTo({ top: 0 });
}

function readRaw(fields, box) {
  const o = {};
  fields.forEach(f => {
    if (f.type === 'multi') { if (box.querySelector(`[data-multi="${f.key}"]`)) o[f.key] = [...box.querySelectorAll(`[name="${f.key}"]:checked`)].map(e => Number(e.value)); return; }
    const el = box.querySelector(`[name="${f.key}"]`); if (!el || el.disabled) return;
    if (f.type === 'boolean') o[f.key] = el.checked;
    else if (f.type === 'file') {
      o[f.key] = el.files && el.files[0] ? el.files[0] : null;
      const a = box.querySelector(`[name="${f.key}__actual"]`); o[f.key + '__actual'] = a ? a.value : '';
    } else o[f.key] = el.value;
  });
  return o;
}
function faltaObligatori(fields, box) {
  for (const f of fields) {
    if (!f.required) continue;
    const el = box.querySelector(`[name="${f.key}"]`);
    if (el && !el.disabled && el.value === '') { showFormError(`Falta "${f.label}".`); el.focus(); return true; }
  }
  return false;
}
async function buildPayload(fields, raw) {
  const payload = {};
  for (const f of fields) {
    if (f.virtual || f.type === 'info' || !(f.key in raw)) continue;
    const v = raw[f.key];
    switch (f.type) {
      case 'boolean': payload[f.key] = !!v; break;
      case 'tristat': payload[f.key] = v === 'true' || v === true ? true : v === 'false' || v === false ? false : null; break;
      case 'multi': payload[f.key] = Array.isArray(v) ? v : []; break;
      case 'number': payload[f.key] = v === '' || v == null ? null : Number(v); break;
      case 'integer': payload[f.key] = v === '' || v == null ? null : parseInt(v, 10); break;
      case 'ref': payload[f.key] = v === '' || v == null ? null : Number(v); break;
      case 'datetime': payload[f.key] = v === '' || v == null ? null : deLocalDT(v); break;
      case 'hidden': payload[f.key] = v === '' || v == null ? null : (isNaN(Number(v)) ? v : Number(v)); break;
      case 'select': payload[f.key] = v === '' || v == null ? null : (f.bool ? v === 'true' : (f.num ? Number(v) : v)); break;
      case 'file': {
        if (v) {
          let fitxer = v, nom = v.name.replace(/[^\w.\-]+/g, '_');
          if (f.imatge) { fitxer = await quadraImatge(v, f.imatge); nom = nom.replace(/\.[^.]+$/, '') + '.jpg'; }
          const path = `${f.folder}/${Date.now()}_${nom}`;
          const { error } = await sb.storage.from(BUCKET).upload(path, fitxer, f.imatge ? { contentType: 'image/jpeg' } : undefined);
          if (error) throw new Error('No s’ha pogut pujar el fitxer: ' + friendly(error));
          payload[f.key] = path;
        } else payload[f.key] = raw[f.key + '__actual'] || null;
        break;
      }
      default: payload[f.key] = typeof v === 'string' ? (v.trim() === '' ? null : v.trim()) : (v ?? null);
    }
  }
  return payload;
}

async function save(td, frm) {
  const t = state.table;
  const id = frm.dataset.id ? (td.pk ? frm.dataset.id : Number(frm.dataset.id)) : null;
  $('#ferr').innerHTML = '';
  if (faltaObligatori(td.fields, frm)) return;
  const btn = frm.querySelector('button[type=submit]');
  try {
    const raw = readRaw(td.fields, frm);
    const payload = await buildPayload(td.fields, raw);
    if (td.abansDesar) td.abansDesar(payload, id);
    if (td.validate) { const m = td.validate(payload, id); if (m) { showFormError(m); return; } }
    btn.disabled = true;
    const abans = id ? { ...(C.get(t, id) || {}) } : null;
    const res = id
      ? await sb.from(t).update(payload).eq(td.pk || 'id', id)
      : await sb.from(t).insert(payload).select(td.pk || 'id').single();
    btn.disabled = false;
    if (res.error) { showFormError(friendly(res.error)); return; }
    if (!id && td.despresCrear && res.data) { try { await td.despresCrear(res.data.id, payload, frm); } catch (e) { toastErr(friendly(e)); } }
    await loadTable(t);
    if (id && td.despresDesar) { try { await td.despresDesar(id, payload, abans); } catch (e) { toastErr(friendly(e)); } }
    if (id) {
      state.editing = null; toast('Canvis desats');
    } else if ((td.children || td.obreEnCrear) && res.data && res.data.id) {
      // el registre acabat de crear queda obert perquè s'hi puguin afegir els aparells (o les fotos d'un report)
      state.editing = res.data.id; state.keep = {}; toast(td.obreEnCrear || 'Desat. Ara pots afegir-hi els aparells.');
    } else {
      // en entrada de dades, conserva les referències per encadenar entrades
      state.keep = {};
      td.fields.filter(f => f.type === 'ref' || f.type === 'select').forEach(f => { if (f.virtual) { if (raw[f.key]) state.keep[f.key] = Number(raw[f.key]); } else if (payload[f.key] != null) state.keep[f.key] = payload[f.key]; });
      toast('Desat');
    }
    renderMain();
  } catch (e) {
    if (btn) btn.disabled = false;
    showFormError(friendly(e));
  }
}

// desa els canvis del formulari obert sense tancar-lo (abans d'emetre, previsualitzar…)
async function desaFormulari(td, frm) {
  const id = frm.dataset.id ? (td.pk ? frm.dataset.id : Number(frm.dataset.id)) : null;
  if (!id) return true;
  $('#ferr').innerHTML = '';
  if (faltaObligatori(td.fields, frm)) return false;
  try {
    const payload = await buildPayload(td.fields, readRaw(td.fields, frm));
    if (td.abansDesar) td.abansDesar(payload, id);
    if (td.validate) { const m = td.validate(payload, id); if (m) { showFormError(m); return false; } }
    const abans = { ...(C.get(state.table, id) || {}) };
    const res = await sb.from(state.table).update(payload).eq(td.pk || 'id', id);
    if (res.error) { showFormError(friendly(res.error)); return false; }
    await loadTable(state.table);
    if (td.despresDesar) { try { await td.despresDesar(id, payload, abans); } catch (e) { toastErr(friendly(e)); } }
    return true;
  } catch (e) { showFormError(friendly(e)); return false; }
}

async function addChild(td, childTable, box) {

  $('#ferr').innerHTML = '';
  if (faltaObligatori(ct.fields, box)) return;
  try {
    const payload = await buildPayload(ct.fields, readRaw(ct.fields, box));
    payload[ch.fk] = state.editing;

    await loadTable(childTable);

async function removeChild(childTable, id) {

/* ---------- PDF de la factura ---------- */
const fmtEur = n => { const neg = Number(n) < 0; const [i, d] = Math.abs(Number(n || 0)).toFixed(2).split('.'); return (neg ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d + ' €'; };

function pdfFactura(f) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const emp = C.rows('empresa').find(e => e.actiu) || {};
  const client = C.get('clients', f.client_id) || {};
  const tema = f.tema || (teJardi(f) ? 'verd' : 'blau');
  const acc = ACCENT[tema], ink = [40, 40, 40], grey = [125, 125, 125];
  const linies = C.rows('factura_linies').filter(l => l.actiu && Number(l.factura_id) === f.id).sort((a, b) => (a.ordre - b.ordre) || (a.id - b.id));
  const M = 20, R = 210 - M, W = R - M;
  const label = (t, x, y, opt) => { doc.setTextColor(...grey); doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.text(t, x, y, opt); };
  const text = (t, x, y, size, style, color, opt) => { doc.setTextColor(...(color || ink)); doc.setFont('helvetica', style || 'normal'); doc.setFontSize(size || 10); doc.text(t, x, y, opt); };

  if (f.estat === 'esborrany') { doc.setTextColor(232, 232, 232); doc.setFont('helvetica', 'bold'); doc.setFontSize(64); doc.text('ESBORRANY', 105, 170, { align: 'center', angle: 30 }); }

  // logotip
  const lw = 62, lh = lw * LOGO_RATIO;
  doc.addImage(LOGOS[tema], 'JPEG', (210 - lw) / 2, 14, lw, lh);

  // capçalera esquerra: número, data, venciment
  let y = 52;
  label('FACTURA', M, y);
  text(f.numero_complet || 'ESBORRANY', M, y + 8.5, 20, 'bold', acc);
  label('DATA', M, y + 18);
  text(dmy(f.data_factura), M, y + 23, 11);
  if (f.data_venciment) { label('VENCIMENT', M, y + 31); text(dmy(f.data_venciment), M, y + 36, 11); }

  // capçalera dreta: client
  const rx = 112, rw = R - rx;
  const nom = f.client_nom || client.nom || '';
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5);
  const nomL = doc.splitTextToSize(nom, rw);
  text(nomL, rx, y, 11.5, 'bold');
  let ry = y + nomL.length * 5.2 + 1.5;
  const adreca = f.client_adreca || [client.adreca, [client.cp, client.poblacio].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
  // el carrer en una línia i el codi postal amb la població en una altra
  const parts = adreca.split(', '); const ultim = parts.length > 1 ? parts.pop() : null;
  const adrL = [...doc.splitTextToSize(parts.join(', '), rw), ...(ultim ? doc.splitTextToSize(ultim, rw) : [])];
  if (adreca) { text(adrL, rx, ry, 10); ry += adrL.length * 5; }
  const nif = f.client_nif || client.nif; if (nif) text('NIF ' + nif, rx, ry + 0.5, 10);

  // línia de separació
  y = 94; doc.setDrawColor(...acc); doc.setLineWidth(0.5); doc.line(M, y, R, y);

  // concepte
  y = 104; label('CONCEPTE', M, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
  const cL = doc.splitTextToSize(f.concepte || '', W);
  text(cL, M, y + 6, 10.5); y = y + 6 + cL.length * 5.3;
  if (f.periode_inici && f.periode_fi) { text('Període del ' + dmy(f.periode_inici) + ' al ' + dmy(f.periode_fi), M, y + 1, 8.5, 'normal', grey); y += 6; }

  // línies (només a les factures manuals)
  if (linies.length) {
    y += 8;
    const ambDte = linies.some(l => l.dte != null && l.dte !== '');
    const cx = ambDte ? { qty: 128, preu: 150, dte: 166, imp: R } : { qty: 138, preu: 163, imp: R };
    const descW = (cx.qty - 12) - (M + 2);
    doc.setFillColor(242, 242, 242); doc.rect(M, y, W, 7, 'F');
    label('DESCRIPCIÓ', M + 2, y + 4.6); label('Nº', cx.qty, y + 4.6, { align: 'right' }); label('IMPORT', cx.preu, y + 4.6, { align: 'right' });
    if (ambDte) label('DTE', cx.dte, y + 4.6, { align: 'right' });
    label('TOTAL', cx.imp - 2, y + 4.6, { align: 'right' });
    y += 7;
    doc.setDrawColor(225); doc.setLineWidth(0.2);
    for (const l of linies) {
      const dL = doc.splitTextToSize(l.descripcio, descW);
      const rh = Math.max(6.5, dL.length * 4.8 + 2);
      text(dL, M + 2, y + 4.6, 9.5);
      text(String(l.quantitat).replace('.', ','), cx.qty, y + 4.6, 9.5, 'normal', ink, { align: 'right' });
      text(fmtEur(l.preu_unitari), cx.preu, y + 4.6, 9.5, 'normal', ink, { align: 'right' });
      if (ambDte) text(l.dte != null && l.dte !== '' ? String(Number(l.dte)).replace('.', ',') + ' %' : '', cx.dte, y + 4.6, 9.5, 'normal', ink, { align: 'right' });
      text(fmtEur(l.base), cx.imp - 2, y + 4.6, 9.5, 'normal', ink, { align: 'right' });
      y += rh; doc.line(M, y, R, y);
    }
    const suma = linies.reduce((t, l) => t + Number(l.base || 0), 0);
    text('Base imposable', cx.preu, y + 5.2, 9.5, 'bold', ink, { align: 'right' });
    text(fmtEur(suma), cx.imp - 2, y + 5.2, 9.5, 'bold', ink, { align: 'right' });
    y += 8;
  }

  // pagament
  const py = Math.max(y + 14, 196);
  label('PAGAMENT', M, py);
  const forma = f.forma_pagament || client.forma_pagament;
  const venc = f.data_venciment ? dmy(f.data_venciment) : null;
  const ptxt = forma === 'domiciliacio'
    ? 'Rebut domiciliat al compte del client' + (venc ? ', amb càrrec el ' + venc : '') + '.'
    : 'Transferència al compte ' + (f.compte_cobrament_text || '') + (venc ? ', abans del ' + venc : '') + '.';
  text(doc.splitTextToSize(ptxt, 95), M, py + 5.5, 9.5);

  // totals
  const tx = 118, ty = 232, tv = R - 3;
  const fila = (t, v, yy, big) => { text(t, tx + 3, yy, big ? 11 : 9.5, big ? 'bold' : 'normal'); text(v, tv, yy, big ? 12 : 10, big ? 'bold' : 'normal', big ? acc : ink, { align: 'right' }); };
  fila('Base imposable', fmtEur(f.base_imponible), ty);
  fila('IVA ' + String(Number(f.iva_percent)).replace('.', ',') + ' %', fmtEur(f.quota_iva), ty + 7.5);
  doc.setFillColor(243, 243, 243); doc.rect(tx, ty + 12, R - tx, 10, 'F');
  fila('TOTAL FACTURA', fmtEur(f.total), ty + 18.8, true);

  // codi de client, a baix a l'esquerra
  const codi = f.codi_client || client.codi_client;
  if (codi) { label('CODI CLIENT', M, 262); text(String(codi), M, 267.5, 10); }

  // peu: dades de l'empresa
  doc.setDrawColor(205); doc.setLineWidth(0.2); doc.line(M, 279, R, 279);
  const peu1 = [emp.nom, emp.nif].filter(Boolean).join('   ·   ');
  const peu2 = [[emp.adreca, [emp.cp, emp.poblacio].filter(Boolean).join(' ')].filter(Boolean).join(', '), emp.telefon ? 'T ' + emp.telefon : '', emp.email].filter(Boolean).join('   ·   ');
  text(peu1, 105, 284, 8, 'normal', grey, { align: 'center' });
  text(peu2, 105, 288.5, 8, 'normal', grey, { align: 'center' });
  return doc;
}

async function generaPdfFactura(id, { obrir = true } = {}) {
  const f = C.get('factures', id);
  const doc = pdfFactura(f);
  const blob = doc.output('blob');
  if (obrir) window.open(URL.createObjectURL(blob), '_blank');
  if (f.estat === 'esborrany') return null;
  const path = 'factures/' + (f.numero_complet || 'id' + f.id).replace(/\//g, '-') + '.pdf';
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { upsert: true, contentType: 'application/pdf' });
  if (error) throw new Error('No s’ha pogut desar el PDF: ' + friendly(error));
  const res = await sb.from('factures').update({ pdf: path }).eq('id', id);
  if (res.error) throw new Error(friendly(res.error));
  await loadTable('factures');
  return path;
}

async function generaPdfsPendents() {
  const pend = C.rows('factures').filter(r => r.actiu && r.estat !== 'esborrany' && !r.pdf);
  let n = 0;
  for (const f of pend) {
    try { await generaPdfFactura(f.id, { obrir: false }); n++; }
    catch (e) { toastErr(friendly(e)); break; }
  }
  return n;
}

// cobrament previst d'un esborrany: la regla d'emet_factura (termini en dies des de la data de factura i, si el client té dia fix, el següent dia fix)
function cobramentPrevist(f) {
  const c = C.get('clients', f.client_id); if (!c || !f.data_factura) return '';
  let v = sumaDies(deYmd(f.data_factura), Number(c.termini_pagament_dies) || 0);
  const dia = Number(c.dia_pagament) || 0;
  if (dia) v = v.getDate() <= dia ? new Date(v.getFullYear(), v.getMonth(), dia, 12) : new Date(v.getFullYear(), v.getMonth() + 1, dia, 12);
  return ymd(v);
}
// un esborrany recurrent «sobra» si la seva agrupació s'ha donat de baixa o ha acabat abans del període facturat
function motiuSobrant(f) {
  if (f.origen !== 'recurrent' || !f.agrupacio_id) return '';
  const a = C.get('agrupacions', f.agrupacio_id);
  if (!a) return 'l’agrupació ja no existeix';
  if (!a.actiu) return 'agrupació donada de baixa';
  if (a.data_fi && f.periode_inici && a.data_fi < f.periode_inici) return 'agrupació acabada el ' + dmy(a.data_fi);
  return '';
}
function renderFacturacio(main) {

  const drafts = factures.filter(r => r.estat === 'esborrany').sort((a, b) => (a.data_factura + a.id).localeCompare(b.data_factura + b.id));
  const delMes = drafts.filter(r => String(r.data_factura || '').slice(0, 7) === mesTria), totalMes = delMes.reduce((t, r) => t + Number(r.total || 0), 0);

  const avisTocats = tocatsAMa ? `\n\nAtenció: ${tocatsAMa} d’aquests esborranys s’ha${tocatsAMa === 1 ? '' : 'n'} modificat a mà després de crear-l${tocatsAMa === 1 ? 'o' : 'os'} (import, concepte, data…): aquests canvis es perdran.` : '';

  const pendents = factures.filter(r => r.estat === 'emesa').sort((a, b) => String(a.data_venciment).localeCompare(String(b.data_venciment)));
  const sensePdf = factures.filter(r => r.estat !== 'esborrany' && !r.pdf);
  const filaD = r => `<tr class="${String(r.data_factura || '').slice(0, 7) === mesTria ? '' : 'off'}"><td>${dmy(r.data_factura)}</td><td>${h(llocsFactura(r))}</td><td>${h(L('clients', r.client_id))}${motiuSobrant(r) ? `<br><b class="v-no">${h(motiuSobrant(r))}</b>` : ''}</td><td>${h(r.concepte)}</td><td class="hint">${r.periode_inici ? dmy(r.periode_inici) + ' – ' + dmy(r.periode_fi) : ''}</td><td class="num">${eur(r.base_imponible)}</td><td class="num">${eur(r.total)}</td><td>${dmy(cobramentPrevist(r))}</td>
    <td class="num"><button class="btn ghost small" data-obre="${r.id}">Obre</button> <button class="btn small" data-emet="${r.id}">Emet</button></td></tr>`;
  const filaP = r => `<tr><td>${h(r.numero_complet)}</td><td>${dmy(r.data_factura)}</td><td>${h(L('clients', r.client_id))}</td><td>${h(r.concepte)}</td><td class="num">${eur(r.total)}</td><td>${dmy(r.data_venciment)}</td>
    <td class="num"><button class="btn ghost small" data-obre="${r.id}">Obre</button> ${r.pdf ? `<button class="btn ghost small" data-pdf="${h(r.pdf)}">PDF</button>` : ''}</td></tr>`;

function pdfPressupost(pr) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const emp = C.rows('empresa').find(e => e.actiu) || {};
  const client = C.get('clients', pr.client_id) || {};
  const tema = pr.tema === 'verd' ? 'verd' : 'blau';
  const ink = [40, 40, 40], grey = [125, 125, 125];
  const linies = C.rows('pressupost_tasca_linies').filter(l => l.actiu && Number(l.pressupost_id) === pr.id).sort((a, b) => (a.ordre - b.ordre) || (a.id - b.id));
  const M = 22, R = 210 - M, W = R - M, LIMIT = 236;
  const text = (t, x, y, size, style, color, opt) => { doc.setTextColor(...(color || ink)); doc.setFont('helvetica', style || 'normal'); doc.setFontSize(size || 10); doc.text(t, x, y, opt); };
  const wrap = (t, w, size, style) => { doc.setFont('helvetica', style || 'normal'); doc.setFontSize(size); return doc.splitTextToSize(String(t || ''), w); };
  const peu = () => {
    const l1 = [emp.nom, emp.nif ? 'NIF: ' + emp.nif : '', [emp.adreca, [emp.cp, emp.poblacio].filter(Boolean).join(' ')].filter(Boolean).join(' '), emp.telefon ? 'Tel: ' + emp.telefon : ''].filter(Boolean).join(' | ');
    text(wrap(l1, W, 7.5), 105, 286, 7.5, 'normal', grey, { align: 'center' });
  };
  // condicions, sempre a baix de tot de l'última pàgina
  const condicions = () => {
    let cy = 252;
    text(pr.nota_iva || '', M, cy, 10.5); cy += 7;
    text('FORMA DE PAGAMENT:', M, cy, 10.5); text(pr.forma_pagament || '', M + 44, cy, 10.5); cy += 7;
    text('VALIDESA DE LA OFERTA:', M, cy, 10.5); text(wrap(pr.validesa, W - 48, 10.5), M + 48, cy, 10.5);
  };
  const capcalera = () => {
    const lw = 62, lh = lw * LOGO_RATIO;
    doc.addImage(LOGOS[tema], 'JPEG', (210 - lw) / 2, 12, lw, lh);
    let y = 51;
    text('PRESSUPOST:', M, y, 12.5); text(pr.numero || 'ESBORRANY', M + 33, y, 12.5, 'bold');
    text('DATA:', M, y + 9, 12.5); text(dmy(pr.data), M + 16, y + 9, 12.5, 'bold');
    const rx = 118, rw = R - rx;
    const nomL = wrap(client.nom, rw, 10);
    text(nomL, rx, y - 3, 10); let ry = y - 3 + nomL.length * 4.8;
    if (client.adreca) { text(client.adreca, rx, ry + 1, 10); ry += 6; }
    const cpp = [client.cp, client.poblacio].filter(Boolean).join('   '); if (cpp) { text(cpp, rx, ry + 1, 10); ry += 6; }
    if (client.nif) text(client.nif, rx, ry + 1, 10);
    return Math.max(y + 24, ry + 14);
  };
  let y = capcalera();
  const titL = wrap(String(pr.titol || '').toUpperCase(), W, 15.5, 'bold');
  text(titL, M, y + 8, 15.5, 'bold'); y += 8 + titL.length * 7;
  if (pr.descripcio) { const dL = wrap(pr.descripcio, W, 12.5); text(dL, M, y + 4, 12.5); y += 4 + dL.length * 5.9; }
  // capçalera de la taula
  const ambDte = linies.some(l => l.dte != null && l.dte !== '' && Number(l.dte) > 0);
  const cx = ambDte ? { qty: M + 7, desc: M + 13, preu: 143, dte: 162, tot: R - 2 } : { qty: M + 7, desc: M + 13, preu: 160, tot: R - 2 };
  y += 8; text('PREU UNIT', cx.preu, y, 11, 'normal', grey, { align: 'right' });
  if (ambDte) text('DTE', cx.dte, y, 11, 'normal', grey, { align: 'right' });
  text('TOTAL', cx.tot, y, 11, 'normal', grey, { align: 'right' }); y += 7;
  const descW = cx.preu - 28 - cx.desc;
  for (const l of linies) {
    const dL = wrap(l.descripcio, descW, 12);
    const rh = dL.length * 5.6 + 3.5;
    if (y + rh > LIMIT) { peu(); doc.addPage(); y = 24; }
    text(String(Number(l.quantitat)).replace('.', ','), cx.qty, y, 12, 'normal', ink, { align: 'right' });
    text(dL, cx.desc, y, 12);
    text(fmtEur(l.preu_unitari).replace(' €', ''), cx.preu, y, 12, 'normal', ink, { align: 'right' });
    if (ambDte) text(l.dte != null && l.dte !== '' && Number(l.dte) > 0 ? String(Number(l.dte)).replace('.', ',') + ' %' : '', cx.dte, y, 12, 'normal', ink, { align: 'right' });
    text(fmtEur(l.base).replace(' €', ''), cx.tot, y, 12, 'normal', ink, { align: 'right' });
    y += rh;
  }
  // subtotal
  if (y + 14 > LIMIT) { peu(); doc.addPage(); y = 24; }
  y += 5; doc.setDrawColor(...ink); doc.setLineWidth(0.4); doc.rect(cx.preu - 26, y - 6.5, R - (cx.preu - 26), 10.5);
  text('SUBTOTAL', cx.preu - 22, y, 12.5, 'bold'); text(fmtEur(pr.base_imponible).replace(' €', ''), cx.tot, y, 12.5, 'bold', ink, { align: 'right' });
  condicions();
  peu();
  return doc;
}

/* ---------- Pressupostos d'agrupació: clàusules de text i PDF ---------- */
// Text d'una clàusula: una línia per paràgraf; "· " al davant = punt de llista; **negreta**.
function paragrafsClausula(txt) {
  return String(txt || '').replace(/\r/g, '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const li = /^(?:[·•]|-|\*(?!\*))\s+/.test(l); // punt de llista: "· ", "- " o "* " (no confondre amb **negreta**)
    const cos = li ? l.replace(/^(?:[·•]|-|\*(?!\*))\s+/, '') : l;
    const runs = []; cos.split('**').forEach((t, i) => { if (t) runs.push({ t, b: i % 2 === 1 }); });
    return { li, runs };
  });
}
// paraules amb estil; "glue" = va enganxada a l'anterior (sense espai entremig)
function tokensRics(runs) {
  const toks = []; let prevEndsSpace = true;
  runs.forEach(r => {
    const startsSpace = /^\s/.test(r.t), endsSpace = /\s$/.test(r.t);
    r.t.split(/\s+/).filter(Boolean).forEach((p, i) => toks.push({ t: p, b: r.b, glue: i === 0 && !startsSpace && !prevEndsSpace && toks.length > 0 }));
    prevEndsSpace = endsSpace;
  });
  return toks;
}
// escriu un paràgraf justificat (amb trossos en negreta i punt de llista si cal); salta(y, alçada) torna la y on escriure (nova pàgina si cal)
function escriuParagraf(doc, par, x, y, w, size, salta, color) {
  const lh = size * 0.3528 * 1.38, ind = par.li ? 7 : 0, wx = w - ind;
  const prepara = () => { doc.setFontSize(size); doc.setTextColor(...(color || [40, 40, 40])); }; // el peu de pàgina canvia mida i color
  prepara();
  // amplades sense kerning: el PDF tampoc no l'aplica, i així les paraules queden on toca
  const mida = t => doc.getStringUnitWidth(t, { doKerning: false }) * size / doc.internal.scaleFactor;
  const sw = b => { doc.setFont('helvetica', b ? 'bold' : 'normal'); return mida(' '); };
  const toks = tokensRics(par.runs).map(t => { doc.setFont('helvetica', t.b ? 'bold' : 'normal'); return { ...t, w: mida(t.t) }; });
  const lines = []; let cur = [], curW = 0;
  toks.forEach(t => {
    const gap = cur.length && !t.glue ? sw(t.b) : 0;
    if (cur.length && curW + gap + t.w > wx) { lines.push(cur); cur = [{ ...t, glue: false }]; curW = t.w; }
    else { cur.push(t); curW += gap + t.w; }
  });
  if (cur.length) lines.push(cur);
  const esTitol = lines.length === 1 && toks.length > 0 && toks.every(t => t.b); // una línia sola en negreta ("GESPA:", "REG:"): que no quedi sola a peu de pàgina
  lines.forEach((ln, i) => {
    y = salta(y, i === 0 ? lh * (esTitol ? 4 : Math.min(2, lines.length)) : lh); prepara(); // un títol necessita lloc per a ell i dues línies del paràgraf següent
    if (par.li && i === 0) { doc.setFont('helvetica', 'normal'); doc.text('•', x + 2, y); }
    const last = i === lines.length - 1;
    const gaps = ln.filter((t, j) => j > 0 && !t.glue).length;
    const natural = ln.reduce((acc, t, j) => acc + t.w + (j > 0 && !t.glue ? sw(t.b) : 0), 0);
    const extra = !last && gaps > 0 ? (wx - natural) / gaps : 0;
    let cx = x + ind;
    ln.forEach((t, j) => { if (j > 0 && !t.glue) cx += sw(t.b) + extra; doc.setFont('helvetica', t.b ? 'bold' : 'normal'); doc.text(t.t, cx, y); cx += t.w; });
    y += lh;
  });
  return y;
}
// clàusules que surten en un pressupost: les obligatòries de cada part inclosa + les opcionals triades, per part i ordre
function clausulesPressupost(pr) {
  const ambits = ORDRE_PARTS.filter(a => a === 'general' || pr['inclou_' + a]);
  const triades = new Set((pr.clausules_ids || []).map(Number));

    .sort((a, b) => (ambits.indexOf(a.ambit) - ambits.indexOf(b.ambit)) || ((a.ordre || 0) - (b.ordre || 0)) || (a.id - b.id));
}

// signa per defecte en Xavier Amat (si hi és); si no, qui ha entrat
function signantPerDefecte() { const x = C.rows('treballadors').find(t => t.actiu && /^xavier$/i.test(String(t.nom || '').trim()) && /^amat/i.test(String(t.cognoms || '').trim())); if (x) return x.id; const t = treballadorActual(); return t ? t.id : ''; }
// maqueta un paràgraf (línies de paraules amb amplades, en Arial) sense dibuixar-lo; serveix per decidir els salts de pàgina abans d'escriure
function maquetaParagraf(doc, par, w, size) {
  const lh = size * 0.3528 * 1.38, ind = par.li ? 7 : 0, wx = w - ind;
  doc.setFontSize(size);
  const mida = t => doc.getStringUnitWidth(t, { doKerning: false }) * size / doc.internal.scaleFactor;
  const sw = b => { doc.setFont('helvetica', b ? 'bold' : 'normal'); return mida(' '); };
  const toks = tokensRics(par.runs).map(t => { doc.setFont('helvetica', t.b ? 'bold' : 'normal'); return { ...t, w: mida(t.t) }; });
  const lines = []; let cur = [], curW = 0;
  toks.forEach(t => { const gap = cur.length && !t.glue ? sw(t.b) : 0; if (cur.length && curW + gap + t.w > wx) { lines.push(cur); cur = [{ ...t, glue: false }]; curW = t.w; } else { cur.push(t); curW += gap + t.w; } });
  if (cur.length) lines.push(cur);
  const esTitol = lines.length === 1 && toks.length > 0 && toks.every(t => t.b);
  return { par, lines, lh, ind, wx, esTitol, size, sw };
}
function dibuixaLiniaRica(doc, m, i, x, y, color) {
  const ln = m.lines[i], last = i === m.lines.length - 1;
  doc.setFontSize(m.size); doc.setTextColor(...color);
  if (m.par.li && i === 0) { doc.setFont('helvetica', 'normal'); doc.text('•', x + 2, y); }
  const gaps = ln.filter((t, j) => j > 0 && !t.glue).length;
  const natural = ln.reduce((acc, t, j) => acc + t.w + (j > 0 && !t.glue ? m.sw(t.b) : 0), 0);
  const extra = !last && gaps > 0 ? (m.wx - natural) / gaps : 0;
  let cx = x + m.ind;
  ln.forEach((t, j) => { if (j > 0 && !t.glue) cx += m.sw(t.b) + extra; doc.setFont('helvetica', t.b ? 'bold' : 'normal'); doc.text(t.t, cx, y); cx += t.w; });
}

  const logo = () => { const lw = 62, lh = lw * LOGO_RATIO; doc.addImage(LOGOS[tema], 'JPEG', (210 - lw) / 2, 12, lw, lh); return 12 + lh; };
  const novaPagina = () => { peu(); doc.addPage(); logo(); return TOP; };
  // capçalera: títol, lloc (pàl·lid) i concepte (sense cap rètol)
  let y = logo() + 16;
  const tL = wrap(String(r.titol || '').toUpperCase(), W, 15, 'bold'); text(tL, M, y, 15, 'bold'); y += tL.length * 7.5 + 2;
  text(lloc.nom ? lloc.nom + (client.nom ? ' · ' + client.nom : '') + (lloc.adreca ? ' · ' + lloc.adreca : '') : '', M, y, 9.5, 'normal', pale); y += 9;
  const blocs = [];   // paràgrafs maquetats: primer el concepte (en negreta), després l'informe
  if (r.concepte) paragrafsClausula(r.concepte).forEach(par => blocs.push({ m: maquetaParagraf(doc, { ...par, runs: par.runs.map(x => ({ ...x, b: true })) }, W, 11), despres: 2 }));
  if (blocs.length) blocs[blocs.length - 1].despres = 6;
  paragrafsClausula(r.text).forEach(par => blocs.push({ m: maquetaParagraf(doc, par, W, 11), despres: 2.6 }));
  // tancament: població i mes, i signatura (Arial: nom a 13, titulació a 9,5)
  const signant = r.signant_id ? C.get('treballadors', r.signant_id) : null;
  const titols = signant && signant.titol_signatura ? String(signant.titol_signatura).split(/\r?\n/).map(t => t.trim()).filter(Boolean) : [];
  const ALT_TANCA = 8 + 20 + (signant ? 6 + titols.length * 4.5 : 0) + 4;
  // flux de línies: on cau cada una (amb les mateixes regles de vídues que els pressupostos); si el tancament quedés sol en una pàgina,
  // es força un salt abans de les tres últimes línies de text perquè l'acompanyin
  const totalLinies = blocs.reduce((n, b) => n + b.m.lines.length, 0);
  const simula = (forcaAbans) => {
    let yy = y, pag = 1, idx = 0, liniesPag = 0; const pos = [];
    for (const b of blocs) {
      for (let i = 0; i < b.m.lines.length; i++, idx++) {
        const need = i === 0 ? b.m.lh * (b.m.esTitol ? 4 : Math.min(2, b.m.lines.length)) : b.m.lh;
        if (idx === forcaAbans || yy + need > LIMIT) { pag++; yy = TOP; liniesPag = 0; }
        pos.push({ pag, y: yy }); yy += b.m.lh; liniesPag++;
      }
      yy += b.despres;
    }
    const tancaSol = yy + ALT_TANCA > LIMIT;   // el tancament passaria de pàgina i hi quedaria sol
    return { pos, tancaSol, liniesPag };
  };
  let sim = simula(-1), forca = -1;
  if (sim.tancaSol && totalLinies > 0) {
    forca = Math.max(0, totalLinies - Math.min(3, Math.max(1, sim.liniesPag - 1)));
    const dinsPar = []; blocs.forEach(b => b.m.lines.forEach((l, i) => dinsPar.push(i)));   // posició de cada línia dins del seu paràgraf
    while (forca > 0 && dinsPar[forca] === 1) forca--;   // que no quedi la primera línia d'un paràgraf sola a baix de la pàgina anterior
    sim = simula(forca);
  }
  // dibuix
  let idx = 0, pagActual = 1;
  for (const b of blocs) {
    for (let i = 0; i < b.m.lines.length; i++, idx++) {
      const p = sim.pos[idx];
      while (pagActual < p.pag) { novaPagina(); pagActual++; }
      dibuixaLiniaRica(doc, b.m, i, M, p.y, ink);
      y = p.y + b.m.lh;
    }
    y += b.despres;
  }
  if (y + ALT_TANCA > LIMIT) { y = novaPagina(); }
  y += 8;
  const d = new Date(String(r.data || avui()).slice(0, 10) + 'T00:00:00Z');
  text((lloc.poblacio || client.poblacio || '') + ',  ' + MESOS_CAT[d.getUTCMonth()] + ' de ' + d.getUTCFullYear(), M, y, 11); y += 20;
  if (signant) {
    const sx = M + W * 0.75;
    text(nomTreballador(signant), sx, y, 13, 'normal', ink, { align: 'center' }); y += 5.5;
    titols.forEach(t => { text(t, sx, y, 9.5, 'normal', ink, { align: 'center' }); y += 4.5; });
  }
  peu();
  return doc;
}

// Venciment que toca segons les condicions del proveïdor: termini en dies i, si en té, dia fix de pagament
// (la mateixa regla que les factures de client: si el dia ja ha passat, el dia fix del mes següent).
function vencimentEsperat(prov, dataFactura) {
  if (!prov || !dataFactura) return null;
  const d = new Date(String(dataFactura).slice(0, 10) + 'T00:00:00Z'); if (isNaN(d.getTime())) return null;
  d.setUTCDate(d.getUTCDate() + (Number(prov.termini_dies) || 0));
  const dia = Number(prov.dia_pagament) || 0;
  if (dia) { if (d.getUTCDate() > dia) { d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + 1); } d.setUTCDate(dia); }
  return d.toISOString().slice(0, 10);
}
const condicionsProveidor = p => (Number(p.termini_dies) || 0) + ' dies' + (p.dia_pagament ? ', dia ' + p.dia_pagament : '');
// Estat del venciment d'una factura de proveïdor: coincideix amb les condicions (verd), no coincideix (taronja) o l'hem calculat nosaltres (gris).
// r = la factura desada; vals = el formulari (si s'està editant), que preval.
function estatVenciment(r, vals) {
  const v = vals || r || {};
  const prov = v.proveidor_id ? C.get('proveidors', v.proveidor_id) : null;
  const venc = v.data_venciment ? String(v.data_venciment).slice(0, 10) : '';
  const esperat = vencimentEsperat(prov, v.data_factura);
  if (!prov || !esperat) return { classe: '', text: '' };
  const cond = condicionsProveidor(prov);
  if (!venc) return { classe: '', text: `segons les condicions del proveïdor (${cond}) tocaria el ${dmy(esperat)}` };
  const calculat = r && r.venciment_origen === 'calculat' && venc === String(r.data_venciment || '').slice(0, 10);
  if (venc === esperat) return calculat
    ? { classe: 'v-calc', text: `la factura no diu venciment: calculat amb les condicions del proveïdor (${cond})` }
    : { classe: 'v-ok', text: `coincideix amb les condicions del proveïdor (${cond})` };
  return { classe: 'v-no', text: `no coincideix amb les condicions del proveïdor (${cond}): tocaria el ${dmy(esperat)}` };
}

// Interpreta l'anotació manuscrita "CXA · 6001001 · 21/04/2026" que ha llegit la IA: compte, persona i data.
function conformitatLlegida(d) {
  const text = d.conformitat ? String(d.conformitat).trim() : '';
  const codi = (String(d.compte_despesa || '').match(/[0-9]{7}/) || [])[0] || (text.match(/[0-9]{7}/) || [])[0] || '';
  const compte = codi ? C.rows('comptes_despesa').find(c => c.actiu && c.codi === codi) : null;
  let inicials = senseAccents(String(d.conforme_inicials || '')).replace(/[^A-Za-z]/g, '').toUpperCase();
  if (!inicials && text) { const m = senseAccents(text).match(/^\s*C\s*([A-Za-z]{1,4})\b/); if (m) inicials = m[1].toUpperCase(); }
  const candidats = inicials ? C.rows('treballadors').filter(t => potConformar(t) && inicialsTreballador(t) === inicials) : [];
  const treb = candidats.length === 1 ? candidats[0] : null;
  let data = null;
  if (d.conforme_data) { const v = String(d.conforme_data).trim(); let m;
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) data = v;
    else if ((m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))) data = (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); }
  if (!data && text) { const m = text.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if (m) data = (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); }
  if (data && isNaN(new Date(data + 'T00:00:00Z').getTime())) data = null;
  const avisos = [];
  if (!text && !codi && !inicials) avisos.push('sense conformitat');
  else {
    if (!compte) avisos.push(codi ? 'compte ' + codi + ' desconegut' : 'sense compte');
    if (!treb) avisos.push(inicials ? (candidats.length ? 'inicials ' + inicials + ' ambigües' : 'inicials ' + inicials + ' desconegudes') : 'sense inicials');
    if (!data) avisos.push('sense data de conformitat');
  }
  const html = avisos.length ? `<b class="c-taronja">${h(avisos.join(', '))}</b>` : `conforme C${h(inicials)} · ${h(codi)} ${h(compte.nom)} · ${dmy(data)}`;
  return { compte_id: compte ? compte.id : null, treballador_id: treb ? treb.id : null, data, text: text || null, html };
}

async function pujaFactures(fitxers) {

        const ins = await sb.from('proveidors').insert({ nom: data.proveidor_nom, nif: data.proveidor_nif || null, observacions: 'Creat automàticament en llegir ' + file.name }).select('id').single();
        if (ins.error) throw new Error('proveïdor: ' + friendly(ins.error));

      const vencLlegit = /^\d{4}-\d{2}-\d{2}$/.test(String(data.data_venciment || '')) ? data.data_venciment : null;
      const esperat = vencimentEsperat(prov, dataFactura);

/* ---------- Línies de les factures de proveïdor i albarans que en surten ----------
   La IA llegeix cada línia i l'anotació manuscrita del costat (M1, D7, STOCK, OFICINA…). Les que van a un lloc fan un albarà
   per lloc amb la data de la factura i preu de venda = cost × % del proveïdor; stock i grup/oficina no en fan. Sempre amb l'OK de l'oficina. */
const cosLecturaFactura = path => ({ path, comptes: C.rows('comptes_despesa').filter(c => c.actiu).map(c => c.codi + ' — ' + c.nom), persones: C.rows('treballadors').filter(potConformar).map(t => inicialsTreballador(t) + ' — ' + nomTreballador(t)), llocs: C.rows('llocs').filter(l => l.actiu).map(l => l.nom) });
const DESTI_ESPECIALS = { STOCK: 'stock', ESTOC: 'stock', MAGATZEM: 'stock', GRUP: 'grup', GRUPO: 'grup', OFICINA: 'grup', OFI: 'grup' };
const normCodi = x => senseAccents(String(x || '')).toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
// de l'anotació manuscrita a la destinació: { tipus, lloc_id } o null si no se sap (llavors ho tria l'oficina)
function destiDesDeText(text) {
  const c = normCodi(text); if (!c) return null;
  if (DESTI_ESPECIALS[c]) return { tipus: DESTI_ESPECIALS[c], lloc_id: null };
  const llocs = C.rows('llocs').filter(l => l.actiu);
  const un = cands => cands.length === 1 ? { tipus: 'lloc', lloc_id: cands[0].id } : null;
  return un(llocs.filter(l => normCodi(l.nom) === c)) || un(llocs.filter(l => normCodi(l.nom).split(' ').includes(c))) || un(llocs.filter(l => normCodi(l.nom).startsWith(c + ' '))) || null;
}
const factorVenda = prov => prov && prov.percentatge_venda != null && prov.percentatge_venda !== '' ? Number(prov.percentatge_venda) / 100 : 1;
const costLinia = l => l.import != null && l.import !== '' && Number(l.quantitat) ? Number(l.import) / Number(l.quantitat) : Number(l.preu_unitari || 0);
const pvpLinia = (l, prov) => Math.round(costLinia(l) * factorVenda(prov) * 100) / 100;
const liniesDeFactura = fpId => C.rows('factura_proveidor_linies').filter(l => l.actiu && Number(l.factura_proveidor_id) === Number(fpId)).sort((a, b) => (a.ordre || 0) - (b.ordre || 0) || a.id - b.id);
function liniesPendentsText(fpId) {
  const ls = liniesDeFactura(fpId), aLloc = ls.filter(l => l.desti_tipus === 'lloc' && l.lloc_id).length, sense = ls.filter(l => !l.desti_tipus).length;
  return `${aLloc} per a albarà, ${ls.length - aLloc - sense} de stock o grup${sense ? `, <b class="c-taronja">${sense} sense destinació</b>` : ''}`;
}
async function desaLiniesLlegides(fpId, linies) {
  const files = (Array.isArray(linies) ? linies : []).filter(l => l && l.descripcio).map((l, i) => {
    const d = destiDesDeText(l.desti);
    return { factura_proveidor_id: fpId, ordre: i + 1, descripcio: String(l.descripcio).trim(), quantitat: Number(l.quantitat) || 1,
      preu_unitari: l.preu_unitari != null && l.preu_unitari !== '' ? Number(l.preu_unitari) : null, import: l.import != null && l.import !== '' ? Number(l.import) : null,
      iva_percent: l.iva_percent != null && l.iva_percent !== '' ? Number(l.iva_percent) : null,
      desti_llegit: l.desti ? String(l.desti).trim() : null, desti_tipus: d ? d.tipus : null, lloc_id: d ? d.lloc_id : null };
  });
  if (!files.length) return 0;
  const r = await sb.from('factura_proveidor_linies').insert(files); if (r.error) throw new Error(friendly(r.error));
  return files.length;
}
// torna a llegir el PDF d'una factura ja entrada i en refà les línies (les que ja tenen albarà no es toquen)
async function llegeixLiniesPdf(fpId) {
  const f = C.get('factures_proveidor', fpId); if (!f || !f.pdf) { toastErr('Aquesta factura no té PDF'); return; }
  const fetes = liniesDeFactura(fpId).filter(l => l.albara_id).length;
  if (fetes && !confirm(`Hi ha ${fetes} líni${fetes === 1 ? 'a' : 'es'} que ja tenen albarà: es mantenen. La resta es tornen a llegir del PDF. Continuo?`)) return;
  toast('Llegint el PDF…');
  const { data, error } = await sb.functions.invoke('llegeix-factura', { body: cosLecturaFactura(f.pdf) });

// crea un albarà per cada lloc amb les línies pendents (amb l'OK de qui ho fa)
async function creaAlbaransProveidor(fpId) {
  const fp = C.get('factures_proveidor', fpId); if (!fp) return;
  const prov = C.get('proveidors', fp.proveidor_id), pct = prov && prov.percentatge_venda != null && prov.percentatge_venda !== '' ? Number(prov.percentatge_venda) : null;
  const pend = liniesDeFactura(fpId).filter(l => !l.albara_id && l.desti_tipus === 'lloc' && l.lloc_id);
  if (!pend.length) { toastErr('Cap línia pendent amb lloc'); return; }
  const sense = liniesDeFactura(fpId).filter(l => !l.albara_id && !l.desti_tipus).length;
  const grups = new Map(); pend.forEach(l => { const k = Number(l.lloc_id); if (!grups.has(k)) grups.set(k, []); grups.get(k).push(l); });
  const resum = [...grups.entries()].map(([llocId, ls]) => { const lloc = C.get('llocs', llocId) || {}; return `• ${lloc.nom || 'lloc ' + llocId} (${L('clients', lloc.client_id)}): ` + ls.map(l => `${String(l.quantitat).replace('.', ',')} × ${l.descripcio} a ${eur(pvpLinia(l, prov))}`).join('; ') + ` = ${eur(ls.reduce((t, l) => t + Math.round(Number(l.quantitat) * pvpLinia(l, prov) * 100) / 100, 0))}`; });
  const text = `Es crearan ${grups.size} albar${grups.size === 1 ? 'à' : 'ans'} amb data ${dmy(fp.data_factura)} (preu de venda = cost × ${pct == null ? '100' : String(pct).replace('.', ',')} %, sense IVA):\n\n${resum.join('\n')}${sense ? `\n\n(${sense} líni${sense === 1 ? 'a' : 'es'} sense destinació queden pendents.)` : ''}\n\nD’acord?`;
  if (!confirm(text)) return;
  let fets = 0;
  for (const [llocId, ls] of grups) {
    const lloc = C.get('llocs', llocId); if (!lloc || !lloc.client_id) { showFormError(`El lloc ${(lloc || {}).nom || llocId} no té client`); continue; }
    const alb = await sb.from('albarans').insert({ client_id: lloc.client_id, lloc_id: lloc.id, data: fp.data_factura || avui(), descripcio: `${prov ? prov.nom : 'Proveïdor'} · factura ${fp.numero || 'sense número'}`, factura_proveidor_id: fp.id, observacions: `Creat des de la factura de proveïdor ${fp.numero || ''} (${prov ? prov.nom : ''}), preu de venda = cost × ${pct == null ? 100 : pct} %` }).select('id').single();
    if (alb.error) { showFormError('Albarà: ' + friendly(alb.error)); break; }
    const lin = await sb.from('albara_linies').insert(ls.map((l, i) => ({ albara_id: alb.data.id, ordre: i + 1, descripcio: l.descripcio, quantitat: Number(l.quantitat), preu_unitari: pvpLinia(l, prov), preu_cost: Math.round(costLinia(l) * 100) / 100 })));
    if (lin.error) { showFormError('Línies de l’albarà: ' + friendly(lin.error)); break; }
    const upd = await sb.from('factura_proveidor_linies').update({ albara_id: alb.data.id }).in('id', ls.map(l => l.id));
    if (upd.error) { showFormError(friendly(upd.error)); break; }
    fets++;
  }
  await Promise.all([loadTable('albarans'), loadTable('albara_linies'), loadTable('factura_proveidor_linies')]);
  if (fets) toast(`${fets} albar${fets === 1 ? 'à creat' : 'ans creats'}`);
  renderMain();
}
